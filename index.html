<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Shyam Bhajan Sangrah — Community Bhajan Library</title>
<meta name="description" content="A community library of bhajans from live satsangs — scales, singers, lyrics, and one-tap YouTube timestamps." />
<meta name="theme-color" content="#0d0a1a" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🪕</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@300;400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0d0a1a;
  --bg2:#131024;
  --surface:#1a1530;
  --surface2:#241d42;
  --surface3:#2d2452;
  --line:#372e5e;
  --line-soft:#2a2350;
  --text:#f4eedb;
  --dim:#a89dc9;
  --dim2:#7d729f;
  --gold:#f0a838;
  --gold-2:#ffc768;
  --gold-dark:#3a2c12;
  --teal:#38bfa7;
  --teal-dim:rgba(56,191,167,.12);
  --red:#e26565;
  --radius:14px;
  --shadow:0 8px 28px rgba(0,0,0,.35);
  --font-display:"Marcellus","Tiro Devanagari Hindi",serif;
  --font-body:"Mukta",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1000px 500px at 50% -120px, rgba(240,168,56,.13), transparent 65%),
    radial-gradient(700px 500px at 100% 20%, rgba(56,191,167,.05), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font-family:var(--font-body)}
input,select,textarea{
  font-family:var(--font-body);
  width:100%;padding:12px 14px;font-size:15px;
  background:var(--surface2);color:var(--text);
  border:1px solid var(--line);border-radius:10px;outline:none;
  transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,168,56,.12)}
input::placeholder,textarea::placeholder{color:var(--dim2)}
label{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:7px}

/* ---------- keys strip ---------- */
.keys{display:flex;height:8px}
.keys div{flex:1}
.keys .w{background:#efe8d3}.keys .b{background:#070510}

/* ---------- header ---------- */
.wrap{max-width:900px;margin:0 auto;padding:0 18px 110px}
header{text-align:center;padding:44px 0 10px;position:relative}
header::before{
  content:"";position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  width:min(560px,90vw);height:230px;pointer-events:none;
  background:radial-gradient(closest-side, rgba(240,168,56,.16), transparent 75%);
  animation:breathe 5s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
.mantra{font-family:var(--font-display);color:var(--gold);letter-spacing:.45em;font-size:15px;text-indent:.45em;position:relative}
h1{
  font-family:var(--font-display);font-weight:400;font-size:clamp(36px,6.5vw,54px);
  margin:10px 0 4px;line-height:1.15;position:relative;
  background:linear-gradient(180deg,#fdf6e3 15%,var(--gold-2) 85%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.tagline{color:var(--dim);font-size:15px;max-width:520px;margin:6px auto 0;line-height:1.65;font-weight:300;position:relative}
.diya{width:190px;height:1px;margin:24px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative}
.diya::after{content:"❉";position:absolute;top:-12px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:15px;text-shadow:0 0 14px rgba(240,168,56,.8)}
.diya::before,
.diya .side{content:""}

/* ---------- identity bar ---------- */
.idbar{display:flex;justify-content:center;align-items:center;gap:10px;margin:20px 0 4px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.idbar b{color:var(--teal);font-weight:600}
.linkbtn{background:none;border:none;color:var(--gold);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0 26px;position:sticky;top:10px;z-index:20}
.tab{
  padding:10px 22px;border-radius:999px;font-size:14.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);background:rgba(19,16,36,.85);backdrop-filter:blur(10px);color:var(--dim);
  transition:all .18s;
}
.tab:hover{color:var(--text);border-color:var(--dim2)}
.tab.active{
  color:var(--gold-2);border-color:var(--gold);
  background:linear-gradient(180deg,var(--gold-dark),rgba(58,44,18,.5));
  box-shadow:0 0 22px rgba(240,168,56,.22);
}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar input{flex:2;min-width:180px}
.toolbar select{flex:1;min-width:140px}

/* ---------- stats ---------- */
.stats{display:flex;gap:12px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.stat{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
  padding:10px 22px;text-align:center;min-width:110px;
}
.stat b{display:block;font-family:var(--font-display);font-size:24px;color:var(--gold-2);font-weight:400}
.stat span{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}

/* ---------- cards ---------- */
.list{display:flex;flex-direction:column;gap:13px}
.card{
  background:linear-gradient(155deg,var(--surface),#171232);
  border:1px solid var(--line-soft);border-left:3px solid var(--gold);
  border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  transition:transform .18s, border-color .18s, box-shadow .18s;
  animation:rise .3s ease both;position:relative;overflow:hidden;
}
.card::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;
  background:radial-gradient(420px 140px at 0% 0%, rgba(240,168,56,.09), transparent 70%);
}
.card:hover{transform:translateY(-3px);border-color:var(--line);box-shadow:0 12px 34px rgba(0,0,0,.45), 0 0 0 1px rgba(240,168,56,.12)}
.card:hover::after{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.card h3{font-family:var(--font-display);font-weight:400;font-size:20px;margin-bottom:9px;line-height:1.3}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta .src{font-size:12.5px;color:var(--dim)}
.notes{font-size:13.5px;color:var(--dim);margin-top:10px;font-style:italic;font-weight:300}
.by{font-size:11px;color:var(--dim2);margin-top:10px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- chips ---------- */
.chip-scale{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:5px;
  font-size:11.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;
}
.chip-scale .key{width:8px;height:13px;border-radius:2px;border:1px solid #888;display:inline-block}
.chip-scale.white{background:#efe8d3;color:#141024;border:1px solid #c9bfa0}
.chip-scale.white .key{background:#fff}
.chip-scale.black{background:#120e22;color:#efe8d3;border:1px solid #564c8b}
.chip-scale.black .key{background:#000}
.chip-singer{
  display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;
  font-size:11.5px;font-weight:600;color:var(--teal);white-space:nowrap;
  border:1px solid rgba(56,191,167,.45);background:var(--teal-dim);
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:10px 17px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;
  border:none;text-decoration:none;white-space:nowrap;transition:transform .12s, box-shadow .12s;
}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#231604;box-shadow:0 3px 14px rgba(240,168,56,.35)}
.btn-gold:hover{box-shadow:0 5px 20px rgba(240,168,56,.5)}
.btn-teal{background:var(--teal-dim);border:1px solid rgba(56,191,167,.5);color:var(--teal)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--dim);padding:9px 12px}
.btn-ghost:hover{color:var(--text)}
.btn-ghost.danger{color:var(--red)}
.btn-big{padding:14px 30px;font-size:15px;border-radius:12px}

/* ---------- lives ---------- */
.live-card{border-left:3px solid var(--teal)}
.live-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.thumb{
  width:168px;aspect-ratio:16/9;border-radius:10px;object-fit:cover;flex-shrink:0;
  border:1px solid var(--line);display:block;background:var(--surface2);
  transition:transform .18s;
}
a.thumb-link{position:relative;display:block;flex-shrink:0}
a.thumb-link::after{
  content:"▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:26px;text-shadow:0 2px 12px rgba(0,0,0,.9);
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.45));border-radius:10px;
  opacity:.85;transition:opacity .15s;
}
a.thumb-link:hover::after{opacity:1}
a.thumb-link:hover .thumb{transform:scale(1.03)}
@media (max-width:560px){.thumb{width:100%}a.thumb-link{width:100%}}
.setlist{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:12px;display:flex;flex-direction:column;gap:7px}
.setrow{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  text-decoration:none;padding:10px 13px;border-radius:10px;background:var(--surface2);
  transition:background .14s;
}
.setrow:hover{background:var(--surface3)}
.setrow .t{color:var(--gold-2);font-variant-numeric:tabular-nums;font-size:13px;min-width:58px;font-weight:600}
.setrow .n{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow .left{display:flex;gap:12px;align-items:center;min-width:0}
.setrow .right{display:flex;gap:6px;align-items:center;flex-shrink:0}

/* ---------- forms ---------- */
.panel{
  background:linear-gradient(155deg,var(--surface),#171232);
  border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:24px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow);
}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:180px}
.subpanel{padding:16px;border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:14px}
.lyrics-box{padding:16px;border:1px solid var(--line-soft);border-radius:12px;background:rgba(56,191,167,.04);display:flex;flex-direction:column;gap:14px}
.lyrics-box .lbl{font-size:13px;font-weight:700;color:var(--teal);letter-spacing:.06em}
.hint{font-size:12.5px;color:var(--dim2);margin-top:6px;font-weight:300}
.err{color:var(--red);font-size:13.5px}
textarea{min-height:120px;resize:vertical;line-height:1.8}
textarea.mono{font-family:ui-monospace,monospace;font-size:13.5px}

/* ---------- bulk preview ---------- */
.preview{border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
.preview-head{padding:11px 15px;background:var(--surface2);font-size:13px;font-weight:700;color:var(--gold-2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.preview-head span{color:var(--dim);font-weight:400}
.preview-rows{max-height:340px;overflow-y:auto}
.prow{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line-soft)}
.prow .num{color:var(--dim2);font-size:12px;min-width:24px;text-align:right}
.prow input{padding:8px 10px;font-size:13.5px}
.prow .time{max-width:112px;font-family:ui-monospace,monospace}
.prow .x{background:none;border:none;color:var(--red);cursor:pointer;font-size:15px;padding:4px}

/* ---------- empty ---------- */
.empty{
  text-align:center;padding:60px 20px;color:var(--dim);
  border:1px dashed var(--line);border-radius:var(--radius);font-weight:300;line-height:1.7;
}
.empty .om{font-size:34px;display:block;margin-bottom:12px;opacity:.6}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(6,4,14,.82);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 26px 70px rgba(0,0,0,.65);animation:pop .2s ease;
}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal-head h3{font-family:var(--font-display);font-weight:400;font-size:21px}
.modal-body{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.lyrics-text{
  white-space:pre-wrap;line-height:2;font-size:16.5px;font-family:var(--font-display);
  background:var(--surface2);border-radius:12px;padding:20px;border:1px solid var(--line-soft);
}

/* ---------- toast ---------- */
#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface3);border:1px solid var(--teal);color:var(--teal);
  padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .25s;z-index:60;box-shadow:var(--shadow);
  max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.error{border-color:var(--red);color:var(--red)}

/* ---------- setup screen ---------- */
.setup{max-width:640px;margin:40px auto;line-height:1.8;font-weight:300}
.setup h2{font-family:var(--font-display);font-weight:400;color:var(--gold-2);margin-bottom:14px}
.setup ol{padding-left:22px;display:flex;flex-direction:column;gap:10px}
.setup code{background:var(--surface2);padding:2px 8px;border-radius:6px;font-size:13px;color:var(--gold-2)}
.setup a{color:var(--teal)}

.loading{text-align:center;padding:80px 20px;color:var(--dim)}
.pulse{animation:pulse 1.4s ease infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

footer{text-align:center;margin-top:60px;color:var(--dim2);font-size:12.5px;font-weight:300}
footer .m{font-family:var(--font-display);color:var(--gold);letter-spacing:.3em;font-size:13px;margin-bottom:6px}

@media (max-width:560px){
  .card-top{flex-direction:column}
  .actions{width:100%}
  .actions .btn-gold{flex:1}
  .stats{gap:8px}.stat{min-width:90px;padding:8px 14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="keys" aria-hidden="true" id="keystrip"></div>

<div class="wrap">
  <header>
    <div class="mantra">॥ जय श्री श्याम ॥</div>
    <h1>Shyam Bhajan Sangrah</h1>
    <p class="tagline">A living community library of bhajans from live satsangs — scale, singer, lyrics, and one tap to the exact moment on YouTube.</p>
    <div class="diya"></div>
    <div class="idbar" id="idbar" style="display:none">
      You are contributing as <b id="whoami"></b>
      <button class="linkbtn" onclick="setName()">change name</button>
    </div>
  </header>

  <div id="app"></div>

  <footer>
    <div class="m">॥ हारे का सहारा, खाटू श्याम हमारा ॥</div>
    Made with 🧡 by the satsang community
  </footer>
</div>

<div id="toast"></div>

     FIREBASE CONFIG — paste your own config from the Firebase console
     (Project settings → Your apps → Web app → SDK setup and config)

<script>
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyDc1U4bQChgOAey9Yvk5JH2LzAJ-hzWEJs",
  authDomain: "shyam-baba-bhajan-d5ab4.firebaseapp.com",
  projectId: "shyam-baba-bhajan-d5ab4",
  storageBucket: "shyam-baba-bhajan-d5ab4.firebasestorage.app",
  messagingSenderId: "310040535078",
  appId: "1:310040535078:web:e613d7e142296ea4e086e7"
};
</script>

<script type="module">
/* ================= data & helpers ================= */
const SCALES = [
  ["C","Safed 1",0],["C#","Kali 1",1],["D","Safed 2",0],["D#","Kali 2",1],
  ["E","Safed 3",0],["F","Safed 4",0],["F#","Kali 3",1],["G","Safed 5",0],
  ["G#","Kali 4",1],["A","Safed 6",0],["A#","Kali 5",1],["B","Safed 7",0],
];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// harmonium strip
$("keystrip").innerHTML = Array.from({length:36},(_,i)=>`<div class="${[1,3,6,8,10].includes(i%12)?"b":"w"}"></div>`).join("");

function getVideoId(url){
  if(!url) return null;
  try{
    const u = new URL(url.trim());
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1).split("/")[0]||null;
    if(u.pathname.startsWith("/live/")) return u.pathname.split("/")[2]||null;
    if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2]||null;
    return u.searchParams.get("v");
  }catch{ return null; }
}
function parseTs(str){
  if(!str) return 0;
  const s = String(str).trim();
  if(/^\d+$/.test(s)) return parseInt(s,10);
  const p = s.split(":").map(x=>parseInt(x,10));
  if(p.some(isNaN)) return 0;
  if(p.length===3) return p[0]*3600+p[1]*60+p[2];
  if(p.length===2) return p[0]*60+p[1];
  return 0;
}
function fmtTime(sec){
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h>0 ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;
}
const yt = (vid,sec)=>`https://www.youtube.com/watch?v=${vid}${sec?`&t=${sec}s`:""}`;

function parseBulk(text){
  return text.split("\n").map(l=>l.trim()).filter(Boolean).map((line,i)=>{
    const m = line.match(/(\d{1,2}:\d{1,2}(?::\d{1,2})?)/);
    let time="", name=line;
    if(m){ time=m[1]; name=(line.slice(0,m.index)+" "+line.slice(m.index+m[1].length)).trim(); }
    name = name.replace(/^[\s\-–—|•:.)\]〉>]+/,"").replace(/[\s\-–—|•:(\[〈<]+$/,"").trim();
    return name ? {key:"r"+i+Date.now(), name, time} : null;
  }).filter(Boolean);
}

function scaleChip(w,small){
  const info = SCALES.find(s=>s[0]===w);
  if(!info) return "";
  return `<span class="chip-scale ${info[2]?"black":"white"}" title="${info[1]}"><span class="key"></span>${info[0]} · ${info[1]}</span>`;
}
const singerChip = (n)=> n ? `<span class="chip-singer">🎤 ${esc(n)}</span>` : "";

function toast(msg, isErr){
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (isErr ? " error" : "");
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.className="", 3200);
}

/* ================= contributor name ================= */
function myName(){ return localStorage.getItem("bhajan-name") || ""; }
window.setName = function(){
  const n = prompt("Your name (shown with bhajans you add):", myName());
  if(n !== null){
    localStorage.setItem("bhajan-name", n.trim());
    renderId();
  }
};
function renderId(){
  const n = myName();
  $("idbar").style.display = "flex";
  $("whoami").textContent = n || "Anonymous bhakt";
}

/* ================= firebase ================= */
const cfg = window.FIREBASE_CONFIG || {};
const configured = cfg.apiKey && !cfg.apiKey.startsWith("PASTE");

if(!configured){
  $("app").innerHTML = `
  <div class="setup panel">
    <h2>⚙️ One-time setup (≈10 minutes)</h2>
    <p>This app needs its own free database so everyone shares the same bhajan library. Do this once:</p>
    <ol>
      <li>Go to <a href="https://console.firebase.google.com" target="_blank" rel="noreferrer">console.firebase.google.com</a> → <b>Add project</b> (any name, e.g. <code>shyam-bhajan</code>). Google Analytics: off.</li>
      <li>In the project: <b>Build → Firestore Database → Create database</b> → Start in <b>test mode</b> → choose a location → Enable.</li>
      <li>Go to <b>Rules</b> tab and set:<br><code>allow read, write: if true;</code> inside <code>match /{document=**}</code>, then Publish. <i>(Open community — anyone can add.)</i></li>
      <li>Click the <b>⚙️ Project settings → Your apps → Web (&lt;/&gt;)</b> → register app → copy the <code>firebaseConfig</code> values.</li>
      <li>Open this <code>index.html</code> file, find <code>FIREBASE_CONFIG</code> near the bottom, and paste your values.</li>
      <li>Upload to GitHub Pages / Netlify — done. Share the link with everyone! 🎉</li>
    </ol>
  </div>`;
  throw new Error("Firebase not configured");
}

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(cfg);
const db = getFirestore(app);
const bhajansCol = collection(db, "bhajans");
const sessionsCol = collection(db, "sessions");

/* ================= state ================= */
let bhajans = [], sessions = [], ready = {b:false, s:false};
let tab = "bhajans", search = "", scaleF = "", singerF = "", editingId = null;
let bulkRows = [];

$("app").innerHTML = `<div class="loading pulse">🪕 Loading the sangrah…</div>`;
renderId();

onSnapshot(query(bhajansCol, orderBy("name")), snap => {
  bhajans = snap.docs.map(d => ({id:d.id, ...d.data()}));
  ready.b = true; render();
}, err => { console.error(err); toast("Could not load bhajans — check Firestore rules.", true); });

onSnapshot(query(sessionsCol, orderBy("date","desc")), snap => {
  sessions = snap.docs.map(d => ({id:d.id, ...d.data()}));
  ready.s = true; render();
}, err => console.error(err));

/* ================= actions (global for onclick) ================= */
window.go = (t)=>{ tab=t; if(t!=="add") editingId=null; render(); };
window.onSearch = (v)=>{ search=v; renderListOnly(); };
window.onScaleF = (v)=>{ scaleF=v; renderListOnly(); };
window.onSingerF = (v)=>{ singerF=v; renderListOnly(); };

window.saveBhajan = async ()=>{
  const name = $("f-name").value.trim();
  if(!name) return toast("Bhajan name is required.", true);
  let sessionId = $("f-session").value;
  try{
    if(sessionId === "__new__"){
      const vid = getVideoId($("f-url").value);
      if(!vid) return toast("Paste a valid YouTube link for the live.", true);
      const s = await addDoc(sessionsCol, {
        title: $("f-stitle").value.trim() || "Live session",
        videoId: vid, date: $("f-sdate").value || "", createdAt: serverTimestamp()
      });
      sessionId = s.id;
    }
    const rec = {
      name,
      singer: $("f-singer").value.trim(),
      scale: $("f-scale").value,
      seconds: parseTs($("f-time").value),
      sessionId: sessionId || "",
      notes: $("f-notes").value.trim(),
      lyricsLink: $("f-llink").value.trim(),
      lyricsText: $("f-ltext").value.trim(),
      addedBy: myName() || "Anonymous",
    };
    if(editingId){
      await updateDoc(doc(db,"bhajans",editingId), rec);
      toast("Bhajan updated ✓");
    }else{
      rec.createdAt = serverTimestamp();
      await addDoc(bhajansCol, rec);
      toast("Bhajan added for everyone 🎉");
    }
    editingId = null; go("bhajans");
  }catch(e){ console.error(e); toast("Could not save. Check your internet.", true); }
};

window.editBhajan = (id)=>{ editingId=id; go("add"); };
window.delBhajan = async (id)=>{
  if(!confirm("Delete this bhajan for everyone?")) return;
  try{ await deleteDoc(doc(db,"bhajans",id)); toast("Deleted."); }
  catch{ toast("Could not delete.", true); }
};
window.delSession = async (id)=>{
  if(!confirm("Delete this live and all its bhajans, for everyone?")) return;
  try{
    const batch = writeBatch(db);
    bhajans.filter(b=>b.sessionId===id).forEach(b=>batch.delete(doc(db,"bhajans",b.id)));
    batch.delete(doc(db,"sessions",id));
    await batch.commit();
    toast("Live deleted.");
  }catch{ toast("Could not delete.", true); }
};

window.doParse = ()=>{
  bulkRows = parseBulk($("bk-text").value);
  if(bulkRows.length===0) toast("No bhajan lines found — check the pasted text.", true);
  render();
};
window.bulkEdit = (key, field, val)=>{ const r=bulkRows.find(x=>x.key===key); if(r) r[field]=val; };
window.bulkRemove = (key)=>{ bulkRows = bulkRows.filter(x=>x.key!==key); render(); };

window.importBulk = async ()=>{
  if(bulkRows.length===0) return toast("Parse the list first.", true);
  let sessionId = $("bk-session").value;
  try{
    if(sessionId === "__new__"){
      const vid = getVideoId($("bk-url").value);
      if(!vid) return toast("Paste a valid YouTube link for the live.", true);
      const s = await addDoc(sessionsCol, {
        title: $("bk-stitle").value.trim() || "Live session",
        videoId: vid, date: $("bk-sdate").value || "", createdAt: serverTimestamp()
      });
      sessionId = s.id;
    }
    const singer = $("bk-singer").value.trim();
    const scale = $("bk-scale").value;
    const batch = writeBatch(db);
    let count = 0;
    for(const r of bulkRows){
      if(!r.name.trim()) continue;
      batch.set(doc(bhajansCol), {
        name:r.name.trim(), singer, scale, seconds:parseTs(r.time),
        sessionId: sessionId || "", notes:"", lyricsLink:"", lyricsText:"",
        addedBy: myName() || "Anonymous", createdAt: serverTimestamp()
      });
      count++;
    }
    await batch.commit();
    bulkRows = [];
    toast(`${count} bhajans added for everyone 🎉`);
    go("bhajans");
  }catch(e){ console.error(e); toast("Could not import. Check your internet.", true); }
};

window.openLyrics = (id)=>{
  const b = bhajans.find(x=>x.id===id); if(!b) return;
  const div = document.createElement("div");
  div.className = "overlay";
  div.onclick = (e)=>{ if(e.target===div) div.remove(); };
  div.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <div>
          <h3>${esc(b.name)}</h3>
          <div class="meta" style="margin-top:8px">${singerChip(b.singer)}${b.scale?scaleChip(b.scale):""}</div>
        </div>
        <button class="btn btn-ghost" onclick="this.closest('.overlay').remove()">✕ Close</button>
      </div>
      <div class="modal-body">
        ${b.lyricsLink ? `<a class="btn btn-teal" style="align-self:flex-start" href="${esc(b.lyricsLink)}" target="_blank" rel="noreferrer">🔗 Open lyrics link</a>` : ""}
        ${b.lyricsText ? `<div class="lyrics-text">${esc(b.lyricsText)}</div>` : ""}
        ${!b.lyricsLink && !b.lyricsText ? `<div class="empty">No lyrics added yet — tap ✎ on the bhajan to add.</div>` : ""}
      </div>
    </div>`;
  document.body.appendChild(div);
};

/* ================= rendering ================= */
const sessById = ()=> Object.fromEntries(sessions.map(s=>[s.id,s]));
const allSingers = ()=> [...new Set(bhajans.map(b=>(b.singer||"").trim()).filter(Boolean))].sort();
const hasLyrics = (b)=> b.lyricsLink || b.lyricsText;

function filtered(){
  const q = search.trim().toLowerCase();
  const S = sessById();
  return bhajans.filter(b=>{
    if(scaleF && b.scale!==scaleF) return false;
    if(singerF && (b.singer||"").trim()!==singerF) return false;
    if(!q) return true;
    const sess = S[b.sessionId];
    return b.name.toLowerCase().includes(q)
      || (b.singer||"").toLowerCase().includes(q)
      || (b.notes||"").toLowerCase().includes(q)
      || (sess && sess.title.toLowerCase().includes(q));
  });
}

function bhajanCard(b){
  const sess = sessById()[b.sessionId];
  return `
  <div class="card">
    <div class="card-top">
      <div style="min-width:0;flex:1">
        <h3>${esc(b.name)}</h3>
        <div class="meta">
          ${singerChip(b.singer)}
          ${b.scale ? scaleChip(b.scale) : ""}
          ${sess ? `<span class="src">📺 ${esc(sess.title)}${sess.date?` · ${esc(sess.date)}`:""}${b.seconds?` · at ${fmtTime(b.seconds)}`:""}</span>` : ""}
        </div>
        ${b.notes ? `<div class="notes">${esc(b.notes)}</div>` : ""}
        ${b.addedBy ? `<div class="by">added by ${esc(b.addedBy)}</div>` : ""}
      </div>
      <div class="actions">
        ${sess ? `<a class="btn btn-gold" href="${yt(sess.videoId,b.seconds)}" target="_blank" rel="noreferrer">▶ Play on YouTube</a>` : ""}
        ${hasLyrics(b) ? `<button class="btn btn-teal" onclick="openLyrics('${b.id}')">📜 Lyrics</button>` : ""}
        <button class="btn btn-ghost" title="Edit" onclick="editBhajan('${b.id}')">✎</button>
        <button class="btn btn-ghost danger" title="Delete" onclick="delBhajan('${b.id}')">✕</button>
      </div>
    </div>
  </div>`;
}

function sessionSelect(idPrefix, urlId, titleId, dateId){
  return `
  <div>
    <label>Which live?</label>
    <select id="${idPrefix}-session" onchange="document.getElementById('${idPrefix}-newlive').style.display=this.value==='__new__'?'flex':'none'">
      <option value="">No live linked</option>
      ${sessions.map(s=>`<option value="${s.id}">${esc(s.title)}${s.date?` (${esc(s.date)})`:""}</option>`).join("")}
      <option value="__new__">+ New live (paste YouTube link)</option>
    </select>
  </div>
  <div class="subpanel" id="${idPrefix}-newlive" style="display:none">
    <div><label>YouTube link of the live</label><input id="${urlId}" placeholder="https://www.youtube.com/watch?v=…"></div>
    <div class="row">
      <div style="flex:2"><label>Live title</label><input id="${titleId}" placeholder="e.g. Sunday evening live"></div>
      <div><label>Date</label><input id="${dateId}" type="date"></div>
    </div>
  </div>`;
}
const scaleOptions = (sel)=> `<option value="">Not set</option>` + SCALES.map(s=>`<option value="${s[0]}" ${sel===s[0]?"selected":""}>${s[0]} · ${s[1]}</option>`).join("");

function render(){
  if(!ready.b || !ready.s){ return; }
  const S = sessById();

  let body = "";

  /* tabs */
  body += `<div class="tabs">
    <button class="tab ${tab==="bhajans"?"active":""}" onclick="go('bhajans')">🪕 Bhajans (${bhajans.length})</button>
    <button class="tab ${tab==="lives"?"active":""}" onclick="go('lives')">📺 Lives (${sessions.length})</button>
    <button class="tab ${tab==="add"?"active":""}" onclick="go('add')">${editingId?"✎ Edit bhajan":"+ Add bhajan"}</button>
    <button class="tab ${tab==="bulk"?"active":""}" onclick="go('bulk')">⚡ Bulk add</button>
  </div>`;

  if(tab==="bhajans"){
    body += `<div class="stats">
      <div class="stat"><b>${bhajans.length}</b><span>Bhajans</span></div>
      <div class="stat"><b>${sessions.length}</b><span>Lives</span></div>
      <div class="stat"><b>${allSingers().length}</b><span>Singers</span></div>
    </div>
    <div class="toolbar">
      <input placeholder="🔍  Search bhajan, singer, live…" value="${esc(search)}" oninput="onSearch(this.value)">
      <select onchange="onSingerF(this.value)"><option value="">All singers</option>${allSingers().map(s=>`<option ${singerF===s?"selected":""} value="${esc(s)}">${esc(s)}</option>`).join("")}</select>
      <select onchange="onScaleF(this.value)"><option value="">All scales</option>${SCALES.map(s=>`<option value="${s[0]}" ${scaleF===s[0]?"selected":""}>${s[0]} · ${s[1]}</option>`).join("")}</select>
    </div>
    <div class="list" id="bhajan-list"></div>`;
  }

  if(tab==="lives"){
    body += sessions.length===0
      ? `<div class="empty"><span class="om">🪔</span>No lives yet. Add a bhajan and choose “+ New live” with the YouTube link.</div>`
      : `<div class="list">` + sessions.map(s=>{
          const inS = bhajans.filter(b=>b.sessionId===s.id).sort((a,b)=>(a.seconds||0)-(b.seconds||0));
          return `<div class="card live-card">
            <div class="live-head">
              <a class="thumb-link" href="${yt(s.videoId,0)}" target="_blank" rel="noreferrer">
                <img class="thumb" loading="lazy" alt="" src="https://img.youtube.com/vi/${esc(s.videoId)}/mqdefault.jpg">
              </a>
              <div style="flex:1;min-width:200px">
                <div class="card-top">
                  <div>
                    <h3>${esc(s.title)}</h3>
                    <div class="meta"><span class="src">${s.date?`${esc(s.date)} · `:""}${inS.length} bhajan${inS.length!==1?"s":""} noted</span></div>
                  </div>
                  <div class="actions">
                    <a class="btn btn-ghost" style="border-color:var(--gold);color:var(--gold-2)" href="${yt(s.videoId,0)}" target="_blank" rel="noreferrer">Open live</a>
                    <button class="btn btn-ghost danger" onclick="delSession('${s.id}')">✕</button>
                  </div>
                </div>
              </div>
            </div>
            ${inS.length ? `<div class="setlist">` + inS.map(b=>`
              <a class="setrow" href="${yt(s.videoId,b.seconds)}" target="_blank" rel="noreferrer">
                <span class="left"><span class="t">${b.seconds?fmtTime(b.seconds):"—"}</span><span class="n">${esc(b.name)}</span></span>
                <span class="right">${singerChip(b.singer)}${b.scale?scaleChip(b.scale):""}</span>
              </a>`).join("") + `</div>` : ""}
          </div>`;
        }).join("") + `</div>`;
  }

  if(tab==="add"){
    const b = editingId ? bhajans.find(x=>x.id===editingId) : null;
    body += `<div class="panel">
      <div class="row">
        <div style="flex:2"><label>Bhajan name *</label><input id="f-name" placeholder="e.g. Shyam Baba bhajan name…" value="${esc(b?.name||"")}"></div>
        <div><label>Singer</label><input id="f-singer" list="singers" placeholder="e.g. Shubham Rupam" value="${esc(b?.singer||"")}"></div>
      </div>
      <datalist id="singers">${allSingers().map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
      <div class="row">
        <div><label>Scale (singing pitch)</label><select id="f-scale">${scaleOptions(b?.scale||"")}</select></div>
        <div><label>Timestamp in the live</label><input id="f-time" placeholder="e.g. 1:23:45 or 23:45" value="${b?.seconds?fmtTime(b.seconds):""}"><div class="hint">One tap opens YouTube exactly at this moment.</div></div>
      </div>
      ${sessionSelect("f","f-url","f-stitle","f-sdate")}
      <div class="lyrics-box">
        <div class="lbl">📜 LYRICS — link, text, or both</div>
        <div><label>Lyrics link</label><input id="f-llink" placeholder="https://… (any lyrics site, or a Google Drive PDF link)" value="${esc(b?.lyricsLink||"")}"></div>
        <div><label>Or paste lyrics here</label><textarea id="f-ltext" placeholder="Paste the full lyrics…">${esc(b?.lyricsText||"")}</textarea></div>
      </div>
      <div><label>Notes (optional)</label><input id="f-notes" placeholder="e.g. slow start, taal keherwa, second antara high…" value="${esc(b?.notes||"")}"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-gold btn-big" onclick="saveBhajan()">${editingId?"Save changes":"Add bhajan"}</button>
        ${editingId?`<button class="btn btn-ghost btn-big" onclick="editingId=null;go('bhajans')">Cancel</button>`:""}
      </div>
    </div>`;
  }

  if(tab==="bulk"){
    body += `<div class="panel">
      <div class="subpanel" style="border-style:solid;border-color:var(--line-soft)">
        <div style="font-size:14px;color:var(--dim);line-height:1.7;font-weight:300">
          <b style="color:var(--gold-2)">⚡ Add a whole live in one go.</b>
          Copy the timestamp list from the live's description or pinned comment and paste it below. Lines like
          <code style="color:var(--text)">14:20 Bhajan name</code> or <code style="color:var(--text)">Bhajan name | 1:05:10</code> all work.
        </div>
      </div>
      ${sessionSelect("bk","bk-url","bk-stitle","bk-sdate")}
      <div class="row">
        <div><label>Singer (applied to all)</label><input id="bk-singer" list="singers" placeholder="e.g. Shubham Rupam"></div>
        <div><label>Scale (applied to all, optional)</label><select id="bk-scale">${scaleOptions("")}</select></div>
      </div>
      <datalist id="singers">${allSingers().map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
      <div>
        <label>Paste the bhajan list</label>
        <textarea id="bk-text" class="mono" placeholder="14:20 Pehla bhajan naam&#10;32:45 Doosra bhajan naam&#10;1:05:10 Teesra bhajan naam"></textarea>
        <button class="btn btn-teal" style="margin-top:10px" onclick="doParse()">🔍 Parse list</button>
      </div>
      ${bulkRows.length ? `
      <div class="preview">
        <div class="preview-head">Preview — ${bulkRows.length} bhajans found <span>check names & times, edit if needed</span></div>
        <div class="preview-rows">
          ${bulkRows.map((r,i)=>`
          <div class="prow">
            <span class="num">${i+1}.</span>
            <input value="${esc(r.name)}" oninput="bulkEdit('${r.key}','name',this.value)">
            <input class="time" placeholder="h:mm:ss" value="${esc(r.time)}" oninput="bulkEdit('${r.key}','time',this.value)">
            <button class="x" onclick="bulkRemove('${r.key}')">✕</button>
          </div>`).join("")}
        </div>
      </div>
      <button class="btn btn-gold btn-big" onclick="importBulk()">⚡ Add all ${bulkRows.length} bhajans</button>` : ""}
    </div>`;
  }

  $("app").innerHTML = body;
  if(tab==="bhajans") renderListOnly();
}

function renderListOnly(){
  const el = $("bhajan-list");
  if(!el) return;
  const list = filtered();
  el.innerHTML = list.length
    ? list.map(bhajanCard).join("")
    : `<div class="empty"><span class="om">🪔</span>${bhajans.length===0
        ? "The sangrah is empty — be the first to add a bhajan! Tap “+ Add bhajan” or “⚡ Bulk add”."
        : "Nothing matches your search or filters."}</div>`;
}
</script>
</body>
</html>
