<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Shyam Bhajan Sangrah — Community Bhajan Library</title>
<meta name="description" content="A community library of bhajans from live satsangs — scales, singers, lyrics, and one-tap YouTube timestamps." />
<meta name="theme-color" content="#0d0a1a" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@300;400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0d0a1a;
  --surface:#1a1530;
  --surface2:#241d42;
  --surface3:#2d2452;
  --line:#372e5e;
  --line-soft:#2a2350;
  --text:#f4eedb;
  --dim:#a89dc9;
  --dim2:#7d729f;
  --gold:#f0a838;
  --gold-2:#ffc768;
  --gold-dark:#3a2c12;
  --teal:#38bfa7;
  --teal-dim:rgba(56,191,167,.12);
  --red:#e26565;
  --radius:14px;
  --shadow:0 8px 28px rgba(0,0,0,.35);
  --glow-a:rgba(240,168,56,.13);
  --font-display:"Marcellus","Tiro Devanagari Hindi",serif;
  --font-body:"Mukta",system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:#f6f1e3;
  --surface:#ffffff;
  --surface2:#f4eedd;
  --surface3:#ece1c6;
  --line:#d6caa8;
  --line-soft:#e6dcc2;
  --text:#2b2145;
  --dim:#6b5f8a;
  --dim2:#948aae;
  --gold:#b57712;
  --gold-2:#8f5c08;
  --gold-dark:#f6e6c4;
  --teal:#0e8a76;
  --teal-dim:rgba(14,138,118,.1);
  --red:#c04747;
  --shadow:0 8px 24px rgba(70,50,15,.12);
  --glow-a:rgba(181,119,18,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1000px 500px at 50% -120px, var(--glow-a), transparent 65%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background .3s, color .3s;
}
a{color:inherit}
button{font-family:var(--font-body)}
input,select,textarea{
  font-family:var(--font-body);
  width:100%;padding:12px 14px;font-size:15px;
  background:var(--surface2);color:var(--text);
  border:1px solid var(--line);border-radius:10px;outline:none;
  transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--glow-a)}
input::placeholder,textarea::placeholder{color:var(--dim2)}
label{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:7px}

.keys{display:flex;height:8px}
.keys div{flex:1}
.keys .w{background:#efe8d3}.keys .b{background:#070510}

/* ---------- topbar ---------- */
.topbar{
  position:fixed;top:16px;right:16px;z-index:40;display:flex;gap:8px;
}
.iconbtn{
  width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:17px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
  transition:transform .12s, border-color .12s;
}
.iconbtn:hover{transform:translateY(-1px);border-color:var(--gold)}
.iconbtn.lang{font-size:13px;font-weight:700;letter-spacing:.02em}

/* ---------- header ---------- */
.wrap{max-width:900px;margin:0 auto;padding:0 18px 110px}
header{text-align:center;padding:44px 0 10px;position:relative}
header::before{
  content:"";position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  width:min(560px,90vw);height:240px;pointer-events:none;
  background:radial-gradient(closest-side, var(--glow-a), transparent 75%);
  animation:breathe 5s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
.banner{
  width:min(280px,70vw);border-radius:16px;margin:0 auto 18px;display:block;
  border:1px solid var(--line);box-shadow:var(--shadow);position:relative;
}
.ornament{width:74px;height:74px;margin:0 auto 6px;display:block;position:relative;filter:drop-shadow(0 0 14px var(--glow-a))}
.mantra{font-family:var(--font-display);color:var(--gold);letter-spacing:.45em;font-size:15px;text-indent:.45em;position:relative}
h1{
  font-family:var(--font-display);font-weight:400;font-size:clamp(36px,6.5vw,54px);
  margin:10px 0 4px;line-height:1.15;position:relative;
  background:linear-gradient(180deg,#fdf6e3 15%,var(--gold-2) 85%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
[data-theme="light"] h1{background:linear-gradient(180deg,#6a4404,#b57712);-webkit-background-clip:text;background-clip:text}
.tagline{color:var(--dim);font-size:15px;max-width:520px;margin:6px auto 0;line-height:1.65;font-weight:300;position:relative}
.diya{width:190px;height:1px;margin:24px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative}
.diya::after{content:"❉";position:absolute;top:-12px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:15px;text-shadow:0 0 14px var(--glow-a)}

.idbar{display:flex;justify-content:center;align-items:center;gap:10px;margin:20px 0 4px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.idbar b{color:var(--teal);font-weight:600}
.linkbtn{background:none;border:none;color:var(--gold);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0 26px;position:sticky;top:10px;z-index:20}
.tab{
  padding:10px 20px;border-radius:999px;font-size:14.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);opacity:.96;backdrop-filter:blur(10px);color:var(--dim);
  transition:all .18s;box-shadow:var(--shadow);
}
.tab:hover{color:var(--text);border-color:var(--dim2)}
.tab.active{
  color:var(--gold-2);border-color:var(--gold);
  background:linear-gradient(180deg,var(--gold-dark),var(--surface));
  box-shadow:0 0 22px var(--glow-a);
}
[data-theme="light"] .tab.active{color:var(--gold-2)}

/* ---------- trending ---------- */
.trending{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:-6px 0 20px;font-size:13px;color:var(--dim2)}
.tchip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--teal);border:1px solid var(--line);background:var(--surface);
  transition:border-color .15s, transform .12s;
}
.tchip:hover{border-color:var(--teal);transform:translateY(-1px)}
.tchip b{color:var(--gold-2);font-weight:700}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input{flex:2;min-width:180px}
.toolbar select{flex:1;min-width:140px}
.favfilter{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:16px;padding:8px 16px;border-radius:999px;
  cursor:pointer;font-size:13.5px;font-weight:600;border:1px solid var(--line);
  background:var(--surface);color:var(--dim);transition:all .15s;
}
.favfilter.on{border-color:var(--gold);color:var(--gold-2);background:linear-gradient(180deg,var(--gold-dark),var(--surface))}

/* ---------- stats ---------- */
.stats{display:flex;gap:12px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.stat{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
  padding:10px 22px;text-align:center;min-width:110px;box-shadow:var(--shadow);
}
.stat b{display:block;font-family:var(--font-display);font-size:24px;color:var(--gold-2);font-weight:400}
.stat span{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}

/* ---------- cards ---------- */
.list{display:flex;flex-direction:column;gap:13px}
.card{
  background:var(--surface);
  border:1px solid var(--line-soft);border-left:3px solid var(--gold);
  border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  transition:transform .18s, border-color .18s, box-shadow .18s;
  animation:rise .3s ease both;position:relative;overflow:hidden;
}
.card::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;
  background:radial-gradient(420px 140px at 0% 0%, var(--glow-a), transparent 70%);
}
.card:hover{transform:translateY(-3px);border-color:var(--line);box-shadow:0 12px 34px rgba(0,0,0,.25), 0 0 0 1px var(--glow-a)}
.card:hover::after{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.card h3{font-family:var(--font-display);font-weight:400;font-size:20px;margin-bottom:9px;line-height:1.3;display:flex;align-items:baseline;gap:8px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta .src{font-size:12.5px;color:var(--dim)}
.notes{font-size:13.5px;color:var(--dim);margin-top:10px;font-style:italic;font-weight:300}
.by{font-size:11px;color:var(--dim2);margin-top:10px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.star{
  background:none;border:none;cursor:pointer;font-size:19px;line-height:1;padding:2px;
  filter:grayscale(1);opacity:.45;transition:all .15s;flex-shrink:0;
}
.star:hover{opacity:.8;transform:scale(1.15)}
.star.on{filter:none;opacity:1;text-shadow:0 0 12px var(--glow-a)}

/* ---------- chips ---------- */
.chip-scale{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:5px;
  font-size:11.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;
}
.chip-scale .key{width:8px;height:13px;border-radius:2px;border:1px solid #888;display:inline-block}
.chip-scale.white{background:#efe8d3;color:#141024;border:1px solid #c9bfa0}
.chip-scale.white .key{background:#fff}
.chip-scale.black{background:#120e22;color:#efe8d3;border:1px solid #564c8b}
.chip-scale.black .key{background:#000}
.chip-singer{
  display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;
  font-size:11.5px;font-weight:600;color:var(--teal);white-space:nowrap;
  border:1px solid var(--teal);background:var(--teal-dim);
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:10px 17px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;
  border:none;text-decoration:none;white-space:nowrap;transition:transform .12s, box-shadow .12s;
}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#231604;box-shadow:0 3px 14px var(--glow-a)}
[data-theme="light"] .btn-gold{background:linear-gradient(180deg,#d99a24,#b57712);color:#fff}
.btn-gold:hover{box-shadow:0 5px 20px var(--glow-a)}
.btn-teal{background:var(--teal-dim);border:1px solid var(--teal);color:var(--teal)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--dim);padding:9px 12px}
.btn-ghost:hover{color:var(--text)}
.btn-ghost.danger{color:var(--red)}
.btn-big{padding:14px 30px;font-size:15px;border-radius:12px}

/* ---------- lives ---------- */
.live-card{border-left:3px solid var(--teal)}
.live-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.thumb{
  width:168px;aspect-ratio:16/9;border-radius:10px;object-fit:cover;flex-shrink:0;
  border:1px solid var(--line);display:block;background:var(--surface2);
  transition:transform .18s;
}
a.thumb-link{position:relative;display:block;flex-shrink:0}
a.thumb-link::after{
  content:"▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:26px;text-shadow:0 2px 12px rgba(0,0,0,.9);
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.45));border-radius:10px;
  opacity:.85;transition:opacity .15s;
}
a.thumb-link:hover::after{opacity:1}
a.thumb-link:hover .thumb{transform:scale(1.03)}
@media (max-width:560px){.thumb{width:100%}a.thumb-link{width:100%}}

.setlist{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:12px;display:flex;flex-direction:column;gap:7px}
.setrow{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  text-decoration:none;padding:10px 13px;border-radius:10px;background:var(--surface2);
  transition:background .14s;
}
.setrow:hover{background:var(--surface3)}
.setrow .t{color:var(--gold-2);font-variant-numeric:tabular-nums;font-size:13px;min-width:58px;font-weight:600}
.setrow .n{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow .left{display:flex;gap:12px;align-items:center;min-width:0}
.setrow .right{display:flex;gap:6px;align-items:center;flex-shrink:0}

/* ---------- forms ---------- */
.panel{
  background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:24px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow);
}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:180px}
.subpanel{padding:16px;border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:14px}
.lyrics-box{padding:16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--teal-dim);display:flex;flex-direction:column;gap:14px}
.lyrics-box .lbl{font-size:13px;font-weight:700;color:var(--teal);letter-spacing:.06em}
.hint{font-size:12.5px;color:var(--dim2);margin-top:6px;font-weight:300}
textarea{min-height:120px;resize:vertical;line-height:1.8}
textarea.mono{font-family:ui-monospace,monospace;font-size:13.5px}

/* ---------- bulk preview ---------- */
.preview{border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
.preview-head{padding:11px 15px;background:var(--surface2);font-size:13px;font-weight:700;color:var(--gold-2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.preview-head span{color:var(--dim);font-weight:400}
.preview-rows{max-height:340px;overflow-y:auto}
.prow{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line-soft)}
.prow .num{color:var(--dim2);font-size:12px;min-width:24px;text-align:right}
.prow input{padding:8px 10px;font-size:13.5px}
.prow .time{max-width:112px;font-family:ui-monospace,monospace}
.prow .x{background:none;border:none;color:var(--red);cursor:pointer;font-size:15px;padding:4px}

/* ---------- empty ---------- */
.empty{
  text-align:center;padding:60px 20px;color:var(--dim);
  border:1px dashed var(--line);border-radius:var(--radius);font-weight:300;line-height:1.7;
}
.empty .om{font-size:34px;display:block;margin-bottom:12px;opacity:.6}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(6,4,14,.82);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 26px 70px rgba(0,0,0,.65);animation:pop .2s ease;
}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal-head h3{font-family:var(--font-display);font-weight:400;font-size:21px}
.modal-body{overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.lyrics-text{
  white-space:pre-wrap;line-height:2;font-size:16.5px;font-family:var(--font-display);
  background:var(--surface2);border-radius:12px;padding:20px;border:1px solid var(--line-soft);
}

/* ---------- toast ---------- */
#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface3);border:1px solid var(--teal);color:var(--teal);
  padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .25s;z-index:60;box-shadow:var(--shadow);
  max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.error{border-color:var(--red);color:var(--red)}

.setup{max-width:640px;margin:40px auto;line-height:1.8;font-weight:300}
.setup h2{font-family:var(--font-display);font-weight:400;color:var(--gold-2);margin-bottom:14px}
.setup ol{padding-left:22px;display:flex;flex-direction:column;gap:10px}
.setup code{background:var(--surface2);padding:2px 8px;border-radius:6px;font-size:13px;color:var(--gold-2)}
.setup a{color:var(--teal)}

.loading{text-align:center;padding:80px 20px;color:var(--dim)}
.pulse{animation:pulse 1.4s ease infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

footer{text-align:center;margin-top:60px;color:var(--dim2);font-size:12.5px;font-weight:300}
footer .m{font-family:var(--font-display);color:var(--gold);letter-spacing:.3em;font-size:13px;margin-bottom:6px}

@media (max-width:560px){
  .card-top{flex-direction:column}
  .actions{width:100%}
  .actions .btn-gold{flex:1}
  .stats{gap:8px}.stat{min-width:90px;padding:8px 14px}
  .topbar{top:12px;right:12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

</div>

  </footer>
</div>

<div id="toast"></div>

function getVideoId(url){
  if(!url) return null;
  try{
    const u = new URL(url.trim());
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1).split("/")[0]||null;
    if(u.pathname.startsWith("/live/")) return u.pathname.split("/")[2]||null;
    if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2]||null;
    return u.searchParams.get("v");
  }catch{ return null; }
}
function parseTs(str){
  if(!str) return 0;
  const s = String(str).trim();
  if(/^\d+$/.test(s)) return parseInt(s,10);
  const p = s.split(":").map(x=>parseInt(x,10));
  if(p.some(isNaN)) return 0;
  if(p.length===3) return p[0]*3600+p[1]*60+p[2];
  if(p.length===2) return p[0]*60+p[1];
  return 0;
}
function fmtTime(sec){
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h>0 ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;
}
const yt = (vid,sec)=>`https://www.youtube.com/watch?v=${vid}${sec?`&t=${sec}s`:""}`;

function parseBulk(text){
  return text.split("\n").map(l=>l.trim()).filter(Boolean).map((line,i)=>{
    const m = line.match(/(\d{1,2}:\d{1,2}(?::\d{1,2})?)/);
    let time="", name=line;
    if(m){ time=m[1]; name=(line.slice(0,m.index)+" "+line.slice(m.index+m[1].length)).trim(); }
    name = name.replace(/^[\s\-–—|•:.)\]〉>]+/,"").replace(/[\s\-–—|•:(\[〈<]+$/,"").trim();
    return name ? {key:"r"+i+Date.now(), name, time} : null;
  }).filter(Boolean);
}

function scaleChip(w){
  const info = SCALES.find(s=>s[0]===w);
  if(!info) return "";
  return `<span class="chip-scale ${info[2]?"black":"white"}" title="${info[1]}"><span class="key"></span>${info[0]} · ${info[1]}</span>`;
}
const singerChip = (n)=> n ? `<span class="chip-singer">🎤 ${esc(n)}</span>` : "";

function toast(msg, isErr){

  el.className = "show" + (isErr ? " error" : "");
  clearTimeout(el._h);

}

window.saveBhajan = async ()=>{
  const name = $("f-name").value.trim();
  if(!name) return toast(t("tNameReq"), true);
  let sessionId = $("f-session").value;
  try{
    if(sessionId === "__new__"){
      const vid = getVideoId($("f-url").value);
      if(!vid) return toast(t("tBadYt"), true);
      const s = await addDoc(sessionsCol, {
        title: $("f-stitle").value.trim() || "Live session",
        videoId: vid, date: $("f-sdate").value || "", createdAt: serverTimestamp()
      });
      sessionId = s.id;
    }
    const rec = {
      name,
      singer: $("f-singer").value.trim(),
      scale: $("f-scale").value,
      seconds: parseTs($("f-time").value),
      sessionId: sessionId || "",
      notes: $("f-notes").value.trim(),
      lyricsLink: $("f-llink").value.trim(),
      lyricsText: $("f-ltext").value.trim(),
      addedBy: myName() || "Anonymous",
    };
    if(editingId){
      await updateDoc(doc(db,"bhajans",editingId), rec);
      toast(t("tUpdated"));
    }else{
      rec.createdAt = serverTimestamp();
      await addDoc(bhajansCol, rec);
      toast(t("tAdded"));
    }
    editingId = null; go("bhajans");
  }catch(e){ console.error(e); toast(t("tSaveFail"), true); }
};

window.editBhajan = (id)=>{ editingId=id; go("add"); };
window.delBhajan = async (id)=>{
  if(!confirm(t("confirmDel"))) return;
  try{ await deleteDoc(doc(db,"bhajans",id)); toast(t("tDeleted")); }
  catch{ toast(t("tDelFail"), true); }
};
window.delSession = async (id)=>{
  if(!confirm(t("confirmDelLive"))) return;
  try{
    const batch = writeBatch(db);
    bhajans.filter(b=>b.sessionId===id).forEach(b=>batch.delete(doc(db,"bhajans",b.id)));
    batch.delete(doc(db,"sessions",id));
    await batch.commit();
    toast(t("tLiveDeleted"));
  }catch{ toast(t("tDelFail"), true); }
};

window.doParse = ()=>{
  bulkRows = parseBulk($("bk-text").value);
  if(bulkRows.length===0) toast(t("tParseFail"), true);
  render();
};
window.bulkEdit = (key, field, val)=>{ const r=bulkRows.find(x=>x.key===key); if(r) r[field]=val; };
window.bulkRemove = (key)=>{ bulkRows = bulkRows.filter(x=>x.key!==key); render(); };

window.importBulk = async ()=>{
  if(bulkRows.length===0) return toast(t("tParseFirst"), true);
  let sessionId = $("bk-session").value;
  try{
    if(sessionId === "__new__"){
      const vid = getVideoId($("bk-url").value);
      if(!vid) return toast(t("tBadYt"), true);
      const s = await addDoc(sessionsCol, {
        title: $("bk-stitle").value.trim() || "Live session",
        videoId: vid, date: $("bk-sdate").value || "", createdAt: serverTimestamp()
      });
      sessionId = s.id;
    }
    const singer = $("bk-singer").value.trim();
    const scale = $("bk-scale").value;
    const batch = writeBatch(db);
    let count = 0;
    for(const r of bulkRows){
      if(!r.name.trim()) continue;
      batch.set(doc(bhajansCol), {
        name:r.name.trim(), singer, scale, seconds:parseTs(r.time),
        sessionId: sessionId || "", notes:"", lyricsLink:"", lyricsText:"",
        addedBy: myName() || "Anonymous", createdAt: serverTimestamp()
      });
      count++;
    }
    await batch.commit();
    bulkRows = [];
    toast(`${count} ${t("tBulkAdded")}`);
    go("bhajans");
  }catch(e){ console.error(e); toast(t("tSaveFail"), true); }
};

};

/* ================= rendering ================= */
const sessById = ()=> Object.fromEntries(sessions.map(s=>[s.id,s]));
const allSingers = ()=> [...new Set(bhajans.map(b=>(b.singer||"").trim()).filter(Boolean))].sort();
const hasLyrics = (b)=> b.lyricsLink || b.lyricsText;

function topSingers(n=3){
  const counts = {};
  bhajans.forEach(b=>{ const s=(b.singer||"").trim(); if(s) counts[s]=(counts[s]||0)+1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

function filtered(){
  const q = search.trim().toLowerCase();
  const S = sessById();
  return bhajans.filter(b=>{
    if(favOnly && !favs.has(b.id)) return false;
    if(scaleF && b.scale!==scaleF) return false;
    if(singerF && (b.singer||"").trim()!==singerF) return false;
    if(!q) return true;
    const sess = S[b.sessionId];
    return b.name.toLowerCase().includes(q)
      || (b.singer||"").toLowerCase().includes(q)
      || (b.notes||"").toLowerCase().includes(q)
      || (sess && sess.title.toLowerCase().includes(q));
  });
}

function bhajanCard(b){
  const sess = sessById()[b.sessionId];
  const fav = favs.has(b.id);
  return `
  <div class="card">
    <div class="card-top">
      <div style="min-width:0;flex:1">
        <h3><button class="star ${fav?"on":""}" onclick="toggleFav('${b.id}')" title="⭐">⭐</button><span>${esc(b.name)}</span></h3>
        <div class="meta">
          ${singerChip(b.singer)}
          ${b.scale ? scaleChip(b.scale) : ""}
          ${sess ? `<span class="src">📺 ${esc(sess.title)}${sess.date?` · ${esc(sess.date)}`:""}${b.seconds?` · ${t("at")} ${fmtTime(b.seconds)}`:""}</span>` : ""}
        </div>
        ${b.notes ? `<div class="notes">${esc(b.notes)}</div>` : ""}
        ${b.addedBy ? `<div class="by">${t("addedBy")} ${esc(b.addedBy)}</div>` : ""}
      </div>
      <div class="actions">
        ${sess ? `<a class="btn btn-gold" href="${yt(sess.videoId,b.seconds)}" target="_blank" rel="noreferrer">${t("play")}</a>` : ""}
        ${hasLyrics(b) ? `<button class="btn btn-teal" onclick="openLyrics('${b.id}')">${t("lyrics")}</button>` : ""}
        <button class="btn btn-ghost" title="Edit" onclick="editBhajan('${b.id}')">✎</button>
        <button class="btn btn-ghost danger" title="Delete" onclick="delBhajan('${b.id}')">✕</button>
      </div>
    </div>
  </div>`;
}

function sessionSelect(idPrefix, urlId, titleId, dateId){
  return `
  <div>
    <label>${t("whichLive")}</label>
    <select id="${idPrefix}-session" onchange="document.getElementById('${idPrefix}-newlive').style.display=this.value==='__new__'?'flex':'none'">
      <option value="">${t("noLive")}</option>
      ${sessions.map(s=>`<option value="${s.id}">${esc(s.title)}${s.date?` (${esc(s.date)})`:""}</option>`).join("")}
      <option value="__new__">${t("newLive")}</option>
    </select>
  </div>
  <div class="subpanel" id="${idPrefix}-newlive" style="display:none">
    <div><label>${t("ytLink")}</label><input id="${urlId}" placeholder="https://www.youtube.com/watch?v=…"></div>
    <div class="row">
      <div style="flex:2"><label>${t("liveTitle")}</label><input id="${titleId}" placeholder="Sunday evening live"></div>
      <div><label>${t("date")}</label><input id="${dateId}" type="date"></div>
    </div>
  </div>`;
}
const scaleOptions = (sel)=> `<option value="">${t("notSet")}</option>` + SCALES.map(s=>`<option value="${s[0]}" ${sel===s[0]?"selected":""}>${s[0]} · ${s[1]}</option>`).join("");

function render(){
  if(!ready.b || !ready.s){ return; }

  let body = "";

  body += `<div class="tabs">
    <button class="tab ${tab==="bhajans"?"active":""}" onclick="go('bhajans')">${t("tabBhajans")} (${bhajans.length})</button>
    <button class="tab ${tab==="lives"?"active":""}" onclick="go('lives')">${t("tabLives")} (${sessions.length})</button>
    <button class="tab ${tab==="add"?"active":""}" onclick="go('add')">${editingId?t("tabEdit"):t("tabAdd")}</button>
    <button class="tab ${tab==="bulk"?"active":""}" onclick="go('bulk')">${t("tabBulk")}</button>
  </div>`;

  if(tab==="bhajans"){
    const tops = topSingers();
    body += `<div class="stats">
      <div class="stat"><b>${bhajans.length}</b><span>${t("stBhajans")}</span></div>
      <div class="stat"><b>${sessions.length}</b><span>${t("stLives")}</span></div>
      <div class="stat"><b>${allSingers().length}</b><span>${t("stSingers")}</span></div>
    </div>
    ${tops.length ? `<div class="trending">${t("trending")} ${tops.map(([s,c])=>`<button class="tchip" onclick="pickSinger('${esc(s)}')">🎤 ${esc(s)} <b>${c}</b></button>`).join("")}</div>` : ""}
    <div class="toolbar">
      <input placeholder="${t("search")}" value="${esc(search)}" oninput="onSearch(this.value)">
      <select onchange="onSingerF(this.value)"><option value="">${t("allSingers")}</option>${allSingers().map(s=>`<option ${singerF===s?"selected":""} value="${esc(s)}">${esc(s)}</option>`).join("")}</select>
      <select onchange="onScaleF(this.value)"><option value="">${t("allScales")}</option>${SCALES.map(s=>`<option value="${s[0]}" ${scaleF===s[0]?"selected":""}>${s[0]} · ${s[1]}</option>`).join("")}</select>
    </div>
    <button class="favfilter ${favOnly?"on":""}" onclick="toggleFavOnly()">${t("myFavs")} (${favs.size})</button>
    <div class="list" id="bhajan-list"></div>`;
  }

  if(tab==="lives"){
    body += sessions.length===0
      ? `<div class="empty"><span class="om">🪔</span>${t("emptyLives")}</div>`
      : `<div class="list">` + sessions.map(s=>{
          const inS = bhajans.filter(b=>b.sessionId===s.id).sort((a,b)=>(a.seconds||0)-(b.seconds||0));
          return `<div class="card live-card">
            <div class="live-head">
              <a class="thumb-link" href="${yt(s.videoId,0)}" target="_blank" rel="noreferrer">
                <img class="thumb" loading="lazy" alt="" src="https://img.youtube.com/vi/${esc(s.videoId)}/mqdefault.jpg">
              </a>
              <div style="flex:1;min-width:200px">
                <div class="card-top">
                  <div>
                    <h3>${esc(s.title)}</h3>
                    <div class="meta"><span class="src">${s.date?`${esc(s.date)} · `:""}${inS.length} ${t("stBhajans").toLowerCase()} ${t("noted")}</span></div>
                  </div>
                  <div class="actions">
                    <a class="btn btn-ghost" style="border-color:var(--gold);color:var(--gold-2)" href="${yt(s.videoId,0)}" target="_blank" rel="noreferrer">${t("openLive")}</a>
                    <button class="btn btn-ghost danger" onclick="delSession('${s.id}')">✕</button>
                  </div>
                </div>
              </div>
            </div>
            ${inS.length ? `<div class="setlist">` + inS.map(b=>`
              <a class="setrow" href="${yt(s.videoId,b.seconds)}" target="_blank" rel="noreferrer">
                <span class="left"><span class="t">${b.seconds?fmtTime(b.seconds):"—"}</span><span class="n">${esc(b.name)}</span></span>
                <span class="right">${singerChip(b.singer)}${b.scale?scaleChip(b.scale):""}</span>
              </a>`).join("") + `</div>` : ""}
          </div>`;
        }).join("") + `</div>`;
  }

  if(tab==="add"){
    const b = editingId ? bhajans.find(x=>x.id===editingId) : null;
    body += `<div class="panel">
      <div class="row">
        <div style="flex:2"><label>${t("bhajanName")}</label><input id="f-name" placeholder="…" value="${esc(b?.name||"")}"></div>
        <div><label>${t("singer")}</label><input id="f-singer" list="singers" placeholder="Shubham Rupam" value="${esc(b?.singer||"")}"></div>
      </div>
      <datalist id="singers">${allSingers().map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
      <div class="row">
        <div><label>${t("scale")}</label><select id="f-scale">${scaleOptions(b?.scale||"")}</select></div>
        <div><label>${t("timestamp")}</label><input id="f-time" placeholder="1:23:45" value="${b?.seconds?fmtTime(b.seconds):""}"><div class="hint">${t("tsHint")}</div></div>
      </div>
      ${sessionSelect("f","f-url","f-stitle","f-sdate")}
      <div class="lyrics-box">
        <div class="lbl">${t("lyricsHead")}</div>
        <div><label>${t("lyricsLink")}</label><input id="f-llink" placeholder="${t("lyricsLinkPh")}" value="${esc(b?.lyricsLink||"")}"></div>
        <div><label>${t("lyricsPaste")}</label><textarea id="f-ltext" placeholder="${t("lyricsPastePh")}">${esc(b?.lyricsText||"")}</textarea></div>
      </div>
      <div><label>${t("notes")}</label><input id="f-notes" placeholder="${t("notesPh")}" value="${esc(b?.notes||"")}"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-gold btn-big" onclick="saveBhajan()">${editingId?t("save"):t("add")}</button>
        ${editingId?`<button class="btn btn-ghost btn-big" onclick="editingId=null;go('bhajans')">${t("cancel")}</button>`:""}
      </div>
    </div>`;
  }

  if(tab==="bulk"){
    body += `<div class="panel">
      <div class="subpanel" style="border-style:solid;border-color:var(--line-soft)">
        <div style="font-size:14px;color:var(--dim);line-height:1.7;font-weight:300">${t("bulkIntro")}</div>
      </div>
      ${sessionSelect("bk","bk-url","bk-stitle","bk-sdate")}
      <div class="row">
        <div><label>${t("bulkSinger")}</label><input id="bk-singer" list="singers" placeholder="Shubham Rupam"></div>
        <div><label>${t("bulkScale")}</label><select id="bk-scale"><option value="">${t("scaleLater")}</option>${SCALES.map(s=>`<option value="${s[0]}">${s[0]} · ${s[1]}</option>`).join("")}</select></div>
      </div>
      <datalist id="singers">${allSingers().map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
      <div>
        <label>${t("pasteList")}</label>
        <textarea id="bk-text" class="mono" placeholder="14:20 …&#10;32:45 …&#10;1:05:10 …"></textarea>
        <button class="btn btn-teal" style="margin-top:10px" onclick="doParse()">${t("parse")}</button>
      </div>
      ${bulkRows.length ? `
      <div class="preview">
        <div class="preview-head">${t("previewHead")} ${bulkRows.length} ${t("found")} <span>${t("previewHint")}</span></div>
        <div class="preview-rows">
          ${bulkRows.map((r,i)=>`
          <div class="prow">
            <span class="num">${i+1}.</span>
            <input value="${esc(r.name)}" oninput="bulkEdit('${r.key}','name',this.value)">
            <input class="time" placeholder="h:mm:ss" value="${esc(r.time)}" oninput="bulkEdit('${r.key}','time',this.value)">
            <button class="x" onclick="bulkRemove('${r.key}')">✕</button>
          </div>`).join("")}
        </div>
      </div>
      <button class="btn btn-gold btn-big" onclick="importBulk()">${t("addAll")} ${bulkRows.length} ${t("addAllSuffix")}</button>` : ""}
    </div>`;
  }

  $("app").innerHTML = body;
  if(tab==="bhajans") renderListOnly();
}

function renderListOnly(){
  const el = $("bhajan-list");
  if(!el) return;
  const list = filtered();
  el.innerHTML = list.length
    ? list.map(bhajanCard).join("")
    : `<div class="empty"><span class="om">🪔</span>${
        bhajans.length===0 ? t("emptyAll") : favOnly ? t("emptyFavs") : t("emptyFilter")
      }</div>`;
}
</script>
</body>
</html>
