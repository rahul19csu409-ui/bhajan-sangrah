/* ---- Devanagari → Hinglish transliteration (for younger singers) ---- */
const _DC={"क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"n","च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"n","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"ph","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","ळ":"l","क़":"q","ख़":"kh","ग़":"g","ज़":"z","ड़":"r","ढ़":"rh","फ़":"f"};
const _DV={"अ":"a","आ":"aa","इ":"i","ई":"ee","उ":"u","ऊ":"oo","ऋ":"ri","ए":"e","ऐ":"ai","ओ":"o","औ":"au","ऍ":"e","ऑ":"o"};
const _DM={"ा":"aa","ि":"i","ी":"ee","ु":"u","ू":"oo","ृ":"ri","े":"e","ै":"ai","ो":"o","ौ":"au","ॉ":"o","ॅ":"e"};
const _DN={"०":"0","१":"1","२":"2","३":"3","४":"4","५":"5","६":"6","७":"7","८":"8","९":"9"};
function dev2roman(str){
  let out="", pend=null;
  const flush=(schwa)=>{ if(pend!==null){ out+=pend+(schwa?"a":""); pend=null; } };
  for(const ch of String(str)){
    if(_DC[ch]!==undefined){ flush(true); pend=_DC[ch]; }
    else if(_DM[ch]!==undefined){ if(pend!==null){ out+=pend+_DM[ch]; pend=null; } else out+=_DM[ch]; }
    else if(ch==="्"){ flush(false); }
    else if(_DV[ch]!==undefined){ flush(true); out+=_DV[ch]; }
    else if(ch==="ं"||ch==="ँ"){ flush(true); out+="n"; }
    else if(ch==="ः"){ flush(true); out+="h"; }
    else if(ch==="़"){ /* nukta approximated by base letter */ }
    else if(_DN[ch]!==undefined){ flush(false); out+=_DN[ch]; }
    else if(ch==="।"||ch==="॥"){ flush(false); out+=" |"; }
    else if(ch==="ॐ"){ flush(true); out+="Om"; }
    else { flush(false); out+=ch; }   /* word boundary: final schwa dropped (राम → raam) */
  }
  flush(false);
  return out;
}

const NOTE_SEMI = {"C":0,"C#":1,"D":2,"D#":3,"E":4,"F":5,"F#":6,"G":7,"G#":8,"A":9,"A#":10,"B":11};
let audioCtx = null, shrutiNodes = [], shrutiNote = null;
function actx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"}); if(audioCtx.state==="suspended") audioCtx.resume(); return audioCtx; }
function noteFreq(note, octave){ return 261.6256 * Math.pow(2,(NOTE_SEMI[note]||0)/12) * Math.pow(2, octave-4); }
/* per-key tanpura recordings (ragajunglism.org) — one file per Sa, never pitch-shifted */
const TANPURA_FILE = {C:"c","C#":"db",D:"d","D#":"eb",E:"e",F:"f","F#":"gb",G:"g","G#":"ab",A:"a","A#":"bb",B:"b"};
const tanpuraUrl = (n)=> `https://ragajunglism.org/wp-content/uploads/2020/03/${TANPURA_FILE[n]}-tanpura-thick.mp3`;
let shrutiVol = Math.min(1, Math.max(0, parseFloat(localStorage.getItem("bhajan-shruti-vol")||"0.7")));

function shrutiUiOn(note, statusTxt){
  const info = SCALES.find(s=>s[0]===note);
  $("shrutitxt").textContent = statusTxt || `${t("playingShruti")}: ${note} · ${info?info[1]:""} — ${t("stopShruti")}`;
  $("shrutibar").style.display = "flex";
  const ft = $("fabTanpura"); if(ft) ft.classList.add("live");
  const fn = $("fabNote"); if(fn){ fn.textContent = note; fn.style.display = "flex"; }
  document.querySelectorAll(".sc").forEach(el=>{ el.classList.toggle("playing", el.dataset.note===note); });
  document.querySelectorAll(".tanp-key").forEach(el=>{ el.classList.toggle("playing", el.dataset.note===note); el.classList.remove("hint"); });
  const sn = document.querySelector(".sgnote"); if(sn && !statusTxt) sn.textContent = `${note} · ${info?info[1]:""}`;
  const lv = $("sg-tanp-live"); if(lv) lv.classList.add("on");
}
function synthShruti(note){
  /* fallback drone (offline / recording blocked) */
  try{
    actx();
    const master = audioCtx.createGain(); master.gain.value = 0;
    const lp = audioCtx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value = 1600;
    master.connect(lp); lp.connect(audioCtx.destination);
    const voices = [
      {f:noteFreq(note,3), g:.5}, {f:noteFreq(note,3)*1.5, g:.28},
      {f:noteFreq(note,4), g:.3}, {f:noteFreq(note,4)*1.003, g:.12},
    ];
    for(const v of voices){
      const o = audioCtx.createOscillator(); o.type = "sawtooth";
      const g = audioCtx.createGain(); g.gain.value = v.g;
      o.frequency.value = v.f; o.connect(g); g.connect(master); o.start();
      shrutiNodes.push(o);
    }
    master.gain.linearRampToValueAtTime(.16 * shrutiVol + .04, audioCtx.currentTime + .6);
    shrutiNodes.push(master);
  }catch(e){ console.error(e); }
}

/* ================= recordings (PRIVATE — stored on this device in IndexedDB) =================
   Record yourself while the lyrics are on screen. Nothing is uploaded. */
const REC_DB = "bhajan-rec", REC_STORE = "recs";
function recDb(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open(REC_DB, 1);
    r.onupgradeneeded = ()=>{ const st = r.result.createObjectStore(REC_STORE, {keyPath:"id"}); st.createIndex("bid","bid"); st.createIndex("created","created"); };
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
}
async function recAll(bid){
  try{
    const db = await recDb();
    return await new Promise((res, rej)=>{
      const st = db.transaction(REC_STORE).objectStore(REC_STORE);
      const q = bid ? st.index("bid").getAll(bid) : st.getAll();
      q.onsuccess = ()=>res((q.result||[]).sort((a,b)=>b.created-a.created)); q.onerror = ()=>rej(q.error);
    });
  }catch{ return []; }
}
async function recPut(r){ const db = await recDb(); return new Promise((res,rej)=>{ const tx=db.transaction(REC_STORE,"readwrite"); tx.objectStore(REC_STORE).put(r); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
async function recRemove(id){ const db = await recDb(); return new Promise((res,rej)=>{ const tx=db.transaction(REC_STORE,"readwrite"); tx.objectStore(REC_STORE).delete(id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
window.recCount = 0;
recAll().then(a=>{ window.recCount = a.length; });

let _ar = null;   /* {bid, mr, stream, chunks, t0, timer, an, raf} */
const recMime = ()=> ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"].find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
const recExt  = (m)=> m.includes("mp4") ? "m4a" : m.includes("ogg") ? "ogg" : "webm";

window.recToggle = async (bid)=>{
  if(_ar){ if(_ar.bid===bid) recStop(); else toast(t("recStop"), true); return; }
  if(!window.isSecureContext){ toast(t("recHttps"), true); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ toast(t("recNoSupport"), true); return; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(err){
    console.error("getUserMedia:", err);
    const k = (err && err.name)||"";
    toast(k==="NotAllowedError"||k==="SecurityError" ? t("recDenied") : k==="NotFoundError" ? t("recNoMic") : k==="NotReadableError" ? t("recBusy") : t("recNoMic"), true);
    return;
  }
  const mime = recMime();
  let mr;
  try{ mr = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined); }
  catch(err){ try{ mr = new MediaRecorder(stream); }catch(e2){ console.error(e2); stream.getTracks().forEach(tr=>tr.stop()); toast(t("recNoSupport"), true); return; } }
  mr.onerror = (e)=>{ console.error("MediaRecorder:", e); toast("Recording error: "+((e.error&&e.error.name)||""), true); };
  _ar = {bid, mr, stream, chunks:[], t0:Date.now(), mime: mr.mimeType || mime || "audio/webm"};
  mr.ondataavailable = (e)=>{ if(e.data && e.data.size) _ar.chunks.push(e.data); };
  mr.onstop = recFinish;
  try{ mr.start(1000); }catch{ mr.start(); }
  keepAwake(); buzz(20);
  /* live level meter (own context: mic sample-rate can differ from the tanpura context) */
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)(); const src = ctx.createMediaStreamSource(stream); const an = ctx.createAnalyser(); an.fftSize = 256; src.connect(an);
    _ar.an = an; _ar.src = src; _ar.ctx = ctx;
  }catch(e){ console.warn("meter:", e); }
  recPaintUi();
};

function recPaintUi(){
  const bid = _ar.bid;
  const dock = $("recdock-"+bid); if(!dock) return;
  dock.classList.add("live");
  dock.innerHTML = `<div class="reclive" id="reclive"><span class="rec-dot"></span><b id="rectime">0:00</b><canvas id="recmeter" width="600" height="56"></canvas><button class="recstopbtn" onclick="recStop()">${ICONS.stop} ${t("recStop")}</button></div>`;
  const cv = dock.querySelector("canvas"), g = cv.getContext("2d");
  const buf = _ar.an ? new Uint8Array(_ar.an.frequencyBinCount) : null;
  const bars = new Array(48).fill(0);
  const acc = getComputedStyle(document.documentElement).getPropertyValue("--gold").trim() || "#FFA43A";
  const draw = ()=>{
    if(!_ar) return;
    const sec = Math.floor((Date.now()-_ar.t0)/1000); const tt = $("rectime"); if(tt) tt.textContent = fmtTime(sec);
    let lvl = 0.08;
    if(buf){ _ar.an.getByteTimeDomainData(buf); let sum=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; sum+=v*v; } lvl = Math.min(1, Math.sqrt(sum/buf.length)*3.2); }
    bars.shift(); bars.push(lvl);
    g.clearRect(0,0,cv.width,cv.height); g.fillStyle = acc;
    const w = cv.width/bars.length;
    bars.forEach((v,i)=>{ const h = Math.max(3, v*cv.height); g.globalAlpha = .35 + .65*(i/bars.length); g.fillRect(i*w+2, (cv.height-h)/2, w-4, h); });
    _ar.raf = requestAnimationFrame(draw);
  };
  draw();
}

window.recStop = ()=>{ if(!_ar) return; try{ _ar.mr.stop(); }catch{} };

async function recFinish(){
  const r = _ar; _ar = null;
  cancelAnimationFrame(r.raf);
  try{ r.stream.getTracks().forEach(tr=>tr.stop()); r.src && r.src.disconnect(); r.ctx && r.ctx.close(); }catch{}
  releaseAwake();
  const dock = $("recdock-"+r.bid);
  if(dock){ dock.classList.remove("live"); dock.innerHTML = `<button class="recdock-btn" id="recbtn-${r.bid}" onclick="recToggle('${r.bid}')" title="${t("recBtn")}"><span class="rd-dot"></span>${ICONS.mic}<span class="rd-lbl">${t("recStart")}</span></button>`; }
  const dur = Math.round((Date.now()-r.t0)/1000);
  if(!r.chunks.length || dur < 1) return;
  const b = bhajans.find(x=>x.id===r.bid);
  const blob = new Blob(r.chunks, {type:r.mime});
  const rec = { id: "r"+Date.now().toString(36), bid: r.bid, bname: b ? b.name : "", name: "", dur, created: Date.now(), mime: r.mime, size: blob.size, blob };
  try{ await recPut(rec); window.recCount++; toast(t("recSaved")); buzz(15); }
  catch(e){ console.error(e); toast("Could not save recording", true); return; }
  recRenderList(r.bid);
}

window.shareLyricsImage = async (id)=>{
  const b = bhajans.find(x=>x.id===id); if(!b) return;
  if(!b.lyricsText){ toast(t("noLyrics"), true); return; }
  const FL = '"Mukta","Tiro Devanagari Hindi",sans-serif';
  /* make sure Devanagari glyphs are loaded before drawing */
  try{
    await Promise.all([
      document.fonts.load(`500 46px ${FL}`, b.lyricsText.slice(0,120)),
      document.fonts.load(`600 58px ${FL}`, b.name)
    ]);
  }catch{}

  const W = 1080, pad = 72, maxW = W - pad*2, lh = 84;
  const c = document.createElement("canvas");
  const x = c.getContext("2d");

  /* word-wrap each lyric line to the card width */
  x.font = `500 46px ${FL}`;
  const wrap = (line)=>{
    if(!line.trim()) return [""];
    const words = line.split(/\s+/), out = []; let cur = "";
    for(const w of words){
      const test = cur ? cur+" "+w : w;
      if(x.measureText(test).width > maxW && cur){ out.push(cur); cur = w; }
      else cur = test;
    }
    if(cur) out.push(cur);
    return out;
  };
  let lines = [];
  for(const raw of b.lyricsText.replace(/\r/g,"").split("\n")) lines.push(...wrap(raw));
  if(lines.length > 110){ lines = lines.slice(0,110); lines.push("…"); }

  const headH = 214, footH = 140;
  c.width = W; c.height = headH + lines.length*lh + footH;

  /* card: warm cream, gold band, title, meta, divider, lyrics, footer */
  x.fillStyle = "#fbf6ea"; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = "#b0770f"; x.fillRect(0, 0, W, 10);

  x.fillStyle = "#241d3d";
  let tfs = 58;
  x.font = `600 ${tfs}px ${FL}`;
  while(x.measureText(b.name).width > maxW && tfs > 32){ tfs -= 2; x.font = `600 ${tfs}px ${FL}`; }
  x.fillText(b.name, pad, 110);

  const meta = [b.singer?`🎤 ${b.singer}`:"", b.scale?`Scale · ${b.scale}`:""].filter(Boolean).join("    ");
  if(meta){ x.font = `400 32px ${FL}`; x.fillStyle = "#7c5406"; x.fillText(meta, pad, 162); }

  x.strokeStyle = "#e5dcc4"; x.lineWidth = 2;
  x.beginPath(); x.moveTo(pad, 190); x.lineTo(W-pad, 190); x.stroke();

  x.font = `500 46px ${FL}`; x.fillStyle = "#2b2340";
  let y = headH + 52;
  for(const ln of lines){ if(ln) x.fillText(ln, pad, y); y += lh; }

  x.font = `500 27px ${FL}`; x.fillStyle = "#9a8a5a";
  x.fillText("🪕 Shyam Bhajan Sangrah", pad, c.height - 54);
  const link = (location.origin + location.pathname + "#b=" + id).replace(/^https?:\/\//,"");
  x.textAlign = "right"; x.fillText(link, W - pad, c.height - 54); x.textAlign = "left";

  const blob = await new Promise(res=>c.toBlob(res, "image/png"));
  if(!blob){ toast(t("imgFail"), true); return; }
  const fname = (b.name||"bhajan").replace(/[^\w\u0900-\u097F -]+/g,"").trim().slice(0,40) + ".png";
  const file = new File([blob], fname, {type:"image/png"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:b.name});
      buzz(15);
      return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  /* fallback: plain download (desktop browsers) */
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast(t("imgSaved"));
};

/* ================= file handling ================= */
function compressImage(file, maxW, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function loadTesseract(){
  if(_tessReady) return _tessReady;
  _tessReady = _loadScript("https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.5/tesseract.min.js");
  _tessReady.catch(()=>{ _tessReady = null; });

}

window.onScanPick = async (e)=>{
  const files = [...(e.target.files||[])]; e.target.value = "";
  if(!files.length) return;
  const st = $("scanstat");
  const setSt = (m)=>{ if(st) st.textContent = m; };
  let worker = null;
  try{
    setSt("⏳ " + t("ocrLoading"));
    await loadTesseract();
    worker = await Tesseract.createWorker("hin+eng", 1, {
      logger: (m)=>{ if(m.status === "recognizing text") setSt(`🔍 ${t("ocrReading")} ${Math.round(m.progress*100)}%`); }
    });
    let out = "";
    for(let i=0; i<files.length; i++){
      setSt(`📷 ${i+1}/${files.length} — ${t("ocrReading")}`);
      const dataUrl = await compressImage(files[i], 1600, 0.92);
      const {data} = await worker.recognize(dataUrl);
      const txt = (data.text||"").replace(/\n{3,}/g,"\n\n").trim();
      if(txt) out += (out ? "\n\n" : "") + txt;
    }
    const ta = $("f-ltext");
    if(ta && out){ ta.value = (ta.value ? ta.value + "\n\n" : "") + out; }
    setSt(out ? "✅ " + t("ocrDone") : "❌ " + t("ocrFail"));
    if(out){ toast(t("ocrDone")); buzz(15); } else toast(t("ocrFail"), true);
  }catch(err){
    console.error("ocr:", err);
    setSt("❌ " + t("ocrFail"));
    toast(t("ocrFail"), true);
    _tessReady = null;
  }finally{
    try{ if(worker) await worker.terminate(); }catch{}
  }
};

/* ---- tap router ----
   One tap does the primary action *immediately* (inside the click gesture, so
   external links always open — including from the home-screen app).
   Press-and-hold on a row opens a small in-app menu with the other actions.
   .ri-main  [data-bid]          → lyrics reader
   .setrow   [data-bid][data-yt] → YouTube at the timestamp      (Lives)
   .setrow   [data-my]           → best match in sangrah, else YouTube search (My List)
   .sitem .nm[data-bid]          → lyrics reader                 (Setlists) */
let _lpTimer = null, _lpFired = false, _lpStart = null;
const ROW_SEL = ".setrow[data-bid], .setrow[data-my], .ri-main[data-bid], .sitem .nm[data-bid]";
document.addEventListener("pointerdown", (e)=>{
  const el = e.target.closest(ROW_SEL);
  _lpFired = false; clearTimeout(_lpTimer);
  if(!el || e.target.closest("button, a, select, .sc, .ab")) return;
  _lpStart = {x:e.clientX, y:e.clientY};
  _lpTimer = setTimeout(()=>{ _lpFired = true; buzz(14); rowMenu(el); }, 480);
}, {passive:true});
document.addEventListener("pointermove", (e)=>{
  if(!_lpTimer || !_lpStart) return;
  if(Math.abs(e.clientX-_lpStart.x) > 10 || Math.abs(e.clientY-_lpStart.y) > 10){ clearTimeout(_lpTimer); _lpTimer = null; }
}, {passive:true});
["pointerup","pointercancel","scroll"].forEach(ev=> document.addEventListener(ev, ()=>{ clearTimeout(_lpTimer); _lpTimer = null; }, {passive:true}));
document.addEventListener("contextmenu", (e)=>{ if(e.target.closest(ROW_SEL)) e.preventDefault(); });

document.addEventListener("click", (e)=>{
  if(e.target.closest(".sc") || e.target.closest(".ab") || e.target.closest("select") || e.target.closest("button")) return;
  const el = e.target.closest(ROW_SEL);
  if(!el) return;
  e.preventDefault();
  if(_lpFired){ _lpFired = false; return; }          /* the long-press menu handled it */
  buzz(6);
  if(el.dataset.my){ mySmartOpen(el.dataset.my); return; }
  if(el.dataset.yt){ countView(el.dataset.bid); openExternal(el.dataset.yt); return; }
  rowOpen(el.dataset.bid);
});

window.saveBhajan = async ()=>{
  if(saving) return;

  /* duplicate check (new bhajans only): same normalised name or 1–2 edits away */
  if(!editingId){
    const nn = normTxt(name);
    const dup = nn.length >= 3 && bhajans.find(b=>{
      const bn = normTxt(b.name);
      if(!bn) return false;
      if(bn === nn) return true;
      if(nn.length >= 6 && (bn.includes(nn) || nn.includes(bn))) return true;
      return lev(bn, nn) <= (Math.min(bn.length, nn.length) > 8 ? 2 : 1);
    });
    if(dup && !confirm(t("dupConfirm").replace("%s", dup.name + (dup.singer ? " — " + dup.singer : "")))) return;
  }
  saving = true; const btn=$("savebtn"); if(btn){btn.textContent=t("adding");btn.disabled=true;}

      if(r.reused) toast(t("reused"));

    const rec = {
      name,

      scale: $("f-scale").value,

/* ---- PDF rendering via PDF.js (Android Chrome can't show PDFs in iframes) ---- */
let _pdfjsReady = null;
function _loadScript(url){
  return new Promise((res, rej)=>{
    const s = document.createElement("script");
    s.src = url; s.onload = res; s.onerror = ()=>rej(new Error("load "+url));
    document.head.appendChild(s);
  });
}
function loadPdfJs(){
  if(_pdfjsReady) return _pdfjsReady;
  _pdfjsReady = (async ()=>{
    try{
      /* self-hosted (same-origin worker — most reliable) */
      await _loadScript("pdfjs/pdf.min.js");
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "pdfjs/pdf.worker.min.js";
    }catch(e){
      /* CDN fallback if the pdfjs folder wasn't uploaded */
      await _loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  })();
  _pdfjsReady.catch(()=>{ _pdfjsReady = null; });   /* allow retry next time */
  return _pdfjsReady;
}
async function renderPdfInto(holder, dataUrl){
  await loadPdfJs();
  const b64 = dataUrl.split(",")[1];
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const pdf = await window.pdfjsLib.getDocument({data: bytes}).promise;
  const width = Math.min(holder.clientWidth || 700, 900);
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const base = page.getViewport({scale: 1});
    const scale = Math.min(3, (width / base.width) * Math.min(window.devicePixelRatio || 1, 2.5));
    const vp = page.getViewport({scale});
    const c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height;
    c.className = "read-pdfpage";
    holder.appendChild(c);
    await page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
    if(pdf.numPages > 1){
      const cap = document.createElement("div");
      cap.className = "pagecap"; cap.textContent = `${p} / ${pdf.numPages}`;
      holder.appendChild(cap);
    }
  }
}

/* ================= rendering ================= */
const sessById = ()=> Object.fromEntries(sessions.map(s=>[s.id,s]));
const allSingers = ()=> [...new Set(bhajans.map(b=>(b.singer||"").trim()).filter(Boolean))].sort();
const hasAnyLyrics = (b)=> b.lyricsLink || b.lyricsText || b.hasFiles;

function topSingers(n=3){
  const counts = {};
  bhajans.forEach(b=>{ const s=(b.singer||"").trim(); if(s) counts[s]=(counts[s]||0)+1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n);
}
/* ---- fuzzy search: forgives Hinglish spelling differences & typos ---- */
function normTxt(s){
  s = dev2roman(String(s||"")).toLowerCase();   /* Devanagari ⇄ Hinglish match each other */
  s = s.replace(/[^a-z0-9\u0900-\u097F ]+/g, " ");
  // common transliteration equivalences
  s = s.replace(/aa/g,"a").replace(/ee/g,"i").replace(/oo/g,"u")
       .replace(/w/g,"v").replace(/ph/g,"f").replace(/z/g,"j")
       .replace(/chh/g,"ch").replace(/q/g,"k").replace(/x/g,"ks");
  s = s.replace(/h/g,"");            // shyam/sham/syam → sam; hai/he → ai/e
  s = s.replace(/y/g,"i");
  s = s.replace(/a\b/g,"");          // silent final schwa: krishna/krishn → same
  s = s.replace(/(.)\1+/g,"$1");     // collapse doubles
  return s.replace(/\s+/g," ").trim();
}
/* bold the typed words inside a matched lyric line (Roman or Devanagari, via the same normaliser) */
function hiLite(line, q){
  const words = line.split(/(\s+)/);
  const qw = normTxt(q).split(" ").filter(Boolean);
  return words.map(w=>{
    if(!w.trim()) return w;
    const n = normTxt(w);
    return n && qw.some(tk => n.startsWith(tk) || (tk.length>=3 && n.includes(tk))) ? `<b>${esc(w)}</b>` : esc(w);
  }).join("");
}
function lev(a, b){
  if(a===b) return 0;
  const m=a.length, n=b.length;
  if(Math.abs(m-n) > 2) return 3;
  let prev = Array.from({length:n+1}, (_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
function searchScore(hay, q){
  const H = normTxt(hay), Q = normTxt(q);
  if(!Q) return 1;
  if(H.includes(Q)) return H.startsWith(Q) ? 5 : 4;          // exact phrase
  const hw = H.split(" "), qw = Q.split(" ");
  // every word typed is a prefix of some word in the name
  if(qw.every(tk => hw.some(w => w.startsWith(tk)))) return 3;
  // every word is a substring
  if(qw.every(tk => hw.some(w => w.includes(tk)))) return 2;
  // spelling-tolerant (typos / Hinglish variants)
  const ok = qw.every(tk =>
    hw.some(w => {
      const tol = tk.length>=6 ? 2 : tk.length>=4 ? 1 : 0;
      return tol>0 && lev(w, tk) <= tol;
    })
  );
  return ok ? 1 : 0;
}

/* ---- lyric search index: normalised lines per bhajan, rebuilt only when the text changes ---- */
const _lyrIdx = new Map();
function lyricLines(b){
  const txt = b.lyricsText || "";
  if(!txt) return null;
  const c = _lyrIdx.get(b.id);
  if(c && c.txt===txt) return c.lines;
  const lines = txt.replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(l=>l && !/^[\[\(\{]/.test(l))
    .slice(0, 80).map((raw,i)=>({raw, norm:normTxt(raw), i}));
  _lyrIdx.set(b.id, {txt, lines});
  return lines;
}
function lyricScore(b, q){
  const lines = lyricLines(b); if(!lines) return [0,null];
  const Q = normTxt(q); if(!Q) return [0,null];
  let best = 0, hit = null;
  for(const ln of lines){
    let sc = 0;
    if(ln.norm.includes(Q)) sc = ln.norm.startsWith(Q) ? 5 : 4;
    else{
      const hw = ln.norm.split(" "), qw = Q.split(" ");
      if(qw.every(tk => hw.some(w => w.startsWith(tk)))) sc = 3;
      else if(qw.length>1 && qw.every(tk => hw.some(w => w.includes(tk)))) sc = 2;
    }
    if(sc && ln.i < 3) sc += .5;                 /* people remember the opening line */
    if(sc > best){ best = sc; hit = ln.raw; }
  }
  return [best, hit];
}
const searchHits = new Map();   /* bhajan id → matched lyric line (for the row) */

function filtered(){
  const q = search.trim();
  searchHits.clear();
  const S = sessById();
  let list = bhajans.filter(b=>{
    if(favOnly && !favs.has(b.id)) return false;
    if(missF && hasAnyLyrics(b)) return false;
    if(scaleF && b.scale!==scaleF) return false;
    if(singerF && (b.singer||"").trim()!==singerF) return false;
    if(tagF && !bTags(b).includes(tagF)) return false;
    return true;
  });
  if(histF){
    const pos = new Map(hist.map((id,i)=>[id,i]));
    list = list.filter(b=>pos.has(b.id)).sort((a,b)=>pos.get(a.id)-pos.get(b.id));
  }
  if(recentF){
    list = [...list]
      .sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0))
      .slice(0, 30);
  }
  if(!q) return list;
  const scored = [];
  for(const b of list){
    const sess = S[b.sessionId];
    const nameS = Math.max(
      searchScore(b.name, q),
      searchScore(b.singer||"", q) - 1,
      searchScore((b.notes||"") + " " + (sess?sess.title:""), q) - 2
    );
    const [lyrS, hit] = q.length >= 3 ? lyricScore(b, q) : [0,null];
    const s = Math.max(nameS, lyrS - 1);
    if(s > 0){ scored.push([s, b]); if(hit && lyrS - 1 > nameS) searchHits.set(b.id, hit); }
  }
  scored.sort((a,b)=> b[0]-a[0] || a[1].name.localeCompare(b[1].name));
  return scored.map(x=>x[1]);
}

/* ═══════════════════════════════════════════════════════════════════════
   SANGAT — tanpura + tabla accompaniment engine
   · Tabla: real CC0 stroke samples (sounds/tabla), sequenced from authentic
     thekas on the Web Audio clock. Dayan retuned to the bhajan's Sa.
   · Tanpura: per-key recordings, crossfaded so the loop never clicks.
   · One master bus with a soft limiter so phone speakers don't distort.
   ═══════════════════════════════════════════════════════════════════════ */
const TB_DIR = "sounds/tabla/";
const TB_SAMPLES = ["na","na_o","na_s","tun1","tun2","tun3","te1","te2","te_m","te_ne","ghe1","ghe2","ghe3","ghe4","ghe7","ghe8","ke1","ke2","ke3","re","tas1","tas2","tas3","dhec"];
/* measured fundamental of the dayan samples (Hz) — used to retune to the scale */
const TB_F0 = {na:278.8, na_o:278.1, na_s:426.0, tun1:314.6, tun2:315.3, tun3:315.3, tas1:553.8, tas2:559.9, tas3:280.8};
const TB = {};            /* decoded buffers */
let tbLoading = null;
async function tbLoad(){
  if(tbLoading) return tbLoading;
  tbLoading = (async ()=>{
    actx();
    /* look in sounds/tabla/ first; fall back to the repo root (GitHub's uploader flattens folders) */
    const dirs = [TB_DIR, ""];
    let missing = [];
    await Promise.all(TB_SAMPLES.map(async k=>{
      for(const d of dirs){
        try{
          const r = await fetch(d+k+".wav"); if(!r.ok) continue;
          TB[k] = await audioCtx.decodeAudioData(await r.arrayBuffer()); return;
        }catch(e){ /* try next location */ }
      }
      missing.push(k);
    }));
    if(missing.length) console.error("tabla samples not found:", missing.join(", "));
  })();
  return tbLoading;
}

/* ---- master bus: tabla + tanpura → gentle compressor → speakers ---- */
let bus = null;
function sangatBus(){
  if(bus) return bus;
  const c = actx();
  const comp = c.createDynamicsCompressor();
  comp.threshold.value = -10; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = .004; comp.release.value = .18;
  const master = c.createGain(); master.gain.value = .9;
  const tabla = c.createGain(), tanp = c.createGain();
  const tPan = c.createStereoPanner ? c.createStereoPanner() : null; if(tPan) tPan.pan.value = .18;
  /* short room for the tabla — a synthetic 1.1 s impulse, mixed low */
  const rev = c.createConvolver(); rev.buffer = makeRoom(c, 1.1, 2.6); const revG = c.createGain(); revG.gain.value = .14;
  tabla.connect(tPan||master); if(tPan) tPan.connect(master);
  tabla.connect(revG); revG.connect(rev); rev.connect(master);
  tanp.connect(master); master.connect(comp); comp.connect(c.destination);
  bus = {master, tabla, tanp};
  return bus;
}
function makeRoom(c, sec, decay){
  const n = Math.floor(c.sampleRate*sec), b = c.createBuffer(2, n, c.sampleRate);
  for(let ch=0; ch<2; ch++){ const d = b.getChannelData(ch); for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, decay); }
  return b;
}

/* ---- strokes: how each bol is built from the samples ----
   d = dayan sample(s) (round-robin), b = bayan sample(s), g = gain, long = bayan ghissa on sam */
const STROKES = {
  dha:  {d:["na","na_o"],      b:["ghe1","ghe4"],       g:1.00},
  dhaS: {d:["na_o","na"],      b:["ghe3","ghe2"],       g:1.08},   /* sam: open bayan with slide */
  dhin: {d:["tun1","tun2","tun3"], b:["ghe1","ghe4"],   g:0.92},
  dhi:  {d:["tun2","tun1"],    b:["ghe8","ghe1"],       g:0.85},
  na:   {d:["na","na_o"],                               g:0.82},
  ta:   {d:["na","na_s"],                               g:0.78},
  tin:  {d:["tun3","tun1","tun2"],                      g:0.66},
  ti:   {d:["tas3","na_s"],                             g:0.62},
  tun:  {d:["tun2","tun3"],                             g:0.72},
  te:   {d:["te1","te2","te_m"],                        g:0.70},
  re:   {d:["re","te_ne"],                              g:0.60},
  ge:   {b:["ghe1","ghe4","ghe8"],                      g:0.85},
  ghe:  {b:["ghe7","ghe2"],                             g:0.85},
  ke:   {b:["ke1","ke2","ke3"],                         g:0.62},
  ka:   {b:["ke2","ke1"],                               g:0.62},
  kat:  {b:["dhec"],                                    g:0.80},
  tak:  {d:["na_s","tas1"],                             g:0.68},
  dhage:{seq:["dha","ge"]},
  tirakita:{seq:["te","re","ke","te"]},
  tita: {seq:["te","te"]},
  kere: {seq:["ke","re"]},
};
/* ---- thekas. Each matra is a string; several bols in one matra share it evenly. "-" = rest. ---- */
const TAALS = {
  "Keherwa":   {n:8, vib:[4,4], khali:5, hi:"कहरवा", thekas:{
      "Theka":     ["dha","ge","na","ti","na","ka","dhin","na"],
      "Bhajan":    ["dha","ge na","tin","na ka","dhin","na ge","dhin","na"],
      "Light":     ["dhin","na ge","dhi ta","ge na","ti","na ke","dhin","na"],
    }, fill:["dha ge","dha ge","na ti","na ka"]},
  "Bhajani":   {n:8, vib:[4,4], khali:5, hi:"भजनी", thekas:{
      "Theka":     ["dhin","na","dhin dhin","na","tin","na","dhin dhin","na"],
      "Open":      ["dha","ge na","dhin dhin","na","ta","ke na","dhin dhin","na"],
    }, fill:["dha ge","dhin na","dha ge","tin na"]},
  "Dadra":     {n:6, vib:[3,3], khali:4, hi:"दादरा", thekas:{
      "Theka":     ["dha","dhin","na","dha","tin","na"],
      "Light":     ["dha ge","tin na","dhin","ta ke","tin na","dhin"],
    }, fill:["dha ge","tirakita","dha ge"]},
  "Deepchandi":{n:14, vib:[3,4,3,4], khali:8, hi:"दीपचंदी", thekas:{
      "Theka":     ["dhaS","dhin","ghe","dha","dha","tin","-","ta","tin","-","dha","dha","dhin","ghe"],
    }},
  "Chanchar":  {n:14, vib:[3,4,3,4], khali:8, hi:"चांचर", thekas:{
      "Theka":     ["dhaS","dhin","-","dha","ge","tin","-","ta","tin","-","dha","ge","dhin","-"],
    }},
  "Rupak":     {n:7, vib:[3,2,2], khali:1, hi:"रूपक", thekas:{
      "Theka":     ["tin","tin","na","dhin","na","dhin","na"],
    }},
  "Jhaptaal":  {n:10, vib:[2,3,2,3], khali:6, hi:"झपताल", thekas:{
      "Theka":     ["dhi","na","dhi","dhi","na","ti","na","dhi","dhi","na"],
    }},
  "Ektaal":    {n:12, vib:[2,2,2,2,2,2], khali:7, hi:"एकताल", thekas:{
      "Theka":     ["dhin","dhin","dhage","tirakita","tun","na","kat","ta","dhage","tirakita","dhi","na"],
    }},
  "Teentaal":  {n:16, vib:[4,4,4,4], khali:9, hi:"तीनताल", thekas:{
      "Theka":     ["dhaS","dhin","dhin","dha","dha","dhin","dhin","dha","dha","tin","tin","ta","ta","dhin","dhin","dha"],

};

/* ---- state (persisted) ---- */
let SG = {
  taal: localStorage.getItem("sg-taal") || "Keherwa",
  theka: localStorage.getItem("sg-theka") || "Theka",
  bpm: +(localStorage.getItem("sg-bpm") || 84),
  tablaVol: +(localStorage.getItem("sg-tvol") ?? 0.85),
  tanpVol: +(localStorage.getItem("sg-pvol") ?? 0.7),
  tanpStrength: localStorage.getItem("sg-pstr") || "medium",   /* light | medium | full */
  fills: (localStorage.getItem("sg-fills") ?? "1") === "1",
  bid: null,          /* bhajan the panel was opened for */
};
if(!TAALS[SG.taal]) SG.taal = "Keherwa";
if(!TAALS[SG.taal].thekas[SG.theka]) SG.theka = "Theka";
const sgSave = ()=>{ localStorage.setItem("sg-taal", SG.taal); localStorage.setItem("sg-theka", SG.theka); localStorage.setItem("sg-bpm", SG.bpm);
  localStorage.setItem("sg-tvol", SG.tablaVol); localStorage.setItem("sg-pvol", SG.tanpVol); localStorage.setItem("sg-pstr", SG.tanpStrength); localStorage.setItem("sg-fills", SG.fills?"1":"0"); };

/* ---- dayan tuning: Sa of the scale, kept within ±6 semitones of the recording ---- */
function dayanSaHz(note){
  const n = NOTE_SEMI[note] ?? 1;
  const oct = n >= 9 ? 3 : 4;                 /* A, A#, B → one octave down so nothing is over-stretched */
  return 261.6256 * Math.pow(2, n/12) * Math.pow(2, oct-4);
}
const rr = {};  /* round-robin pointers */
function pick(arr){ const i = (rr[arr[0]] = ((rr[arr[0]]||0)+1) % arr.length); return arr[i]; }

function playSample(k, time, gain, rate){
  const buf = TB[k]; if(!buf) return;
  const s = audioCtx.createBufferSource(); s.buffer = buf; s.playbackRate.value = rate || 1;
  const g = audioCtx.createGain(); g.gain.value = gain;
  s.connect(g); g.connect(sangatBus().tabla); s.start(time);
}
function playStroke(name, time, vel){
  const st = STROKES[name]; if(!st) return;
  const sa = dayanSaHz(shrutiNote || SG.scale || "C#");
  const jitter = (Math.random()-.5) * .006;                 /* ±3 ms — hands, not a machine */
  const v = vel * (0.94 + Math.random()*.12);
  if(st.d){ const k = pick(st.d); playSample(k, time + jitter, st.g * v, TB_F0[k] ? sa / TB_F0[k] : 1); }
  if(st.b){ const k = pick(st.b); playSample(k, time + jitter*.5, st.g * v * .95, 1); }
}
/* schedule one matra's worth of bols */
function playMatra(str, time, dur, vel){
  if(!str || str==="-") return;
  const parts = str.trim().split(/\s+/);
  const expanded = [];
  for(const p of parts){ const st = STROKES[p]; if(st && st.seq) expanded.push(...st.seq.map((s,i)=>({s, w:1/st.seq.length, grp:parts.length}))); else expanded.push({s:p, w:1}); }
  /* each top-level part shares the matra equally; a phrase (tirakita) subdivides its share */
  let t = time; const share = dur / parts.length;
  let i = 0;
  for(const p of parts){
    const st = STROKES[p];
    if(st && st.seq){ const sub = share / st.seq.length; st.seq.forEach((s,j)=> playStroke(s, t + j*sub, vel * (j===0?1:.8))); }
    else playStroke(p, t, vel);
    t += share; i++;
  }
}

/* ---- sequencer ---- */
let sgOn = false, sgTimer = null, sgNext = 0, sgMatra = 0, sgCycle = 0, sgQueue = [];
function tick(){
  const T = TAALS[SG.taal], theka = T.thekas[SG.theka] || Object.values(T.thekas)[0];
  const dur = 60 / SG.bpm;
  while(sgNext < audioCtx.currentTime + .2){
    const m = sgMatra % T.n;
    const lastCycleOfFour = SG.fills && T.fill && (sgCycle % 4 === 3);
    let bol = theka[m];
    if(lastCycleOfFour && m >= T.n - T.fill.length) bol = T.fill[m - (T.n - T.fill.length)];
    let vel = 1;
    if(m === 0) vel = 1.15;                                         /* sam */
    else if(m === T.khali-1) vel = .8;                              /* khali */
    else if(T.vib && isVibhagStart(T, m)) vel = 1.05;
    playMatra(bol, sgNext, dur, vel);
    sgQueue.push({t:sgNext, m});
    sgNext += dur; sgMatra++;
    if(sgMatra % T.n === 0) sgCycle++;
  }
}
function isVibhagStart(T, m){ let s = 0; for(const v of T.vib){ if(m===s) return true; s += v; } return false; }
function uiLoop(){
  if(!sgOn) return;
  const now = audioCtx.currentTime;

/* ---- tanpura: two players crossfading so the recording loops without a click ---- */
const TANP_XF = 1.2;   /* seconds of crossfade */
let tanp = null;       /* {note, a:[Audio,Audio], cur, timer, tok} */
const strengthGain = ()=> ({light:.42, medium:.7, full:1})[SG.tanpStrength] || .7;
function tanpVolNow(){ return Math.min(1, SG.tanpVol * strengthGain()); }
function tanpStartLoop(note, tok){
  const url = tanpuraUrl(note);
  const mk = ()=>{ const a = new Audio(url); a.preload = "auto"; a.volume = 0; return a; };
  const players = [mk(), mk()];
  tanp = {note, a:players, cur:0, tok, timer:null};
  let started = false;
  const fadeTo = (a, target, ms)=>{ const steps = 12, from = a.volume, dt = ms/steps; let i = 0; const iv = setInterval(()=>{ i++; a.volume = Math.max(0, Math.min(1, from + (target-from)*i/steps)); if(i>=steps) clearInterval(iv); }, dt); return iv; };
  const swap = ()=>{
    if(!tanp || tanp.tok!==tok) return;
    const dur = players[0].duration; if(!isFinite(dur) || dur < TANP_XF*2) return;
    const cur = players[tanp.cur], nxt = players[1-tanp.cur];
    nxt.currentTime = 0.15; nxt.volume = 0; nxt.play().catch(()=>{});
    fadeTo(nxt, tanpVolNow(), TANP_XF*1000); fadeTo(cur, 0, TANP_XF*1000);
    setTimeout(()=>{ try{ cur.pause(); }catch{} }, TANP_XF*1000 + 80);
    tanp.cur = 1 - tanp.cur;
    tanp.timer = setTimeout(swap, (dur - TANP_XF - 0.3) * 1000);
  };
  const a0 = players[0];
  a0.addEventListener("error", ()=>{ if(tanp && tanp.tok===tok){ tanpStop(true); synthShruti(note); shrutiUiOn(note); } }, {once:true});
  a0.play().then(()=>{
    started = true; fadeTo(a0, tanpVolNow(), 900);
    if(shrutiNote===note) shrutiUiOn(note);
    const arm = ()=>{ const dur = a0.duration; if(isFinite(dur) && dur > TANP_XF*2) tanp.timer = setTimeout(swap, (dur - TANP_XF - 0.3) * 1000); };
    if(isFinite(a0.duration)) arm(); else a0.addEventListener("loadedmetadata", arm, {once:true});
    a0.loop = false; players[1].load();
  }).catch(()=>{ if(tanp && tanp.tok===tok){ tanpStop(true); synthShruti(note); shrutiUiOn(note); } });
}
let tanpTok = 0;
function tanpStop(keepUi){
  tanpTok++;
  if(tanp){ clearTimeout(tanp.timer); tanp.a.forEach(a=>{ try{ a.pause(); a.src=""; }catch{} }); tanp = null; }
}

window.sgSetStrength = (s)=>{ SG.tanpStrength = s; sgSave(); if(tanp) tanp.a[tanp.cur].volume = tanpVolNow(); document.querySelectorAll("#sg-str button").forEach(b=>b.classList.toggle("on", b.dataset.s===s)); };
window.toggleShruti = (note, ev)=>{
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }

};

  r.onerror = (e)=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed") toast(t("micDenied"), true); else if(e.error==="no-speech") toast(t("micNoSpeech"), true); };
  r.onend = ()=>{ _rec = null; const m = $("sqmic"); if(m) m.classList.remove("listening"); };
  try{ r.start(); }catch{ _rec = null; if(mic) mic.classList.remove("listening"); }
};

/* ================= setlist picker ================= */
window.openPicker = (sid)=>{
  const sets = getSets(); const s = sets.find(x=>x.id===sid); if(!s) return;
  const div = document.createElement("div");
  div.className = "overlay";
  navPush(()=>{ div.remove(); render(); });
  div.onclick = (e)=>{ if(e.target===div) navBack(); };
  const chosen = new Set(s.items);
  function rowsHtml(q){
    let list = bhajans;
    if(q) list = bhajans.map(b=>[searchScore(b.name+" "+(b.singer||""), q), b]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
    return list.slice(0,300).map(b=>`
      <div class="pk ${chosen.has(b.id)?"sel":""}" data-id="${b.id}">
        <span class="cb">${chosen.has(b.id)?"✓":""}</span>
        <div style="min-width:0"><div class="nm">${esc(b.name)}</div><div class="si">${b.singer?esc(b.singer):""}${b.scale?` · ${b.scale}`:""}</div></div>
      </div>`).join("");
  }
  div.innerHTML = `
    <div class="picker">
      <div class="picker-head">
        <input id="pk-q" placeholder="${t("search")}">
        <button class="btn btn-gold" id="pk-done">${t("pickDone")}</button>
      </div>
      <div class="picker-list" id="pk-list">${rowsHtml("")}</div>
    </div>`;
  document.body.appendChild(div);
  const listEl = div.querySelector("#pk-list");
  listEl.addEventListener("click", (e)=>{
    const row = e.target.closest(".pk"); if(!row) return;
    const id = row.dataset.id;
    if(chosen.has(id)){ chosen.delete(id); row.classList.remove("sel"); row.querySelector(".cb").textContent=""; }
    else{ chosen.add(id); row.classList.add("sel"); row.querySelector(".cb").textContent="✓"; }
  });
  let deb;
  div.querySelector("#pk-q").addEventListener("input", (e)=>{
    clearTimeout(deb);
    deb = setTimeout(()=>{ listEl.innerHTML = rowsHtml(e.target.value); }, 150);
  });
  div.querySelector("#pk-done").onclick = async ()=>{
    const s2 = sharedSets.find(x=>x.id===sid);
    if(s2){
      const old = s2.items || [];
      const kept = old.filter(id=>chosen.has(id));
      const added = [...chosen].filter(id=>!old.includes(id));
      s2.items = [...kept, ...added];
      try{ await updateDoc(doc(db,"setlists",sid), {items:s2.items}); }
      catch(e){ console.error(e); toast(t("setSaveFail"), true); }
    }
    navBack();
  };
};

/* ================= perform mode ================= */
window.waRequest = ()=>{
  const list = filtered().slice(0, 30);
  if(!list.length) return;
  let txt = `🙏 *${t("waMsgHead")}*\n\n`;
  list.forEach((b,i)=>{ txt += `${i+1}. ${b.name}${b.singer?` — ${b.singer}`:""}\n`; });
  txt += `\n📿 ${location.origin + location.pathname}\n(${t("waMsgFoot")})`;
  openExternal("https://wa.me/?text=" + encodeURIComponent(txt), "_blank", "noopener");
};

window.shareSetlist = (sid, ev)=>{
  if(ev) ev.stopPropagation();
  const s = getSets().find(x=>x.id===sid); if(!s) return;
  const items = (s.items||[]).map(id=>bhajans.find(b=>b.id===id)).filter(Boolean);
  let txt = `🎼 *${s.name}*\n`;
  items.forEach((b,i)=>{
    const es = effScale(s, b);
    const sc = es ? ` — ${es}·${(SCALES.find(x=>x[0]===es)||[])[1]||""}` : "";
    txt += `${i+1}. ${b.name}${sc}\n`;
  });
  txt += `\n🪕 Shyam Bhajan Sangrah\n${location.origin + location.pathname}`;
  openExternal("https://wa.me/?text=" + encodeURIComponent(txt), "_blank", "noopener");
};

window.performSet = (sid)=>{
  const s = getSets().find(x=>x.id===sid); if(!s || !(s.items||[]).length) return;
  const items = (s.items||[]).map(id=>bhajans.find(b=>b.id===id)).filter(Boolean);
  if(!items.length) return;
  let i = 0;
  const div = document.createElement("div");
  div.className = "overlay";
  keepAwake();
  navPush(()=>{ div.remove(); stopShruti(); releaseAwake(); });
  function draw(){
    const b = items[i];
    div.innerHTML = `
      <div class="perform">
        <div class="pf-head">
          <button class="btn btn-ghost" onclick="navBack()">✕</button>
          <span style="font-family:var(--fd)">🎼 ${esc(s.name)}</span>
          <span class="pf-prog">${i+1} / ${items.length}</span>
        </div>
        <div class="pf-main">
          <h2>${esc(b.name)}</h2>
          ${b.singer?`<div style="color:var(--dim)">🎤 ${esc(b.singer)}</div>`:""}
          ${effScale(s,b)?`<div class="pf-scale">${scMini(effScale(s,b))} <button class="tp-open" onclick="openTranspose('${esc(effScale(s,b))}', event)" title="${t("transpose")}">±</button></div><div class="hint">${t("shrutiHint")}</div>`:""}
          <div class="pf-acts">
            ${hasAnyLyrics(b)?`<button class="btn btn-teal" onclick="openLyrics('${b.id}')">${ICONS.doc} Lyrics</button>`:""}
            <a class="btn btn-ghost" href="https://www.youtube.com/results?search_query=${encodeURIComponent(b.name+" "+(b.singer||"")+" bhajan")}" target="_blank" rel="noreferrer">▶ YouTube</a>
          </div>
        </div>
        <div class="pf-nav">
          <button ${i===0?"disabled":""} id="pf-prev">←</button>
          <button class="main" id="pf-next">${i===items.length-1 ? "✓" : "→"}</button>
        </div>
      </div>`;
    div.querySelector("#pf-prev").onclick = ()=>{ if(i>0){ i--; stopShruti(); draw(); } };
    div.querySelector("#pf-next").onclick = ()=>{
      if(i<items.length-1){ i++; stopShruti(); draw(); }
      else navBack();
    };
  }
  draw();
  document.body.appendChild(div);
};
function b_sessionPreselect(){
  /* when editing, preselect the bhajan's live */
  if(tab!=="add"||!editingId) return false;
  const b = bhajans.find(x=>x.id===editingId);
  const sel = $("f-session");
  if(b && sel && b.sessionId) sel.value = b.sessionId;
  return true;
}
function renderBulkPreview(){
  const el = $("bulkzone"); if(!el) return;
  el.innerHTML = bulkRows.length ? `
    <div class="preview">
      <div class="preview-head">${t("previewHead")} ${bulkRows.length} ${t("found")} <span>${t("previewHint")}</span></div>
      <div class="preview-rows">
        ${bulkRows.map((r,i)=>`
        <div class="prow">
          <span class="num">${i+1}.</span>
          <input value="${esc(r.name)}" oninput="bulkEdit('${r.key}','name',this.value)">
          <input class="time" placeholder="h:mm:ss" value="${esc(r.time)}" oninput="bulkEdit('${r.key}','time',this.value)">
          <button class="x" onclick="bulkRemove('${r.key}')">✕</button>
        </div>`).join("")}
      </div>
    </div>
    <button class="btn btn-gold btn-big" style="margin-top:14px" onclick="importBulk()">⚡ ${t("addAll")} ${bulkRows.length} ${t("addAllSuffix")}</button>` : "";
}
function renderListOnly(){
  const el = $("bhajan-list");
  if(!el) return;
  let list = filtered();
  const lc = $("listcount"); if(lc) lc.textContent = `${list.length} ${list.length===1?t("sqResult"):t("sqResults")}${search.trim()?` · "${search.trim()}"`:""}`;
  if(!list.length){
    el.innerHTML = `<div class="empty"><span class="om">🪔</span>${
      bhajans.length===0 ? t("emptyAll") : (histF && !search.trim()) ? t("emptyHist") : favOnly ? t("emptyFavs") : t("emptyFilter")
    }</div>`;
    const oldRail = document.getElementById("azrail"); if(oldRail) oldRail.remove();
    return;
  }
  let letters = [];
  let chunks = [];   // array of html strings, rendered progressively
  if(search.trim()){
    // ranked results: best matches first
    for(let i=0;i<list.length;i+=80) chunks.push(list.slice(i,i+80).map(bhajanRow).join(""));
  }else if(recentF || histF){
    for(let i=0;i<list.length;i+=80) chunks.push(list.slice(i,i+80).map(bhajanRow).join(""));
  }else if(sortBy === "recent" || sortBy === "views"){
    list = [...list].sort(sortBy==="recent"
      ? (a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0)
      : (a,b)=>((b.views||0)-(a.views||0)));
    for(let i=0;i<list.length;i+=80) chunks.push(list.slice(i,i+80).map(bhajanRow).join(""));
  }else{
    const groups = {};
    for(const b of list){
      // first REAL letter — ignores zero-width chars, spaces, quotes, numbers-only prefixes etc.
      const m = String(b.name).normalize("NFC").match(/[A-Za-z\u0900-\u097F]/);
      let ch = m ? m[0].toUpperCase() : "#";
      (groups[ch] = groups[ch]||[]).push(b);
    }
    letters = Object.keys(groups).sort();
    let buf = "", count = 0;
    for(const L of letters){
      buf += `<div class="alpha" id="sec-${L==="#"?"num":L.charCodeAt(0)}">${L}</div>` + groups[L].map(bhajanRow).join("");
      count += groups[L].length;
      if(count >= 80){ chunks.push(buf); buf=""; count=0; }
    }
    if(buf) chunks.push(buf);
  }

  // progressive render: first chunk immediately, rest on idle (keeps phones snappy)
  el.innerHTML = `<div class="listbox" id="listbox-inner">${chunks[0]||""}</div>`;
  const inner = $("listbox-inner");
  _pending = chunks; _pendingIdx = 1; _inner = inner;
  function next(){
    if(_pendingIdx >= _pending.length || !document.body.contains(_inner)) return;
    _inner.insertAdjacentHTML("beforeend", _pending[_pendingIdx++]);
    (window.requestIdleCallback||setTimeout)(next, 1);
  }
  (window.requestIdleCallback||setTimeout)(next, 1);
  watchSections();

  // A-Z jump rail
  const oldRail = document.getElementById("azrail"); if(oldRail) oldRail.remove();
  if(sortBy==="az" && letters.length > 4){
    const rail = document.createElement("div");
    rail.className = "azrail"; rail.id = "azrail";
    rail.innerHTML = letters.map(L=>`<button onclick="jumpTo('sec-${L==="#"?"num":L.charCodeAt(0)}')">${L}</button>`).join("");
    document.body.appendChild(rail);
  }
}
