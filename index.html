<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Shyam Bhajan Sangrah</title>
<meta name="description" content="A community library of bhajans from live satsangs — scales, singers, lyrics, and one-tap YouTube timestamps." />
<meta name="theme-color" content="#0E1330" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" /></noscript>
<style>
:root{
  --bg:#f7f3ea;
  --card:#ffffff;
  --field:#f4efe2;
  --hover:#f8f4e9;
  --line:#e5dcc4;
  --line2:#d8cdae;
  --text:#241d3d;
  --dim:#6f6590;
  --dim2:#9a91b3;
  --gold:#b0770f;
  --gold-soft:#f3e7c9;
  --gold-ink:#7c5406;
  --teal:#0d8573;
  --teal-soft:rgba(13,133,115,.09);
  --red:#c04747;
  --shadow:0 1px 2px rgba(60,45,15,.06), 0 6px 24px rgba(60,45,15,.07);
  --shadow-lg:0 10px 40px rgba(50,35,10,.16);
  --r:14px;
  --fd:"Marcellus","Tiro Devanagari Hindi",serif;
  --fb:"Mukta",system-ui,sans-serif;
  --fr:"Noto Sans Devanagari","Mukta",system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0f0c1d;
  --card:#1a1530;
  --field:#241d42;
  --hover:#221b3e;
  --line:#2c2550;
  --line2:#3a3163;
  --text:#f2ecd9;
  --dim:#a89dc9;
  --dim2:#7d729f;
  --gold:#f0a838;
  --gold-soft:#3a2c12;
  --gold-ink:#ffc768;
  --teal:#38bfa7;
  --teal-soft:rgba(56,191,167,.1);
  --red:#e26565;
  --shadow:0 8px 28px rgba(0,0,0,.35);
  --shadow-lg:0 20px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--fb);
  min-height:100vh;-webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
img{max-width:100%}
a{color:inherit}
button{font-family:var(--fb)}
svg{flex-shrink:0}
input,select,textarea{
  font-family:var(--fb);width:100%;padding:11px 13px;font-size:16px;
  background:var(--field);color:var(--text);
  border:1px solid var(--line);border-radius:10px;outline:none;
  transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input::placeholder,textarea::placeholder{color:var(--dim2)}
label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:6px}

.keys{display:flex;height:5px}
.keys div{flex:1}
.keys .w{background:#efe8d3}.keys .b{background:#171226}

/* ---------- header ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 14px 110px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 2px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg.mark{width:42px;height:42px;filter:drop-shadow(0 2px 6px rgba(176,119,15,.35))}
.brand h1{font-family:var(--fd);font-weight:400;font-size:clamp(20px,4.6vw,26px);line-height:1.1;color:var(--text)}
.brand .sub{font-family:var(--fd);font-size:11.5px;color:var(--gold);letter-spacing:.28em;margin-top:2px;white-space:nowrap}
.ctrl{display:flex;gap:7px}
.iconbtn{
  width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:15px;
  border:1px solid var(--line);background:var(--card);color:var(--dim);
  display:flex;align-items:center;justify-content:center;transition:all .13s;box-shadow:var(--shadow);
}
.iconbtn:hover{color:var(--text);border-color:var(--line2)}
.iconbtn.lang{font-size:12px;font-weight:700}
.iconbtn.on{color:var(--gold-ink);border-color:var(--gold);background:var(--gold-soft)}

.idbar{font-size:12.5px;color:var(--dim2);padding:2px 2px 12px}
.idbar b{color:var(--teal);font-weight:600}
.linkbtn{background:none;border:none;color:var(--gold-ink);cursor:pointer;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}

/* ---------- tabs ---------- */
.tabs{
  display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;margin:4px 0 16px;position:sticky;top:8px;z-index:20;box-shadow:var(--shadow);
}
.tab{
  flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
  border:none;background:transparent;color:var(--dim);transition:all .15s;white-space:nowrap;
}
.tab.active{background:var(--gold-soft);color:var(--gold-ink)}

/* ---------- stats + trending ---------- */
.statline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--dim2);margin:0 2px 12px}
.statline b{color:var(--gold-ink);font-weight:700}
.statline .sep{opacity:.5}
.tchip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;cursor:pointer;
  font-size:12px;font-weight:600;color:var(--teal);border:1px solid var(--line);background:var(--card);
  transition:border-color .13s;
}
.tchip:hover{border-color:var(--teal)}
.tchip b{color:var(--gold-ink)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar input{flex:1 1 100%;padding:10px 13px}
.toolbar select{flex:1;min-width:0;padding:9px 10px;font-size:13.5px}
.favtoggle{
  display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;padding:6px 14px;border-radius:999px;
  cursor:pointer;font-size:12.5px;font-weight:600;border:1px solid var(--line);
  background:var(--card);color:var(--dim);transition:all .13s;
}
.favtoggle.on{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}

/* ---------- compact list ---------- */
.listwrap{position:relative}
.listbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.alpha{
  padding:6px 14px;font-family:var(--fd);font-size:13.5px;
  color:var(--gold-ink);background:var(--field);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  letter-spacing:.18em;display:flex;align-items:center;gap:10px;
}
.alpha::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.listbox .alpha:first-child{border-top:none}
.ri{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-top:1px solid var(--line);transition:background .12s;position:relative}
.ri::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:2.5px;border-radius:3px;background:transparent;transition:background .15s}
.ri:hover::before{background:var(--gold)}
.ri:first-child,.alpha + .ri{border-top:none}
.ri:hover{background:var(--hover)}
.ri .star{background:none;border:none;cursor:pointer;padding:4px;color:var(--dim2);transition:all .13s;line-height:0}
.ri .star.on{color:var(--gold)}
.ri .star:hover{transform:scale(1.15)}
.ri-main{flex:1;min-width:0;cursor:default}
.ri-name{font-family:var(--fd);font-size:16.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri-meta{font-size:11.5px;color:var(--dim2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.ri-meta .sc{
  display:inline-flex;align-items:center;padding:0 6px;border-radius:4px;font-size:10.5px;font-weight:700;
  height:16px;line-height:16px;letter-spacing:.02em;flex-shrink:0;
}
.sc.white{background:#efe8d3;color:#141024;border:1px solid #d6cba8}
.sc.black{background:#1d1733;color:#efe8d3;border:1px solid #4a4078}
.ri-acts{display:flex;gap:5px;align-items:center}
.ab{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;
  color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .13s;
  text-decoration:none;
}
.ab:hover{color:var(--text);border-color:var(--line2)}
.ab.play{background:var(--gold);border-color:var(--gold);color:#fff;border-radius:50%;box-shadow:0 2px 8px rgba(176,119,15,.3)}
[data-theme="dark"] .ab.play{color:#241604}
.ab.play:hover{filter:brightness(1.08)}
.ab.doc{color:var(--teal);border-color:var(--teal-soft);background:var(--teal-soft)}
.ab.danger{color:var(--red)}

/* A-Z jump rail */
.azrail{
  position:fixed;right:2px;top:50%;transform:translateY(-50%);z-index:25;
  display:flex;flex-direction:column;gap:0;padding:6px 3px;border-radius:99px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
}
.azrail button{
  background:none;border:none;color:var(--dim2);font-size:9.5px;font-weight:700;cursor:pointer;
  padding:1.5px 5px;line-height:1.2;border-radius:6px;transition:all .12s;
}
.azrail button:hover{color:var(--gold-ink);background:var(--gold-soft);transform:scale(1.35)}
.azrail button.active{color:#fff;background:var(--gold);transform:scale(1.2)}
[data-theme="dark"] .azrail button.active{color:#241604}
.alpha{scroll-margin-top:118px}
.ri{touch-action:manipulation}
.ri-main{cursor:pointer}
@media(min-width:900px){.azrail{right:calc(50% - 430px)}}

/* skeleton shimmer */
.skel{
  height:180px;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(100deg,var(--field) 40%,var(--hover) 50%,var(--field) 60%);
  background-size:200% 100%;animation:shimmer 1.2s linear infinite;
}
@keyframes shimmer{to{background-position:-200% 0}}
.pagecap{font-size:11px;color:var(--dim2);text-align:center;margin-top:-8px}
.telebar{
  display:flex;align-items:center;gap:8px;justify-content:center;
  padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card);
}

/* clickable scale chips (shruti) */
.sc{cursor:pointer;user-select:none}
.sc.playing{outline:2px solid var(--gold);animation:pulseSc 1s ease infinite}
@keyframes pulseSc{0%,100%{outline-color:var(--gold)}50%{outline-color:transparent}}
/* tanpura keyboard */
.tanp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tanp-key{
  border-radius:12px;padding:14px 8px;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;gap:3px;align-items:center;transition:all .12s;
  border:1.5px solid var(--line2);
}
.tanp-key b{font-size:18px;font-family:var(--fd);font-weight:400}
.tanp-key span{font-size:10.5px;opacity:.75}
.tanp-key.k-white{background:#f6f0dc;color:#1c1530}
.tanp-key.k-black{background:#1d1733;color:#f0e9d5;border-color:#4a4078}
.tanp-key:active{transform:scale(.96)}
.tanp-key.playing{outline:3px solid var(--gold);box-shadow:0 0 18px rgba(176,119,15,.4);animation:pulseSc 1s ease infinite}

/* tabla */
.tabla-panel{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:12px}
.tp-head{font-size:13px;font-weight:700;color:var(--gold-ink);letter-spacing:.06em;text-transform:uppercase}
.tp-row{display:flex;gap:9px}
.tb-matras{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.mt{
  width:46px;padding:7px 0;border-radius:10px;border:1.5px solid var(--line);text-align:center;
  display:flex;flex-direction:column;gap:1px;background:var(--field);transition:all .08s;
}
.mt b{font-size:14px;color:var(--text)}
.mt span{font-size:9.5px;color:var(--dim2)}
.mt.sam{border-color:var(--gold);background:var(--gold-soft)}
.mt.sam b{color:var(--gold-ink)}
.mt.kh{border-style:dashed}
.mt.on{background:var(--gold);border-color:var(--gold);transform:scale(1.12);box-shadow:0 0 14px rgba(176,119,15,.45)}
.mt.on b,.mt.on span{color:#fff}
[data-theme="dark"] .mt.on b,[data-theme="dark"] .mt.on span{color:#241604}
#tablabar{
  position:fixed;bottom:140px;left:50%;transform:translateX(-50%);z-index:35;display:none;
  align-items:center;gap:10px;background:var(--card);border:1px solid var(--teal);
  color:var(--teal);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
  box-shadow:var(--shadow-lg);cursor:pointer;white-space:nowrap;
}
#tablabar .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);animation:pulse 1s ease infinite}

#shrutibar{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:35;display:none;
  align-items:center;gap:10px;background:var(--card);border:1px solid var(--gold);
  color:var(--gold-ink);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
  box-shadow:var(--shadow-lg);cursor:pointer;
}
#shrutibar .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);animation:pulse 1s ease infinite}

/* segmented control */
.seg{display:flex;gap:4px;padding:4px;background:var(--field);border:1px solid var(--line);border-radius:11px;width:fit-content}
.seg button{border:none;background:transparent;color:var(--dim);font-size:13px;font-weight:700;padding:7px 18px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--gold-ink);box-shadow:var(--shadow)}

/* setlists */
.setcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:var(--shadow);margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer;
  transition:transform .13s;
}
.setcard:hover{transform:translateY(-2px)}
.setcard h3{font-family:var(--fd);font-weight:400;font-size:18px}
.setcard .sm{font-size:12px;color:var(--dim2);margin-top:3px}
.sitem{display:flex;align-items:center;gap:9px;padding:11px 12px;border-top:1px solid var(--line)}
.sitem:first-child{border-top:none}
.sitem .num{font-family:var(--fd);color:var(--gold-ink);min-width:24px;text-align:right;font-size:15px}
.sitem .nm{flex:1;min-width:0;font-family:var(--fd);font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .mv{display:flex;flex-direction:column;gap:2px}
.sitem .mv button{width:26px;height:20px;border:1px solid var(--line);background:var(--field);color:var(--dim);border-radius:6px;cursor:pointer;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center}

/* picker overlay */
.picker{background:var(--bg);width:100%;height:100%;max-width:640px;display:flex;flex-direction:column}
@media(min-width:700px){.picker{height:86vh;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow-lg)}}
.picker-head{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:10px;align-items:center}
.picker-head input{flex:1}
.picker-list{flex:1;overflow-y:auto}
.pk{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.pk:hover{background:var(--hover)}
.pk .cb{width:21px;height:21px;border-radius:7px;border:2px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.pk.sel .cb{background:var(--gold);border-color:var(--gold)}
.pk .nm{font-family:var(--fd);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .si{font-size:11px;color:var(--dim2)}

/* perform mode */
.perform{background:var(--bg);width:100%;height:100%;display:flex;flex-direction:column}
.pf-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:var(--card)}
.pf-prog{font-size:13px;color:var(--dim2);font-weight:700}
.pf-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:16px}
.pf-main h2{font-family:var(--fd);font-weight:400;font-size:clamp(26px,6vw,40px);line-height:1.25}
.pf-scale{transform:scale(1.5);margin:8px 0}
.pf-acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pf-nav{display:flex;gap:10px;padding:16px;border-top:1px solid var(--line);background:var(--card)}
.pf-nav button{flex:1;padding:15px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);font-size:16px;font-weight:700;cursor:pointer}
.pf-nav button.main{background:var(--gold);border-color:var(--gold);color:#fff}
[data-theme="dark"] .pf-nav button.main{color:#241604}

/* ---------- live cards ---------- */
.lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.lhead{display:flex;gap:12px;padding:12px;align-items:center}
.thumb-link{position:relative;flex-shrink:0;display:block;width:118px}
.thumb{width:118px;aspect-ratio:16/9;border-radius:9px;object-fit:cover;display:block;background:var(--field);border:1px solid var(--line)}
.thumb-link::after{
  content:"";position:absolute;inset:0;border-radius:9px;
  background:radial-gradient(circle at center, rgba(0,0,0,.25), transparent 60%);
}
.thumb-link svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7));z-index:1}
.linfo{flex:1;min-width:0}
.linfo h3{font-family:var(--fd);font-weight:400;font-size:16.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.linfo .lm{font-size:11.5px;color:var(--dim2);margin-top:3px}
.lacts{display:flex;flex-direction:column;gap:5px}
.setlist{border-top:1px solid var(--line)}
.setrow{
  display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;
  padding:9px 14px;border-top:1px solid var(--line);transition:background .12s;
}
.setrow:first-child{border-top:none}
.setrow:hover{background:var(--hover)}
.setrow .t{color:var(--gold-ink);font-variant-numeric:tabular-nums;font-size:12px;min-width:52px;font-weight:700}
.setrow .n{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow .left{display:flex;gap:10px;align-items:center;min-width:0}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:11px 18px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;
  border:none;text-decoration:none;white-space:nowrap;transition:all .13s;
}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:#fff;box-shadow:0 2px 10px rgba(176,119,15,.3)}
[data-theme="dark"] .btn-gold{color:#241604}
.btn-gold:hover{filter:brightness(1.07)}
.btn-teal{background:var(--teal-soft);border:1px solid var(--teal);color:var(--teal)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
.btn-ghost:hover{color:var(--text)}
.btn-big{padding:13px 28px;font-size:15px}

/* ---------- forms ---------- */
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);
}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:170px}
.subpanel{padding:14px;border:1px dashed var(--line2);border-radius:11px;display:flex;flex-direction:column;gap:12px}
.lyrics-box{padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--teal-soft);display:flex;flex-direction:column;gap:12px}
.lyrics-box .lbl{font-size:12px;font-weight:700;color:var(--teal);letter-spacing:.05em;text-transform:uppercase}
.hint{font-size:12px;color:var(--dim2);margin-top:5px;font-weight:300}
textarea{min-height:110px;resize:vertical;line-height:1.8}
textarea.mono{font-family:ui-monospace,monospace;font-size:13px}

.filedrop{
  border:1.5px dashed var(--line2);border-radius:11px;padding:16px;text-align:center;cursor:pointer;
  color:var(--dim);font-size:13.5px;transition:all .15s;background:var(--field);
}
.filedrop:hover{border-color:var(--gold);color:var(--gold-ink)}
.fthumbs{display:flex;gap:8px;flex-wrap:wrap}
.fthumb{position:relative;width:74px}
.fthumb img{width:74px;height:74px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.fthumb .pdfbox{width:74px;height:74px;border-radius:9px;border:1px solid var(--line);background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--dim);gap:4px;padding:4px;text-align:center;overflow:hidden}
.fthumb .rm{
  position:absolute;top:-7px;right:-7px;width:21px;height:21px;border-radius:50%;border:none;
  background:var(--red);color:#fff;font-size:11px;cursor:pointer;line-height:1;box-shadow:var(--shadow);
}

/* ---------- bulk preview ---------- */
.preview{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.preview-head{padding:10px 14px;background:var(--field);font-size:12.5px;font-weight:700;color:var(--gold-ink);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.preview-head span{color:var(--dim2);font-weight:400}
.preview-rows{max-height:320px;overflow-y:auto}
.prow{display:flex;gap:7px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}
.prow .num{color:var(--dim2);font-size:11.5px;min-width:22px;text-align:right}
.prow input{padding:7px 9px;font-size:13px}
.prow .time{max-width:104px;font-family:ui-monospace,monospace}
.prow .x{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:4px}

.empty{
  text-align:center;padding:54px 18px;color:var(--dim);
  border:1px dashed var(--line2);border-radius:var(--r);font-weight:300;line-height:1.7;background:var(--card);
}
.empty .om{font-size:30px;display:block;margin-bottom:10px;opacity:.55}

/* ---------- reader modal (fullscreen) ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(20,14,5,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:0;z-index:50;animation:fade .16s ease;
}
[data-theme="dark"] .overlay{background:rgba(4,2,10,.8)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.reader{
  background:var(--bg);width:100%;height:100%;max-width:820px;
  display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease;
}
@media(min-width:860px){.reader{height:92vh;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow-lg)}}
@keyframes pop{from{transform:scale(.985);opacity:0}to{transform:none;opacity:1}}
.reader-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card)}
.reader-head h3{font-family:var(--fd);font-weight:400;font-size:19px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-head .rm2{font-size:11.5px;color:var(--dim2);margin-top:1px}
.reader-body{overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px;flex:1}
.read-text{
  white-space:pre-wrap;line-height:1.9;font-size:20px;font-family:var(--fr);
  font-weight:500;letter-spacing:.005em;color:var(--text);
  background:var(--card);border-radius:14px;padding:22px 20px;border:1px solid var(--line);
  text-rendering:optimizeLegibility;
}
/* tappable lyric lines: tap → highlight + centre (highlight-follow) */
.read-text .rl{cursor:pointer;border-radius:6px;padding:1px 5px;margin:-1px -5px;transition:background .15s,color .15s}
.read-text .rl.cur{background:var(--gold-soft);color:var(--gold-ink);font-weight:600}
.ab.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}
.read-img{width:100%;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.read-img.zoom{cursor:zoom-out;border-radius:0}
.read-pdf{width:100%;height:74vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.pdfholder{display:flex;flex-direction:column;gap:10px}
.pdfbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;color:var(--dim)}
.read-pdfpage{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}

#toast{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--card);border:1px solid var(--teal);color:var(--teal);
  padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .22s;z-index:60;box-shadow:var(--shadow-lg);
  max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.error{border-color:var(--red);color:var(--red)}

/* ---------- search box (icon + clear) ---------- */
.searchbox{position:relative;flex:1 1 100%;display:flex;align-items:center}
.searchbox svg.si{position:absolute;left:13px;color:var(--gold);pointer-events:none}
.searchbox input{flex:1;padding:11px 80px 11px 40px;border-radius:12px}
.searchbox input:focus{box-shadow:0 0 0 3px rgba(176,119,15,.13)}
.sclear{
  position:absolute;right:44px;width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;
  background:var(--field);color:var(--dim);display:none;align-items:center;justify-content:center;
  font-size:12px;line-height:1;transition:all .13s;border:1px solid var(--line);
}
.sclear:hover{background:var(--red);border-color:var(--red);color:#fff}
.smic{
  position:absolute;right:8px;width:30px;height:30px;border-radius:50%;cursor:pointer;
  border:1px solid var(--line);background:var(--field);color:var(--gold-ink);
  display:flex;align-items:center;justify-content:center;transition:all .13s;
}
.smic:hover{border-color:var(--gold);background:var(--gold-soft)}
.smic.listening{
  background:var(--red);border-color:var(--red);color:#fff;
  animation:micPulse 1.1s ease infinite;
}
@keyframes micPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(192,71,71,.45)}
  50%{box-shadow:0 0 0 8px rgba(192,71,71,0)}
}
select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(176,119,15,.1)}

/* ---------- floating tanpura (usable anywhere) ---------- */
.fab-tanpura{
  position:fixed;right:18px;bottom:88px;z-index:30;width:50px;height:50px;border-radius:50%;
  background:var(--card);color:var(--gold-ink);border:1.5px solid var(--gold);cursor:pointer;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;
  transition:transform .13s;
}
.fab-tanpura:active{transform:scale(.92)}
.fab-tanpura.live{background:var(--gold);color:#fff;animation:tanpulse 1.6s ease infinite}
[data-theme="dark"] .fab-tanpura.live{color:#241604}
@keyframes tanpulse{
  0%,100%{box-shadow:0 0 0 0 rgba(176,119,15,.45)}
  55%{box-shadow:0 0 0 13px rgba(176,119,15,0)}
}

/* ---------- kill hold zoom on interactive rows ---------- */
.setrow,.sitem,.ri-main,.pf-main,.setrow *,.sitem *{touch-action:manipulation}
.setrow,.sitem .nm{user-select:none;-webkit-user-select:none}
.setrow{cursor:pointer}
.sitem .nm{cursor:pointer}
.setrow .go{color:var(--dim2);flex-shrink:0;display:flex}

/* scale picker inside setlist rows */
.scpick{width:auto;max-width:96px;padding:5px 7px;font-size:12px;border-radius:8px;flex-shrink:0}

/* shared / private notes */
.notechip{
  display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);
  border:1px dashed var(--line2);background:var(--card);border-radius:10px;
  padding:8px 12px;margin-bottom:12px;line-height:1.5;
}
.notechip.teal{border-color:var(--teal);color:var(--teal);background:var(--teal-soft);border-style:solid}

/* my list cards reuse setcard; row time optional */
.setrow .t:empty{display:none}

/* 5 tabs: allow horizontal scroll on narrow phones */
@media (max-width:560px){
  .tabs{overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;padding:9px 12px}
}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:18px;bottom:22px;z-index:30;width:56px;height:56px;border-radius:18px;
  background:var(--gold);color:#fff;border:none;font-size:26px;cursor:pointer;
  box-shadow:0 6px 22px rgba(176,119,15,.45);display:flex;align-items:center;justify-content:center;
  transition:transform .13s;
}
[data-theme="dark"] .fab{color:#241604}
.fab:active{transform:scale(.94)}

.loading{text-align:center;padding:70px 20px;color:var(--dim)}
.pulse{animation:pulse 1.4s ease infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

footer{text-align:center;margin-top:48px;color:var(--dim2);font-size:12px;font-weight:300}
footer .m{font-family:var(--fd);color:var(--gold);letter-spacing:.24em;font-size:12px;margin-bottom:5px}

@media (max-width:480px){
  .tab{font-size:11.5px;padding:9px 2px}
  .lacts{flex-direction:row}
  .lhead{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══════════════════════════════════════════════════════════════
   SWAR SANGRAH THEME — khadi paper · kumkum maroon · brass gold
   (override layer: keeps all functionality, changes only the look)
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#FBF5E9;
  --card:#FFFDF6;
  --field:#F6EDD9;
  --hover:#FBF2DD;
  --line:#EADCC2;
  --line2:#DFC788;
  --text:#3E1A12;
  --dim:#7A5140;
  --dim2:#A98D77;
  --gold:#B98A1E;
  --gold-soft:#F6E9C9;
  --gold-ink:#8F6A12;
  --teal:#5B7A3A;
  --teal-soft:rgba(91,122,58,.10);
  --red:#9E2F26;
  --kumkum:#8E2A22;
  --kumkum-deep:#6E1F19;
  --title:#6E1F19;
  --shadow:0 2px 10px rgba(110,60,20,.08), 0 10px 30px rgba(110,60,20,.06);
  --shadow-lg:0 14px 44px rgba(90,40,10,.22);
  --r:16px;
  --fd:"Rozha One","Tiro Devanagari Hindi",serif;
}
[data-theme="dark"]{
  --bg:#171009;
  --card:#221710;
  --field:#2B1D13;
  --hover:#2F2014;
  --line:#3B2A1B;
  --line2:#57422B;
  --text:#F4E8D3;
  --dim:#C6AB8E;
  --dim2:#93785F;
  --gold:#DFA733;
  --gold-soft:#3B2C12;
  --gold-ink:#F2C25E;
  --teal:#9CBE68;
  --teal-soft:rgba(156,190,104,.12);
  --red:#E0705F;
  --kumkum:#D96A55;
  --kumkum-deep:#B4402F;
  --title:#F4E0B8;
  --shadow:0 8px 28px rgba(0,0,0,.4);
  --shadow-lg:0 20px 60px rgba(0,0,0,.6);
}

/* khadi paper texture */
body{
  background-image:
    radial-gradient(circle at 20% -10%, rgba(255,255,255,.55) 0%, transparent 40%),
    repeating-linear-gradient(45deg, transparent 0 34px, rgba(185,138,30,.03) 34px 35px);
}
[data-theme="dark"] body{
  background-image:
    radial-gradient(circle at 20% -10%, rgba(223,167,51,.06) 0%, transparent 45%),
    repeating-linear-gradient(45deg, transparent 0 34px, rgba(223,167,51,.025) 34px 35px);
}

/* top ornament: kumkum → gold → kumkum (replaces the piano strip) */
.keys{height:4px;background:linear-gradient(90deg,var(--kumkum),var(--gold) 28%,var(--gold) 72%,var(--kumkum))}
.keys div{display:none}

/* ॐ medallion + Rozha One masthead */
.om-medal{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%, #E7B84B, #8F6A12);
  color:#fff;font-size:23px;line-height:1;font-family:var(--fd);
  border:2px solid rgba(255,255,255,.55);
  box-shadow:0 3px 12px rgba(143,106,18,.45);
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.15));
}
[data-theme="dark"] .om-medal{border-color:rgba(255,255,255,.18)}
.brand h1{color:var(--title);letter-spacing:.3px}
.brand .sub{letter-spacing:.3em}

/* tabs — warm gilded pills */
.tabs{border-radius:14px}
.tab{border-radius:10px;border:1px solid transparent}
.tab.active{
  background:linear-gradient(#FDF3D7,#F3E2B4);
  border-color:#E4CF9B;color:var(--kumkum-deep);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 2px 6px rgba(143,106,18,.18);
}
[data-theme="dark"] .tab.active{
  background:linear-gradient(#43321A,#3B2C12);
  border-color:#6B5322;color:var(--gold-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}

/* list rows — kumkum titles, gold time */
.ri-name{color:var(--title)}
.setrow .n{color:var(--title);font-weight:600}
.sitem .nm{color:var(--title)}
.setcard h3,.linfo h3{color:var(--title)}
.reader-head h3,.pf-main h2{color:var(--title)}
.alpha{font-size:14px}

/* scale chips — safed = parchment, kali = ink */
.sc.white{background:#FDF3D7;color:#8F6A12;border:1px solid #E0C784}
.sc.black{background:#3E1A12;color:#F3E4C2;border:1px solid #6E4A2E}
[data-theme="dark"] .sc.white{background:#3B2C12;color:#F2C25E;border-color:#6B5322}
[data-theme="dark"] .sc.black{background:#120A06;color:#E8D3AE;border-color:#57422B}

/* gold buttons — brass gradient */
.btn-gold{
  background:linear-gradient(#D9A62E,#B98A1E);
  border:1px solid #A67A16;
  text-shadow:0 1px 0 rgba(0,0,0,.12);
  box-shadow:0 2px 10px rgba(176,119,15,.35);
}
.btn-gold:hover{filter:brightness(1.06)}
.ab.play{background:linear-gradient(#D9A62E,#B98A1E);border-color:#A67A16}

/* + FAB — kumkum lamp */
.fab{
  border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #C24A38, var(--kumkum-deep) 78%);
  color:#fff;border:2px solid rgba(255,255,255,.5);
  box-shadow:0 6px 22px rgba(142,42,34,.45);
}
[data-theme="dark"] .fab{color:#fff;border-color:rgba(255,255,255,.16)}

/* tanpura FAB — the brass orb (glows kumkum while playing) */
.fab-tanpura{
  background:radial-gradient(circle at 32% 28%, #E7B84B, #8F6A12 78%);
  color:#fff;border:2px solid rgba(255,255,255,.5);
  box-shadow:0 5px 18px rgba(143,106,18,.45);
}
[data-theme="dark"] .fab-tanpura{border-color:rgba(255,255,255,.16)}
.fab-tanpura.live{
  background:radial-gradient(circle at 32% 28%, #C24A38, var(--kumkum-deep) 78%);
  color:#fff;animation:tanpulse 1.7s ease infinite;
}
[data-theme="dark"] .fab-tanpura.live{color:#fff}
@keyframes tanpulse{
  0%,100%{box-shadow:0 0 0 0 rgba(142,42,34,.5)}
  55%{box-shadow:0 0 0 14px rgba(142,42,34,0)}
}

/* toast — deep kumkum pill */
#toast{
  background:var(--kumkum-deep);border:none;color:#FCEEDD;
  box-shadow:0 8px 26px rgba(60,15,10,.35);
}
#toast.error{background:#8E2A22;color:#FFE3DC}
[data-theme="dark"] #toast{background:#3B1610;color:#F4D9C6}
[data-theme="dark"] #toast.error{background:#5C1B12}

/* shruti / tabla pills */
#shrutibar{border-color:var(--gold);color:var(--gold-ink)}
#tablabar{border-color:var(--teal);color:var(--teal)}

/* empty states — dashed ॐ circle */
.empty .om{
  width:64px;height:64px;margin:0 auto 12px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:28px;opacity:1;
  color:var(--gold-ink);background:var(--gold-soft);border:1.5px dashed var(--line2);
}

/* inputs */
input,select,textarea{border-radius:12px}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px rgba(185,138,30,.14)}
.searchbox input{border-radius:14px;box-shadow:var(--shadow)}
.searchbox input:focus{box-shadow:0 0 0 4px rgba(185,138,30,.15), var(--shadow)}

/* cards a touch rounder + hover lift */
.lcard,.listbox,.panel,.setcard{border-radius:var(--r)}
.setcard:hover{border-color:var(--line2)}
.lcard{transition:border-color .15s}
.lcard:hover{border-color:var(--line2)}

/* notechips match theme */
.notechip{background:var(--card)}
.notechip.teal{background:var(--teal-soft)}

/* reader lyrics get the display face at comfy size */
.read-text{color:var(--text)}

footer .m{letter-spacing:.28em}

/* ═══════════════════════════════════════════════════════════════
   EXACT SWAR SANGRAH LAYOUT
   ═══════════════════════════════════════════════════════════════ */

/* masthead: medallion + name + small companion line */
.hdr{padding:14px 2px 4px}
.brand{gap:12px}
.brand h1{font-size:clamp(21px,4.8vw,27px)}
.brand .sub{
  font-family:var(--fb);font-size:12.5px;color:var(--dim);
  letter-spacing:.04em;margin-top:1px;font-weight:500;
}

/* tabs: transparent row, icon + label + count pill; active = gilded pill */
.tabs{
  background:var(--bg);border:none;box-shadow:none;padding:6px 0 10px;margin:0 0 14px;
  border-radius:0;border-bottom:1px solid var(--line);gap:6px;top:0;
}
.tab{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 12px;border-radius:12px;font-size:13.5px;
}
.tab svg{opacity:.85}
.tab em{
  font-style:normal;font-size:11px;font-weight:700;line-height:1;
  background:rgba(0,0,0,.08);color:var(--dim);
  padding:3px 8px;border-radius:999px;
}
[data-theme="dark"] .tab em{background:rgba(255,255,255,.09);color:var(--dim)}
.tab.active em{background:var(--gold);color:#fff}
[data-theme="dark"] .tab.active em{color:#241604}

/* toolbar: search + gold Add button on one line */
.toolbar{gap:10px;flex-wrap:nowrap}
.searchbox{flex:1 1 auto}
.addbtn{border-radius:14px;padding:0 20px;flex-shrink:0}

/* chips: scrollable pill row (All · ★ · singers) */
.chips{
  display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:10px 0 8px;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:7px 15px;border-radius:999px;cursor:pointer;
  font-size:12.5px;font-weight:600;border:1px solid var(--line);
  background:var(--card);color:var(--dim);transition:all .13s;white-space:nowrap;
  box-shadow:var(--shadow);
}
.chip:hover{border-color:var(--line2);color:var(--text)}
.chip.on{background:var(--kumkum);border-color:var(--kumkum);color:#fff;box-shadow:0 2px 8px rgba(142,42,34,.3)}
select.chipsel{appearance:none;-webkit-appearance:none;width:auto;max-width:150px;padding:7px 14px;font-family:inherit}

/* slim filter line */
.filterline{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.filterline select{flex:0 1 auto;width:auto;min-width:120px;padding:7px 10px;font-size:12.5px;border-radius:10px}

/* rows: bold maroon title, pill tags below, actions right */
.ri{padding:13px 12px 13px 12px}
.ri-name{
  font-family:var(--fb);font-weight:700;font-size:15px;line-height:1.35;
  white-space:normal;color:var(--title);
}
.ri-sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:700;line-height:1;
  color:var(--dim);background:var(--field);
  padding:4px 10px;border-radius:999px;
}
.pill svg{width:11px;height:11px}
.pill.pdf{background:var(--teal-soft);color:var(--teal)}
.pill.soft{font-weight:500;background:transparent;border:1px dashed var(--line);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;padding:4px 10px}

/* scale badge — the parchment square from the screenshot */
.sc{
  min-width:36px;height:28px;padding:0 9px;border-radius:9px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;letter-spacing:.02em;line-height:1;
}
.sc.white{background:linear-gradient(#FDF3D7,#F1DFAE);color:var(--gold-ink);border:1px solid #E0C784}
.sc.black{background:linear-gradient(#4A2318,#3E1A12);color:#F3E4C2;border:1px solid #6E4A2E}
[data-theme="dark"] .sc.white{background:linear-gradient(#43321A,#3B2C12);color:var(--gold-ink);border-color:#6B5322}
.ri-acts .sc{margin-right:2px}
.setrow .sc,.sitem .sc{height:26px;min-width:32px;font-size:12px}
.pf-scale .sc{height:34px;min-width:46px;font-size:15px;border-radius:10px}

/* tanpura orb: glyph + note badge */
.fab-tanpura{width:56px;height:56px}
.fab-glyph{font-size:22px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.fab-note{
  position:absolute;bottom:-3px;right:-3px;
  background:var(--kumkum);color:#fff;
  font-size:10.5px;font-weight:800;line-height:1;
  padding:3px 7px;border-radius:999px;
  border:2px solid var(--bg);
  align-items:center;justify-content:center;
}
.fab-tanpura{position:fixed}
.fab-tanpura.live .fab-note{background:#fff;color:var(--kumkum-deep);border-color:var(--kumkum)}

/* keep the header controls quiet */
.iconbtn{width:36px;height:36px;border-radius:12px}

@media (max-width:560px){
  .addbtn{padding:0 14px;font-size:13px}
  .filterline select{min-width:104px}
}

/* ═══════════════════════════════════════════════════════════════
   CHAMPION UX LAYER — native-app feel
   ═══════════════════════════════════════════════════════════════ */

/* page transition */
#app.pagein{animation:pagein .24s ease}
@keyframes pagein{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* skeleton loading */
.skeltabs{display:flex;gap:8px;padding:8px 0 14px}
.skelpill{flex:1;height:38px;border-radius:12px}
.skelbar{height:46px;border-radius:14px;margin-bottom:14px}
.skelrow{padding:16px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.skelrow:first-child{border-top:none}
.skelline{height:12px;border-radius:6px}
.skelline.w60{width:62%}
.skelline.w30{width:30%;height:9px}
.skelpill,.skelbar,.skelline{
  background:linear-gradient(100deg,var(--field) 40%,var(--hover) 50%,var(--field) 60%);
  background-size:200% 100%;animation:shimmer 1.15s linear infinite;
}

/* scroll-to-top */
#totop{
  position:fixed;left:16px;bottom:22px;z-index:29;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--gold-ink);
  font-size:18px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transform:translateY(10px);transition:all .2s;
}
#totop.show{opacity:1;pointer-events:auto;transform:none}

/* pull-to-refresh */
#ptr{
  position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:60;display:none;
  width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  align-items:center;justify-content:center;font-size:19px;color:var(--dim);
  box-shadow:var(--shadow-lg);transition:color .15s;
}
#ptr.ready{color:var(--gold-ink);border-color:var(--gold)}
#ptr.spin span{display:inline-block;animation:ptrspin .7s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}

/* ── bottom navigation on phones (thumb-reach, like native apps) ── */
@media (max-width:700px){
  .tabs{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:38;
    margin:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));
    background:var(--card);border-top:1px solid var(--line);border-bottom:none;
    box-shadow:0 -8px 24px rgba(70,35,10,.1);
    backdrop-filter:blur(10px);
  }
  [data-theme="dark"] .tabs{box-shadow:0 -8px 24px rgba(0,0,0,.4)}
  .tab{
    position:relative;flex:1 1 0;min-width:0;
    flex-direction:column;gap:3px;padding:7px 2px 6px;
    font-size:10.5px;border-radius:12px;
  }
  .tab svg{width:18px;height:18px}
  .tab em{
    position:absolute;top:1px;right:calc(50% - 24px);
    font-size:9px;padding:2px 5px;
  }
  .tab.active{box-shadow:none}
  .wrap{padding-bottom:170px}

  /* lift the floating pieces above the bottom bar */
  .fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .fab-tanpura{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  #totop{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  #shrutibar{bottom:calc(152px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 140px);font-size:12px;padding:9px 14px}
  #tablabar{bottom:calc(204px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 140px);font-size:12px;padding:9px 14px}
  .azrail{right:2px}
}

/* ═══ audio controls + extra shine ═══ */
.volrow{display:flex;align-items:center;gap:9px;padding:4px 2px;color:var(--dim)}
.volrow input[type=range]{accent-color:var(--gold)}

/* tanpura keys: real keyboard feel */
.tanp-key{box-shadow:var(--shadow);transition:all .12s}
.tanp-key.k-white{background:linear-gradient(#FFFDF6,#F3E8CC);color:#3E1A12;border-color:#DFC788}
.tanp-key.k-black{background:linear-gradient(#4A2318,#241209);color:#F3E4C2;border-color:#6E4A2E}
[data-theme="dark"] .tanp-key.k-white{background:linear-gradient(#43321A,#2F2410);color:var(--gold-ink);border-color:#6B5322}
[data-theme="dark"] .tanp-key.k-black{background:linear-gradient(#1A0E08,#0D0704);border-color:#3B2A1B}
.tanp-key:hover{transform:translateY(-2px)}
.tanp-key.playing{outline:3px solid var(--gold);box-shadow:0 0 22px rgba(185,138,30,.5)}

/* reader header: soft gilded gradient */
.reader-head{background:linear-gradient(var(--card), var(--bg))}

/* live cards: thumbnail zoom on hover */
.thumb{transition:transform .25s}
.lcard:hover .thumb{transform:scale(1.04)}
.thumb-link{overflow:hidden;border-radius:9px}

/* chips + buttons press feedback */
.chip:active,.tab:active{transform:scale(.95)}
.ab:active{transform:scale(.9)}

/* setcards: left accent rib */
.setcard{position:relative;overflow:hidden}
.setcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--gold),var(--kumkum))}

/* perform mode: big breathing scale badge */
.pf-scale .sc{animation:breathe 2.6s ease infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ===== v3: tags · history · polish ===== */
.tagsrow{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-top:-2px;padding:2px 2px 6px}
.tagsrow::-webkit-scrollbar{display:none}
.tagchip{display:inline-flex;align-items:center;gap:5px}

/* soft identity colors per tag (light) */
.tagchip.t-shyam.on,.tagp.t-shyam{background:#f6e7ce;color:#8a5a06;border-color:#eBd7ae}
.tagchip.t-shiv.on,.tagp.t-shiv{background:#e3edf7;color:#2c5b8a;border-color:#cdddef}
.tagchip.t-radha.on,.tagp.t-radha{background:#e9f5e9;color:#2c7a3f;border-color:#d3ead3}
.tagchip.t-gurudev.on,.tagp.t-gurudev{background:#f3eae0;color:#7a5230;border-color:#e7d8c6}
.tagchip.t-hanuman.on,.tagp.t-hanuman{background:#fdeade;color:#a4520f;border-color:#f6d9c2}
.tagchip.t-mata.on,.tagp.t-mata{background:#fbe7ee;color:#a3325f;border-color:#f3d2df}
.tagchip.t-ganesh.on,.tagp.t-ganesh{background:#efeafa;color:#5b3fa3;border-color:#ded4f2}
.tagchip.t-aarti.on,.tagp.t-aarti{background:#fff3d6;color:#8a6a06;border-color:#f3e3b4}
.tagchip.t-fagun.on,.tagp.t-fagun{background:#ffe9f2;color:#b03a72;border-color:#f7d3e3}
.tagchip.t-vinati.on,.tagp.t-vinati{background:#e6f4f1;color:#0d6f61;border-color:#cfe8e3}
.tagchip.on{font-weight:700;box-shadow:0 3px 10px rgba(60,45,15,.14);transform:translateY(-1px)}
.pill.tagp{border:1px solid transparent}

/* dark theme: muted violet tags for readability */
[data-theme="dark"] .pill.tagp,
[data-theme="dark"] .tagchip.on{background:#2a2350 !important;color:#cdc2ef !important;border-color:#3a3163 !important}

/* list rows: gentle entrance + refined hover */
.listbox > .ri:nth-of-type(-n+18){animation:riIn .28s ease both}
@keyframes riIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ri:hover{background:var(--hover)}
.listbox{border-radius:18px}

/* header: warm gradient title */
.brand h1{
  background:linear-gradient(115deg,#6d2323 5%,#9a4a10 55%,var(--gold) 95%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
[data-theme="dark"] .brand h1{
  background:linear-gradient(115deg,#f2ecd9 5%,#ffcf7d 60%,var(--gold) 95%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}

/* toolbar breathing room */
.filterline{margin-top:2px}

/* ===== v4: home dashboard + app-style bottom nav ===== */
.hero{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:linear-gradient(130deg,#fdf6e6 0%, #f7e8c8 45%, #f3ddb0 100%);
  border:1px solid #eBdcb8;border-radius:20px;padding:18px 18px;margin:2px 0 14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero::after{content:"ॐ";position:absolute;right:-8px;top:-22px;font-size:110px;opacity:.06;font-family:var(--fd);pointer-events:none}
[data-theme="dark"] .hero{background:linear-gradient(130deg,#1e1836,#2a2050 60%,#33244e);border-color:#3a3163}
.hero-om{font-size:36px;filter:drop-shadow(0 3px 8px rgba(176,119,15,.4))}
.hero-txt{flex:1;min-width:140px}
.hero-hi{font-family:var(--fd);font-size:clamp(19px,4.6vw,24px);color:var(--gold-ink)}
[data-theme="dark"] .hero-hi{color:#ffcf7d}
.hero-dt{font-size:12.5px;color:var(--dim);margin-top:3px;text-transform:capitalize}
.hero-r{border-radius:999px !important;white-space:nowrap}

.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:18px}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px 10px;
  cursor:pointer;text-align:center;box-shadow:var(--shadow);transition:transform .12s;
  display:flex;flex-direction:column;gap:3px;font-family:var(--fb);
}
.stat:active{transform:scale(.96)}
.stat b{font-family:var(--fd);font-size:21px;color:var(--gold-ink)}
[data-theme="dark"] .stat b{color:#ffcf7d}
.stat span{font-size:10.5px;color:var(--dim);font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hrow{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 10px}
.hrow h2{font-family:var(--fd);font-weight:400;font-size:16.5px;color:var(--text)}

.hscroll{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 2px 8px;margin:0 -2px 12px}
.hscroll::-webkit-scrollbar{display:none}
.hcard{
  flex:0 0 auto;width:158px;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 13px 11px;
  box-shadow:var(--shadow);transition:transform .12s;font-family:var(--fb);
}
.hcard:active{transform:scale(.96)}
.hc-name{font-family:var(--fd);font-size:14.5px;line-height:1.3;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.hc-sub{font-size:11px;color:var(--dim2);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.taggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin-bottom:18px}
.tgc{
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  border:1px solid var(--line);border-radius:16px;padding:13px 6px 11px;
  background:var(--card);box-shadow:var(--shadow);transition:transform .12s;font-family:var(--fb);position:relative;
}
.tgc:active{transform:scale(.95)}
.tgc-e{font-size:23px}
.tgc-n{font-size:12px;font-weight:700;color:var(--text)}
.tgc-c{font-size:10px;color:var(--dim2);font-weight:600}
.tgc.t-shyam{background:#f9efdd;border-color:#eBd7ae}
.tgc.t-shiv{background:#eef4fa;border-color:#cdddef}
.tgc.t-radha{background:#f0f8f0;border-color:#d3ead3}
.tgc.t-gurudev{background:#f7f0e8;border-color:#e7d8c6}
.tgc.t-hanuman{background:#fdf0e6;border-color:#f6d9c2}
.tgc.t-mata{background:#fcf0f5;border-color:#f3d2df}
.tgc.t-ganesh{background:#f4f0fc;border-color:#ded4f2}
.tgc.t-aarti{background:#fdf7e3;border-color:#f3e3b4}
.tgc.t-fagun{background:#fdf0f6;border-color:#f7d3e3}
.tgc.t-vinati{background:#eef7f5;border-color:#cfe8e3}
[data-theme="dark"] .tgc{background:#221b3e !important;border-color:#3a3163 !important}

.homebox{margin-bottom:18px}
.ri.mini{cursor:pointer;padding:11px 14px}
.rank{
  width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:14px;flex-shrink:0;background:var(--field);color:var(--dim);
}
.rank.r1{background:linear-gradient(135deg,#f6d365,#d99a1e);color:#5a3c00}
.rank.r2{background:#e8e4d8;color:#6b6252}
.rank.r3{background:#f0dcc3;color:#8a5a26}
[data-theme="dark"] .rank{background:#2a2350;color:#a89dc9}
[data-theme="dark"] .rank.r1{color:#3a2800}

.rnav{font-size:19px;line-height:1;padding:6px 12px !important}
.rnav:disabled{opacity:.3;pointer-events:none}

/* ---- app-style bottom navigation (mobile) ---- */
@media (max-width:720px){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .tabs{
    position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;gap:0;
    border-radius:0;border:none;border-top:1px solid var(--line);
    padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:45;overflow:visible;
    background:color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 -8px 30px rgba(40,25,5,.10);
  }
  [data-theme="dark"] .tabs{box-shadow:0 -8px 30px rgba(0,0,0,.45)}
  .tab{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;font-size:10px;padding:5px 0;border-radius:12px;flex:1 1 0;
  }
  .tab svg{width:21px;height:21px}
  .tab em{display:none}
  .tab.active{background:transparent;color:var(--gold-ink)}
  [data-theme="dark"] .tab.active{color:#ffcf7d}
  .tab.active svg{filter:drop-shadow(0 3px 9px rgba(176,119,15,.55))}
  .tab.active::before{
    content:"";position:absolute;top:-8px;left:28%;right:28%;height:3px;
    border-radius:0 0 4px 4px;background:var(--gold);
  }
  .fab{bottom:calc(96px + env(safe-area-inset-bottom))}
  .fab-tanpura{bottom:calc(162px + env(safe-area-inset-bottom))}
  footer{margin-bottom:8px}
}

/* ═══════════════════════════════════════════════════════════════
   PROFESSIONAL POLISH LAYER
   ═══════════════════════════════════════════════════════════════ */

/* 1. Kill mobile auto-zoom completely: every field ≥16px on touch screens.
      (Browsers zoom the page when a focused field is under 16px — this was
      the "app gets stuck zoomed in" bug.) */
@media (max-width:859px){
  input,select,textarea{font-size:16px !important}
}

/* 2. Comfortable touch targets (Apple/Google recommend ≥44px) */
@media (pointer:coarse){
  .ab{width:40px;height:40px}
  .iconbtn{width:42px;height:42px}
  .rnav{padding:8px 14px !important}
  .chip{padding:9px 16px}
  .tab{padding:11px 12px}
}

/* 3. Reader: no scroll-chaining (page behind stays still), smooth momentum */
.reader-body{
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
.overlay{overscroll-behavior:contain}

/* 4. Lyrics: comfortable measure + gentle verse separation */
.read-text{max-width:62ch;width:100%;margin:0 auto}
@media (min-width:640px){.read-text{padding:28px 32px}}

/* 5. Typography niceties */
h1,h2,h3{text-wrap:balance}
::selection{background:var(--gold-soft);color:var(--gold-ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.statline b,#fslbl,#telespeed{font-variant-numeric:tabular-nums}

/* 6. Respect reduced-motion users */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .reader-body{scroll-behavior:auto}
}
/* ---------- transpose sheet ---------- */
.tpsheet{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-lg);width:min(92vw,380px);padding:20px;animation:fade .16s ease;
}
.tp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tp-head h3{font-family:var(--fd);font-weight:400;font-size:17px}
.tp-shift{font-size:11.5px;color:var(--teal);font-weight:600;letter-spacing:.04em}
.tp-row{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0 10px}
.tp-btn{
  width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:22px;line-height:1;
  border:1px solid var(--line2);background:var(--field);color:var(--text);
  display:flex;align-items:center;justify-content:center;transition:all .12s;
}
.tp-btn:active{transform:scale(.94)}
.tp-note{text-align:center;min-width:96px}
.tp-note .n{font-family:var(--fd);font-size:34px;color:var(--gold);line-height:1.1}
.tp-note .l{font-size:11px;color:var(--dim2);letter-spacing:.06em;margin-top:2px}
.tp-keys{display:flex;height:8px;border-radius:4px;overflow:hidden;border:1px solid var(--line);margin:4px 0 14px}
.tp-keys div{flex:1}
.tp-keys .w{background:var(--gold-soft)}
.tp-keys .b{background:#171226}
.tp-keys .on{background:var(--gold)!important}
.tp-play{
  width:100%;padding:12px;border:none;border-radius:11px;cursor:pointer;
  background:var(--teal);color:#fff;font-size:14.5px;font-weight:600;font-family:var(--fb);
  display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;
}
.tp-play.live{background:var(--red)}
.tp-reset{
  width:100%;margin-top:8px;padding:9px;border:none;border-radius:10px;cursor:pointer;
  background:none;color:var(--dim);font-size:12.5px;font-family:var(--fb);
}
.tp-open{
  border:1px solid var(--line);background:var(--field);color:var(--gold-ink);
  border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;
  font-family:var(--fb);letter-spacing:.02em;
}

/* ═══════════════════════════════════════════════════════════════
   AURA — design system v3
   Deep-indigo night (Shyam) lit by saffron; light "dawn" theme on toggle.
   One typeface pair: Outfit (display) + Mukta (UI, Latin & Devanagari).
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#F4F3FA; --bg2:#ECEBF5; --card:#FFFFFF; --glass:rgba(255,255,255,.78); --field:#EEEDF6; --hover:#F6F5FB;
  --line:#E4E2EF; --line2:#CFCBE0;
  --text:#171A38; --title:#12163A; --dim:#5B6084; --dim2:#8C90AE;
  --gold:#E68A1E; --gold-ink:#9A5A0A; --gold-soft:#FBEBD5; --gold-glow:rgba(230,138,30,.28);
  --teal:#0E8C9F; --teal-soft:rgba(14,140,159,.10);
  --red:#D9453F; --kumkum:#E2553A; --kumkum-deep:#C5462E;
  --shadow:0 1px 2px rgba(23,26,56,.04), 0 10px 30px rgba(23,26,56,.07);
  --shadow-lg:0 24px 60px rgba(23,26,56,.18);
  --r:18px; --r-sm:12px;
  --fd:"Outfit","Tiro Devanagari Hindi","Mukta",system-ui,sans-serif;
  --fb:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fr:"Mukta","Tiro Devanagari Hindi",system-ui,sans-serif;
  --blur:saturate(160%) blur(18px);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0E1330; --bg2:#0A0E24; --card:#171D3F; --glass:rgba(24,30,66,.72); --field:#1E2550; --hover:#222A5A;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.17);
  --text:#EEF0FA; --title:#FFFFFF; --dim:#A9AECF; --dim2:#7A80A8;
  --gold:#FFA43A; --gold-ink:#FFC66B; --gold-soft:rgba(255,164,58,.14); --gold-glow:rgba(255,164,58,.38);
  --teal:#5BD6E8; --teal-soft:rgba(91,214,232,.12);
  --red:#FF6B6B; --kumkum:#FF7A59; --kumkum-deep:#E2553A;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 12px 32px rgba(0,0,0,.35);
  --shadow-lg:0 30px 80px rgba(0,0,0,.6);
  color-scheme:dark;
}

/* ---- canvas: quiet gradient field, one saffron glow, one cyan glow ---- */
body, [data-theme="dark"] body{
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 520px at 8% -10%, var(--gold-glow), transparent 60%),
    radial-gradient(700px 500px at 100% 100%, var(--teal-soft), transparent 60%);
  background-attachment:fixed;background-repeat:no-repeat;
}
.keys{height:2px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--teal) 70%,transparent);opacity:.9}
.wrap{max-width:780px}

/* ---- header ---- */
.hdr{padding:18px 2px 8px}
.om-medal, [data-theme="dark"] .om-medal{
  width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:22px;line-height:1;color:#fff;
  background:radial-gradient(circle at 30% 25%, #FFC66B, #FFA43A 45%, #E2553A 100%);
  box-shadow:0 8px 22px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,.5);border:none;
}
.brand h1, [data-theme="dark"] .brand h1{font-family:var(--fd);font-weight:600;letter-spacing:-.015em;color:var(--title);font-size:clamp(20px,4.6vw,25px)}
.brand .sub{font-family:var(--fb);font-weight:500;letter-spacing:.02em;color:var(--gold);font-size:11.5px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--glass);border:1px solid var(--line);color:var(--dim);box-shadow:none;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.iconbtn:hover{color:var(--text);border-color:var(--line2);background:var(--hover)}
.iconbtn.on{color:var(--gold-ink);border-color:var(--gold);background:var(--gold-soft)}
.idbar{color:var(--dim2)}
.idbar b{color:var(--teal)}
.linkbtn{color:var(--gold);text-decoration:none;font-weight:600}

/* ---- surfaces: one card language, hierarchy by radius/border, not by shadow ---- */
.lcard,.listbox,.panel,.setcard,.homebox,.stat,.hcard,.tgc,.notechip,.subpanel,.preview,.lyrics-box,.filedrop{
  background:var(--card);border:1px solid var(--line);box-shadow:none;
}
.lcard,.listbox,.panel,.setcard{border-radius:var(--r)}
.stat,.hcard,.tgc{border-radius:var(--r-sm)}
.tgc[class*="t-"], [data-theme="dark"] .tgc{background:var(--card) !important;border-color:var(--line) !important}
.tgc-e{font-size:24px;filter:saturate(1.1)}
.setcard:hover,.lcard:hover,.hcard:hover,.stat:hover,.tgc:hover{border-color:var(--line2)}
.setcard::before{display:none}
.reccard{width:100%;text-align:left;cursor:pointer;font-family:var(--fb);color:var(--text);margin-bottom:10px;align-items:center}
.reccard h3{display:flex;align-items:center;gap:8px}
.reccard .chev{font-size:22px;color:var(--dim2)}

/* ---- hero ---- */
.hero, [data-theme="dark"] .hero{
  background:linear-gradient(135deg, var(--card) 0%, color-mix(in srgb, var(--card) 70%, var(--gold-soft)) 100%);
  border:1px solid var(--line);border-radius:22px;box-shadow:none;padding:20px 20px;
}
.hero::before{content:"";position:absolute;inset:auto -30% -70% auto;width:70%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle, var(--gold-glow), transparent 65%);pointer-events:none}
.hero::after{opacity:.05;font-size:130px;color:var(--gold-ink)}
.hero-om{font-size:34px;filter:drop-shadow(0 6px 14px var(--gold-glow))}
.hero-hi, [data-theme="dark"] .hero-hi{font-family:var(--fd);font-weight:600;letter-spacing:-.01em;color:var(--title)}
.hero-dt{color:var(--dim)}
.hero-r{background:var(--gold-soft) !important;color:var(--gold-ink) !important;border:1px solid transparent !important}

/* ---- stats + headings ---- */
.stat b, [data-theme="dark"] .stat b{font-family:var(--fd);font-weight:600;font-size:24px;letter-spacing:-.02em;color:var(--title);font-variant-numeric:tabular-nums}
.stat span{color:var(--dim);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.stat span svg{width:11px;height:11px}
.hrow h2{font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:.005em;color:var(--text)}
.hc-name{font-family:var(--fb);font-weight:600;font-size:14.5px}
.rank{border-radius:8px;font-family:var(--fd);font-weight:600}
.rank.r1, [data-theme="dark"] .rank.r1{background:linear-gradient(135deg,#FFC66B,#FFA43A);color:#3B2200}
.rank.r2{background:var(--field);color:var(--text)} .rank.r3{background:var(--field);color:var(--dim)}
[data-theme="dark"] .rank{background:var(--field);color:var(--dim)}

/* ---- navigation ---- */
.tabs{background:var(--glass);border:1px solid var(--line);border-radius:16px;box-shadow:none;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);padding:5px}
.tab{border-radius:12px;font-weight:600;font-size:13px;color:var(--dim);border:none}
.tab.active, [data-theme="dark"] .tab.active{background:var(--gold-soft);color:var(--gold-ink)}
.tab em, [data-theme="dark"] .tab em{background:var(--field);color:var(--dim2);border-radius:7px;font-style:normal;font-weight:700}
.tab.active em, [data-theme="dark"] .tab.active em{background:var(--gold);color:#2A1700}
@media (max-width:720px){
  .tabs, [data-theme="dark"] .tabs{
    background:var(--glass);border:none;border-top:1px solid var(--line);border-radius:0;
    box-shadow:0 -12px 40px rgba(0,0,0,.08);padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  [data-theme="dark"] .tabs{box-shadow:0 -12px 40px rgba(0,0,0,.5)}
  .tab{font-size:10.5px;font-weight:600;gap:4px;padding:6px 0;border-radius:12px}
  .tab svg{width:22px;height:22px;stroke-width:1.9}
  .tab.active, [data-theme="dark"] .tab.active{background:transparent;color:var(--gold)}
  .tab.active svg{filter:drop-shadow(0 4px 12px var(--gold-glow))}
  .tab.active::before{top:-9px;left:34%;right:34%;height:2px;background:var(--gold);border-radius:0 0 3px 3px;box-shadow:0 2px 12px var(--gold-glow)}
}

/* ---- search, chips, fields ---- */
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.searchbox input{background:var(--card);border-radius:14px;border:1px solid var(--line)}
.searchbox input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.searchbox svg.si{color:var(--dim2)}
label{letter-spacing:.02em;text-transform:none;font-size:12px;font-weight:600;color:var(--dim)}
.chip,.tchip,.favtoggle,.tagchip{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:999px;font-weight:600}
.chip.on,.favtoggle.on,.tagchip.on, [data-theme="dark"] .tagchip.on{background:var(--gold-soft);border-color:transparent;color:var(--gold-ink)}
.chip:hover,.tchip:hover{border-color:var(--line2)}
.notechip{border-radius:12px;color:var(--dim);font-size:12.5px}
.notechip.teal{border-color:var(--teal-soft);color:var(--teal)}

/* ---- rows ---- */
.ri{border-top:1px solid var(--line);padding:13px 12px 13px 12px}
.ri::before{display:none}
.ri:hover{background:var(--hover)}
.ri-name{font-weight:600;font-size:15.5px;letter-spacing:-.005em;color:var(--text)}
.alpha{font-family:var(--fd);font-weight:600;color:var(--dim2);background:var(--bg);letter-spacing:.06em;font-size:12px}
.alpha::after{display:none}
.pill{background:var(--field);color:var(--dim);border:none;border-radius:8px;font-weight:600}
.pill.pdf{background:var(--teal-soft);color:var(--teal)}
.pill.soft{background:transparent;border:1px solid var(--line);color:var(--dim2)}
.ri .star{color:var(--dim2)} .ri .star.on{color:var(--gold)}
.setrow .n,.sitem .nm{font-weight:600}
.setrow{border-top:1px solid var(--line)}
.setrow:hover,.sitem:hover{background:var(--hover)}

/* ---- action buttons ---- */
.ab{border-radius:11px;background:var(--field);border:1px solid transparent;color:var(--dim)}
.ab:hover{color:var(--text);background:var(--hover);border-color:var(--line2)}
.ab.play, [data-theme="dark"] .ab.play{background:linear-gradient(135deg,#FFC66B,#FFA43A);color:#2A1700;border:none;box-shadow:0 4px 14px var(--gold-glow)}
.ab.play:hover{filter:brightness(1.06)}
.ab.doc{color:var(--teal);background:var(--teal-soft)}
.ab.doc.dim{color:var(--dim2);background:var(--field)}
.ab.danger{color:var(--red);background:transparent}
.ab.on{background:var(--gold-soft);color:var(--gold-ink)}
.btn{border-radius:13px;font-weight:600}
.btn-gold, [data-theme="dark"] .btn-gold{background:linear-gradient(135deg,#FFC66B,#FFA43A 55%,#FF8F3A);color:#2A1700;border:none;box-shadow:0 6px 18px var(--gold-glow)}
.btn-gold:hover{filter:brightness(1.05)}
.btn-teal{background:var(--teal);color:#06202A;border:none}
[data-theme="light"] .btn-teal, :root:not([data-theme="dark"]) .btn-teal{color:#fff}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--line2);background:var(--hover)}
.addbtn{border-radius:14px}
.seg{background:var(--field);border:1px solid var(--line);border-radius:12px}
.seg button.on{background:var(--card);color:var(--text);border-radius:9px;box-shadow:var(--shadow)}

/* ---- floating buttons ---- */
.fab, [data-theme="dark"] .fab{
  background:linear-gradient(135deg,#FFC66B,#FFA43A 55%,#FF8F3A);color:#2A1700;border:none;
  box-shadow:0 10px 30px var(--gold-glow);font-weight:400;
}
.fab-tanpura, [data-theme="dark"] .fab-tanpura{
  background:var(--glass);border:1px solid var(--line2);color:var(--teal);
  box-shadow:0 10px 30px rgba(0,0,0,.18);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
}
.fab-tanpura.live, [data-theme="dark"] .fab-tanpura.live{background:var(--teal);color:#06202A;border-color:transparent;animation:tanpulse 1.8s ease infinite}
@keyframes tanpulse{0%,100%{box-shadow:0 0 0 0 var(--teal-soft)}55%{box-shadow:0 0 0 16px transparent}}
#totop{background:var(--glass);border:1px solid var(--line);color:var(--text);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
#shrutibar,#tablabar{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:999px}
#shrutibar{border:1px solid var(--gold);color:var(--gold-ink)}
#tablabar{border:1px solid var(--teal);color:var(--teal)}

/* ---- toast ---- */
#toast, [data-theme="dark"] #toast{background:#171D3F;color:#EEF0FA;border:1px solid rgba(255,255,255,.1);border-radius:14px;box-shadow:var(--shadow-lg);font-weight:500}
#toast.error, [data-theme="dark"] #toast.error{background:#4A1A1A;color:#FFD9D9;border-color:rgba(255,107,107,.35)}
#toast.update{background:linear-gradient(135deg,#FFC66B,#FFA43A);color:#2A1700;border:none;cursor:pointer;font-weight:700}

/* ---- overlays: reader / sheets ---- */
.overlay, [data-theme="dark"] .overlay{background:rgba(6,9,26,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
:root:not([data-theme="dark"]) .overlay{background:rgba(23,26,56,.35)}
.reader,.picker,.perform,.tpsheet,.tabla-panel{background:var(--card);border:1px solid var(--line2);border-radius:24px;box-shadow:var(--shadow-lg)}
.reader-head h3,.pf-main h2{font-family:var(--fd);font-weight:600;letter-spacing:-.01em;color:var(--title)}
.reader-head .rm2{color:var(--dim)}
.telebar{background:var(--field);border:1px solid var(--line);border-radius:14px}
.read-text{font-family:var(--fr);line-height:1.95;color:var(--text)}
.read-text .rl.cur{background:var(--gold-soft);color:var(--gold-ink);border-radius:8px}
.tp-open{border-radius:8px;background:var(--gold-soft);border:none;color:var(--gold-ink)}
.tp-note .n{font-family:var(--fd);font-weight:600;color:var(--gold)}
.tp-play{background:var(--teal);color:#06202A;border-radius:13px}
.tp-keys .b{background:var(--bg2)}
.tanp-key{border-radius:12px}
.tanp-key.k-white, [data-theme="dark"] .tanp-key.k-white{background:var(--card);border:1px solid var(--line2);color:var(--text)}
.tanp-key.k-black, [data-theme="dark"] .tanp-key.k-black{background:var(--bg2);border:1px solid var(--line2);color:var(--dim)}
.tanp-key.playing{background:var(--gold) !important;color:#2A1700 !important;box-shadow:0 8px 24px var(--gold-glow)}
.mt.on b,.mt.on span, [data-theme="dark"] .mt.on b, [data-theme="dark"] .mt.on span{color:var(--gold-ink)}
.mt.on{background:var(--gold-soft)}
.pf-nav button.main, [data-theme="dark"] .pf-nav button.main{background:linear-gradient(135deg,#FFC66B,#FFA43A);color:#2A1700;border:none}

/* press-and-hold action sheet */
.sheet-ov{align-items:flex-end !important;padding:0 !important}
.sheet{
  width:100%;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line2);border-bottom:none;
  border-radius:24px 24px 0 0;padding:8px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);
  animation:sheetUp .22s cubic-bezier(.2,.8,.2,1);
}
@media (min-width:700px){ .sheet-ov{align-items:center !important} .sheet{border-radius:24px;border-bottom:1px solid var(--line2);width:min(92vw,420px)} .sheet-grip{display:none} }
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:var(--line2);margin:4px auto 10px}
.sheet-title{font-family:var(--fd);font-weight:600;font-size:16px;color:var(--title);padding:6px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-item{
  width:100%;display:flex;align-items:center;gap:14px;padding:13px 12px;border:none;border-radius:12px;
  background:transparent;color:var(--text);font-family:var(--fb);font-size:15px;font-weight:500;cursor:pointer;text-align:left;
}
.sheet-item:hover,.sheet-item:active{background:var(--hover)}
.sheet-item .si-ic{width:34px;height:34px;border-radius:10px;background:var(--field);color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}

/* no-lyrics state */
.nolyr{text-align:center;padding:26px 16px 10px;max-width:420px;margin:0 auto;width:100%}
.nolyr-ic{width:56px;height:56px;border-radius:18px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:var(--field);color:var(--dim2)}
.nolyr-ic svg{width:24px;height:24px}
.nolyr h4{font-family:var(--fd);font-weight:600;font-size:18px;color:var(--title);margin-bottom:6px}
.nolyr p{color:var(--dim);font-size:14px;line-height:1.55;margin-bottom:18px}
.nolyr-acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.nolyr-acts .btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.empty{color:var(--dim)}
.empty .om{background:var(--field);border:none;color:var(--dim2);border-radius:18px}
.empty .om svg{width:24px;height:24px}

/* recordings */
.recwrap{width:100%;max-width:62ch;margin:0 auto;display:none;flex-direction:column;gap:8px}
.recwrap.has{display:flex;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.rechead{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:600;font-size:14px;color:var(--text);margin-bottom:4px}
.rechead em{font-style:normal;font-size:11px;background:var(--field);color:var(--dim2);border-radius:7px;padding:1px 7px}
.recbtn.live{background:var(--red) !important;color:#fff !important;border-color:transparent !important;animation:recpulse 1.2s ease infinite}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.5)}60%{box-shadow:0 0 0 12px transparent}}
.reclive{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--field);border:1px solid var(--line)}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s steps(2) infinite;flex-shrink:0}
@keyframes blink{to{opacity:.25}}
.reclive b{font-variant-numeric:tabular-nums;font-family:var(--fd);font-size:15px;min-width:42px}
.reclive canvas{flex:1;min-width:0;height:36px;width:100%}
.recstopbtn{padding:8px 14px !important;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.reclist{width:100%;display:flex;flex-direction:column;gap:8px}
.recitem{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.recitem.playing{border-color:var(--gold);background:color-mix(in srgb, var(--card) 85%, var(--gold-soft))}
.recplay{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FFC66B,#FFA43A);color:#2A1700;box-shadow:0 6px 16px var(--gold-glow)}
.recinfo{flex:1;min-width:0}
.recname{font-weight:600;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.recmeta{display:flex;gap:10px;font-size:11.5px;color:var(--dim2);margin-top:2px}
.recmeta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.recprog{height:3px;border-radius:2px;background:var(--field);margin-top:7px;overflow:hidden}
.recprog i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s linear}
.recacts{display:flex;gap:4px;flex-shrink:0}

/* skeletons */
.skelpill,.skelbar,.skelline,.skel{background:linear-gradient(90deg,var(--field) 25%,var(--hover) 50%,var(--field) 75%);background-size:200% 100%;border-radius:10px}

/* footer */
footer{color:var(--dim2)}
footer .m{font-family:var(--fd);font-weight:500;color:var(--gold)}

/* focus + motion */
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
::selection{background:var(--gold-soft);color:var(--gold-ink)}
#app.pagein{animation:pagein .22s ease}


/* ---- clean rows (bhajans + setlists) ---- */
.ri{gap:8px;padding:12px 10px 12px 6px}
.ri .star{padding:6px}
.ri .star svg{width:16px;height:16px}
.ri-name{font-size:15.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ri-meta2{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12.5px;color:var(--dim);min-width:0;overflow:hidden;white-space:nowrap}
.ri-meta2>span{overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:4px;flex-shrink:1;min-width:0}
.ri-meta2>span:first-of-type{flex-shrink:0}
.ri-meta2 .m-lyr{color:var(--teal);flex-shrink:0}
.ri-meta2 .m-lyr svg{width:11px;height:11px}
.ri-meta2 .dot{width:3px;height:3px;border-radius:50%;background:var(--dim2);flex-shrink:0;opacity:.7}
.ri-meta2 .sc{width:auto;min-width:22px;height:20px;font-size:11px;padding:0 6px;border-radius:6px;margin-right:2px}
.ri-acts{gap:6px}
.ri-acts .ab{width:38px;height:38px;border-radius:12px}
.ri-acts .ab svg{width:15px;height:15px}
@media (pointer:coarse){ .ri-acts .ab{width:40px;height:40px} }

.sitem{display:flex;align-items:flex-start;gap:10px;padding:12px 12px 12px 12px}
.sitem .num{font-family:var(--fd);font-weight:600;font-size:13px;color:var(--dim2);min-width:22px;height:22px;border-radius:7px;background:var(--field);display:flex;align-items:center;justify-content:center;text-align:center;margin-top:1px}
.sitem .sbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.sitem .nm{display:block;white-space:normal;font-family:var(--fb);font-weight:600;font-size:15.5px;line-height:1.35;overflow:visible;text-overflow:clip}
.sitem .srow{display:flex;align-items:center;gap:6px;min-width:0}
.sitem .srow .grow{flex:1}
.sitem .srow .sc{width:auto;min-width:26px;height:30px;font-size:12px;padding:0 8px;border-radius:9px}
.scwrap{position:relative;display:inline-flex;align-items:center;height:30px;padding:0 24px 0 10px;border-radius:9px;background:var(--field);color:var(--text);font-size:12px;font-weight:600;margin:0;flex-shrink:1;min-width:0;overflow:hidden;text-transform:none;letter-spacing:0}
.scwrap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.scwrap::after{content:"";position:absolute;right:9px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--dim2);border-bottom:1.5px solid var(--dim2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.scwrap.unset{color:var(--dim2);background:transparent;border:1px dashed var(--line2)}

function getVideoId(url){
  if(!url) return null;
  try{
    const u = new URL(url.trim());
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1).split("/")[0]||null;
    if(u.pathname.startsWith("/live/")) return u.pathname.split("/")[2]||null;
    if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2]||null;
    return u.searchParams.get("v");
  }catch{ return null; }
}
function parseTs(str){
  if(!str) return 0;
  const s = String(str).trim();
  if(/^\d+$/.test(s)) return parseInt(s,10);
  const p = s.split(":").map(x=>parseInt(x,10));
  if(p.some(isNaN)) return 0;
  if(p.length===3) return p[0]*3600+p[1]*60+p[2];
  if(p.length===2) return p[0]*60+p[1];
  return 0;
}

}
