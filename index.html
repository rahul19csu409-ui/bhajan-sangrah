<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
<title>Shyam Bhajan Sangrah</title>
<meta name="description" content="A community library of bhajans from live satsangs — scales, singers, lyrics, and one-tap YouTube timestamps." />
<meta name="theme-color" content="#f7f3ea" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@300;400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f7f3ea;
  --card:#ffffff;
  --field:#f4efe2;
  --hover:#f8f4e9;
  --line:#e5dcc4;
  --line2:#d8cdae;
  --text:#241d3d;
  --dim:#6f6590;
  --dim2:#9a91b3;
  --gold:#b0770f;
  --gold-soft:#f3e7c9;
  --gold-ink:#7c5406;
  --teal:#0d8573;
  --teal-soft:rgba(13,133,115,.09);
  --red:#c04747;
  --shadow:0 1px 2px rgba(60,45,15,.06), 0 6px 24px rgba(60,45,15,.07);
  --shadow-lg:0 10px 40px rgba(50,35,10,.16);
  --r:14px;
  --fd:"Marcellus","Tiro Devanagari Hindi",serif;
  --fb:"Mukta",system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0f0c1d;
  --card:#1a1530;
  --field:#241d42;
  --hover:#221b3e;
  --line:#2c2550;
  --line2:#3a3163;
  --text:#f2ecd9;
  --dim:#a89dc9;
  --dim2:#7d729f;
  --gold:#f0a838;
  --gold-soft:#3a2c12;
  --gold-ink:#ffc768;
  --teal:#38bfa7;
  --teal-soft:rgba(56,191,167,.1);
  --red:#e26565;
  --shadow:0 8px 28px rgba(0,0,0,.35);
  --shadow-lg:0 20px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
body{
  background:var(--bg);color:var(--text);font-family:var(--fb);
  min-height:100vh;-webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
img{max-width:100%}
a{color:inherit}
button{font-family:var(--fb)}
svg{flex-shrink:0}
input,select,textarea{
  font-family:var(--fb);width:100%;padding:11px 13px;font-size:15px;
  background:var(--field);color:var(--text);
  border:1px solid var(--line);border-radius:10px;outline:none;
  transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input::placeholder,textarea::placeholder{color:var(--dim2)}
label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:6px}

.keys{display:flex;height:5px}
.keys div{flex:1}
.keys .w{background:#efe8d3}.keys .b{background:#171226}

/* ---------- header ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 14px 110px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 2px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg.mark{width:42px;height:42px;filter:drop-shadow(0 2px 6px rgba(176,119,15,.35))}
.brand h1{font-family:var(--fd);font-weight:400;font-size:clamp(20px,4.6vw,26px);line-height:1.1;color:var(--text)}
.brand .sub{font-family:var(--fd);font-size:11.5px;color:var(--gold);letter-spacing:.28em;margin-top:2px;white-space:nowrap}
.ctrl{display:flex;gap:7px}
.iconbtn{
  width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:15px;
  border:1px solid var(--line);background:var(--card);color:var(--dim);
  display:flex;align-items:center;justify-content:center;transition:all .13s;box-shadow:var(--shadow);
}
.iconbtn:hover{color:var(--text);border-color:var(--line2)}
.iconbtn.lang{font-size:12px;font-weight:700}
.iconbtn.on{color:var(--gold-ink);border-color:var(--gold);background:var(--gold-soft)}

.idbar{font-size:12.5px;color:var(--dim2);padding:2px 2px 12px}
.idbar b{color:var(--teal);font-weight:600}
.linkbtn{background:none;border:none;color:var(--gold-ink);cursor:pointer;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}

/* ---------- tabs ---------- */
.tabs{
  display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;margin:4px 0 16px;position:sticky;top:8px;z-index:20;box-shadow:var(--shadow);
}
.tab{
  flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
  border:none;background:transparent;color:var(--dim);transition:all .15s;white-space:nowrap;
}
.tab.active{background:var(--gold-soft);color:var(--gold-ink)}

/* ---------- stats + trending ---------- */
.statline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--dim2);margin:0 2px 12px}
.statline b{color:var(--gold-ink);font-weight:700}
.statline .sep{opacity:.5}
.tchip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;cursor:pointer;
  font-size:12px;font-weight:600;color:var(--teal);border:1px solid var(--line);background:var(--card);
  transition:border-color .13s;
}
.tchip:hover{border-color:var(--teal)}
.tchip b{color:var(--gold-ink)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar input{flex:1 1 100%;padding:10px 13px}
.toolbar select{flex:1;min-width:0;padding:9px 10px;font-size:13.5px}
.favtoggle{
  display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;padding:6px 14px;border-radius:999px;
  cursor:pointer;font-size:12.5px;font-weight:600;border:1px solid var(--line);
  background:var(--card);color:var(--dim);transition:all .13s;
}
.favtoggle.on{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}

/* ---------- compact list ---------- */
.listwrap{position:relative}
.listbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.alpha{
  position:sticky;top:64px;z-index:5;padding:5px 14px;font-family:var(--fd);font-size:13px;
  color:var(--gold-ink);background:var(--field);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  letter-spacing:.14em;
}
.listbox .alpha:first-child{border-top:none}
.ri{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-top:1px solid var(--line);transition:background .12s;position:relative}
.ri::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:2.5px;border-radius:3px;background:transparent;transition:background .15s}
.ri:hover::before{background:var(--gold)}
.ri:first-child,.alpha + .ri{border-top:none}
.ri:hover{background:var(--hover)}
.ri .star{background:none;border:none;cursor:pointer;padding:4px;color:var(--dim2);transition:all .13s;line-height:0}
.ri .star.on{color:var(--gold)}
.ri .star:hover{transform:scale(1.15)}
.ri-main{flex:1;min-width:0;cursor:default}
.ri-name{font-family:var(--fd);font-size:16.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri-meta{font-size:11.5px;color:var(--dim2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.ri-meta .sc{
  display:inline-flex;align-items:center;padding:0 6px;border-radius:4px;font-size:10.5px;font-weight:700;
  height:16px;line-height:16px;letter-spacing:.02em;flex-shrink:0;
}
.sc.white{background:#efe8d3;color:#141024;border:1px solid #d6cba8}
.sc.black{background:#1d1733;color:#efe8d3;border:1px solid #4a4078}
.ri-acts{display:flex;gap:5px;align-items:center}
.ab{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;
  color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .13s;
  text-decoration:none;
}
.ab:hover{color:var(--text);border-color:var(--line2)}
.ab.play{background:var(--gold);border-color:var(--gold);color:#fff;border-radius:50%;box-shadow:0 2px 8px rgba(176,119,15,.3)}
[data-theme="dark"] .ab.play{color:#241604}
.ab.play:hover{filter:brightness(1.08)}
.ab.doc{color:var(--teal);border-color:var(--teal-soft);background:var(--teal-soft)}
.ab.danger{color:var(--red)}

/* A-Z jump rail */
.azrail{
  position:fixed;right:2px;top:50%;transform:translateY(-50%);z-index:25;
  display:flex;flex-direction:column;gap:0;padding:6px 3px;border-radius:99px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
}
.azrail button{
  background:none;border:none;color:var(--dim2);font-size:9.5px;font-weight:700;cursor:pointer;
  padding:1.5px 5px;line-height:1.2;border-radius:6px;transition:all .12s;
}
.azrail button:hover{color:var(--gold-ink);background:var(--gold-soft);transform:scale(1.35)}
.azrail button.active{color:#fff;background:var(--gold);transform:scale(1.2)}
[data-theme="dark"] .azrail button.active{color:#241604}
.alpha{scroll-margin-top:118px}
.ri{touch-action:manipulation}
.ri-main{cursor:pointer}
@media(min-width:900px){.azrail{right:calc(50% - 430px)}}

/* skeleton shimmer */
.skel{
  height:180px;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(100deg,var(--field) 40%,var(--hover) 50%,var(--field) 60%);
  background-size:200% 100%;animation:shimmer 1.2s linear infinite;
}
@keyframes shimmer{to{background-position:-200% 0}}
.pagecap{font-size:11px;color:var(--dim2);text-align:center;margin-top:-8px}
.telebar{
  display:flex;align-items:center;gap:8px;justify-content:center;
  padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card);
}

/* clickable scale chips (shruti) */
.sc{cursor:pointer;user-select:none}
.sc.playing{outline:2px solid var(--gold);animation:pulseSc 1s ease infinite}
@keyframes pulseSc{0%,100%{outline-color:var(--gold)}50%{outline-color:transparent}}
/* tanpura keyboard */
.tanp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tanp-key{
  border-radius:12px;padding:14px 8px;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;gap:3px;align-items:center;transition:all .12s;
  border:1.5px solid var(--line2);
}
.tanp-key b{font-size:18px;font-family:var(--fd);font-weight:400}
.tanp-key span{font-size:10.5px;opacity:.75}
.tanp-key.k-white{background:#f6f0dc;color:#1c1530}
.tanp-key.k-black{background:#1d1733;color:#f0e9d5;border-color:#4a4078}
.tanp-key:active{transform:scale(.96)}
.tanp-key.playing{outline:3px solid var(--gold);box-shadow:0 0 18px rgba(176,119,15,.4);animation:pulseSc 1s ease infinite}

/* tabla */
.tabla-panel{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:12px}
.tp-head{font-size:13px;font-weight:700;color:var(--gold-ink);letter-spacing:.06em;text-transform:uppercase}
.tp-row{display:flex;gap:9px}
.tb-matras{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.mt{
  width:46px;padding:7px 0;border-radius:10px;border:1.5px solid var(--line);text-align:center;
  display:flex;flex-direction:column;gap:1px;background:var(--field);transition:all .08s;
}
.mt b{font-size:14px;color:var(--text)}
.mt span{font-size:9.5px;color:var(--dim2)}
.mt.sam{border-color:var(--gold);background:var(--gold-soft)}
.mt.sam b{color:var(--gold-ink)}
.mt.kh{border-style:dashed}
.mt.on{background:var(--gold);border-color:var(--gold);transform:scale(1.12);box-shadow:0 0 14px rgba(176,119,15,.45)}
.mt.on b,.mt.on span{color:#fff}
[data-theme="dark"] .mt.on b,[data-theme="dark"] .mt.on span{color:#241604}
#tablabar{
  position:fixed;bottom:140px;left:50%;transform:translateX(-50%);z-index:35;display:none;
  align-items:center;gap:10px;background:var(--card);border:1px solid var(--teal);
  color:var(--teal);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
  box-shadow:var(--shadow-lg);cursor:pointer;white-space:nowrap;
}
#tablabar .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);animation:pulse 1s ease infinite}

#shrutibar{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:35;display:none;
  align-items:center;gap:10px;background:var(--card);border:1px solid var(--gold);
  color:var(--gold-ink);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
  box-shadow:var(--shadow-lg);cursor:pointer;
}
#shrutibar .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);animation:pulse 1s ease infinite}

/* segmented control */
.seg{display:flex;gap:4px;padding:4px;background:var(--field);border:1px solid var(--line);border-radius:11px;width:fit-content}
.seg button{border:none;background:transparent;color:var(--dim);font-size:13px;font-weight:700;padding:7px 18px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--gold-ink);box-shadow:var(--shadow)}

/* setlists */
.setcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:var(--shadow);margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer;
  transition:transform .13s;
}
.setcard:hover{transform:translateY(-2px)}
.setcard h3{font-family:var(--fd);font-weight:400;font-size:18px}
.setcard .sm{font-size:12px;color:var(--dim2);margin-top:3px}
.sitem{display:flex;align-items:center;gap:9px;padding:11px 12px;border-top:1px solid var(--line)}
.sitem:first-child{border-top:none}
.sitem .num{font-family:var(--fd);color:var(--gold-ink);min-width:24px;text-align:right;font-size:15px}
.sitem .nm{flex:1;min-width:0;font-family:var(--fd);font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .mv{display:flex;flex-direction:column;gap:2px}
.sitem .mv button{width:26px;height:20px;border:1px solid var(--line);background:var(--field);color:var(--dim);border-radius:6px;cursor:pointer;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center}

/* picker overlay */
.picker{background:var(--bg);width:100%;height:100%;max-width:640px;display:flex;flex-direction:column}
@media(min-width:700px){.picker{height:86vh;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow-lg)}}
.picker-head{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:10px;align-items:center}
.picker-head input{flex:1}
.picker-list{flex:1;overflow-y:auto}
.pk{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.pk:hover{background:var(--hover)}
.pk .cb{width:21px;height:21px;border-radius:7px;border:2px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.pk.sel .cb{background:var(--gold);border-color:var(--gold)}
.pk .nm{font-family:var(--fd);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .si{font-size:11px;color:var(--dim2)}

/* perform mode */
.perform{background:var(--bg);width:100%;height:100%;display:flex;flex-direction:column}
.pf-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:var(--card)}
.pf-prog{font-size:13px;color:var(--dim2);font-weight:700}
.pf-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:16px}
.pf-main h2{font-family:var(--fd);font-weight:400;font-size:clamp(26px,6vw,40px);line-height:1.25}
.pf-scale{transform:scale(1.5);margin:8px 0}
.pf-acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pf-nav{display:flex;gap:10px;padding:16px;border-top:1px solid var(--line);background:var(--card)}
.pf-nav button{flex:1;padding:15px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);font-size:16px;font-weight:700;cursor:pointer}
.pf-nav button.main{background:var(--gold);border-color:var(--gold);color:#fff}
[data-theme="dark"] .pf-nav button.main{color:#241604}

/* ---------- live cards ---------- */
.lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.lhead{display:flex;gap:12px;padding:12px;align-items:center}
.thumb-link{position:relative;flex-shrink:0;display:block;width:118px}
.thumb{width:118px;aspect-ratio:16/9;border-radius:9px;object-fit:cover;display:block;background:var(--field);border:1px solid var(--line)}
.thumb-link::after{
  content:"";position:absolute;inset:0;border-radius:9px;
  background:radial-gradient(circle at center, rgba(0,0,0,.25), transparent 60%);
}
.thumb-link svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;filter:drop-shadow(0 1px 4px rgba(0,0,0,.7));z-index:1}
.linfo{flex:1;min-width:0}
.linfo h3{font-family:var(--fd);font-weight:400;font-size:16.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.linfo .lm{font-size:11.5px;color:var(--dim2);margin-top:3px}
.lacts{display:flex;flex-direction:column;gap:5px}
.setlist{border-top:1px solid var(--line)}
.setrow{
  display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;
  padding:9px 14px;border-top:1px solid var(--line);transition:background .12s;
}
.setrow:first-child{border-top:none}
.setrow:hover{background:var(--hover)}
.setrow .t{color:var(--gold-ink);font-variant-numeric:tabular-nums;font-size:12px;min-width:52px;font-weight:700}
.setrow .n{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setrow .left{display:flex;gap:10px;align-items:center;min-width:0}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:11px 18px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;
  border:none;text-decoration:none;white-space:nowrap;transition:all .13s;
}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:#fff;box-shadow:0 2px 10px rgba(176,119,15,.3)}
[data-theme="dark"] .btn-gold{color:#241604}
.btn-gold:hover{filter:brightness(1.07)}
.btn-teal{background:var(--teal-soft);border:1px solid var(--teal);color:var(--teal)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
.btn-ghost:hover{color:var(--text)}
.btn-big{padding:13px 28px;font-size:15px}

/* ---------- forms ---------- */
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);
}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:170px}
.subpanel{padding:14px;border:1px dashed var(--line2);border-radius:11px;display:flex;flex-direction:column;gap:12px}
.lyrics-box{padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--teal-soft);display:flex;flex-direction:column;gap:12px}
.lyrics-box .lbl{font-size:12px;font-weight:700;color:var(--teal);letter-spacing:.05em;text-transform:uppercase}
.hint{font-size:12px;color:var(--dim2);margin-top:5px;font-weight:300}
textarea{min-height:110px;resize:vertical;line-height:1.8}
textarea.mono{font-family:ui-monospace,monospace;font-size:13px}

.filedrop{
  border:1.5px dashed var(--line2);border-radius:11px;padding:16px;text-align:center;cursor:pointer;
  color:var(--dim);font-size:13.5px;transition:all .15s;background:var(--field);
}
.filedrop:hover{border-color:var(--gold);color:var(--gold-ink)}
.fthumbs{display:flex;gap:8px;flex-wrap:wrap}
.fthumb{position:relative;width:74px}
.fthumb img{width:74px;height:74px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.fthumb .pdfbox{width:74px;height:74px;border-radius:9px;border:1px solid var(--line);background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--dim);gap:4px;padding:4px;text-align:center;overflow:hidden}
.fthumb .rm{
  position:absolute;top:-7px;right:-7px;width:21px;height:21px;border-radius:50%;border:none;
  background:var(--red);color:#fff;font-size:11px;cursor:pointer;line-height:1;box-shadow:var(--shadow);
}

/* ---------- bulk preview ---------- */
.preview{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.preview-head{padding:10px 14px;background:var(--field);font-size:12.5px;font-weight:700;color:var(--gold-ink);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.preview-head span{color:var(--dim2);font-weight:400}
.preview-rows{max-height:320px;overflow-y:auto}
.prow{display:flex;gap:7px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}
.prow .num{color:var(--dim2);font-size:11.5px;min-width:22px;text-align:right}
.prow input{padding:7px 9px;font-size:13px}
.prow .time{max-width:104px;font-family:ui-monospace,monospace}
.prow .x{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:4px}

.empty{
  text-align:center;padding:54px 18px;color:var(--dim);
  border:1px dashed var(--line2);border-radius:var(--r);font-weight:300;line-height:1.7;background:var(--card);
}
.empty .om{font-size:30px;display:block;margin-bottom:10px;opacity:.55}

/* ---------- reader modal (fullscreen) ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(20,14,5,.55);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:0;z-index:50;animation:fade .16s ease;
}
[data-theme="dark"] .overlay{background:rgba(4,2,10,.8)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.reader{
  background:var(--bg);width:100%;height:100%;max-width:820px;
  display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease;
}
@media(min-width:860px){.reader{height:92vh;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow-lg)}}
@keyframes pop{from{transform:scale(.985);opacity:0}to{transform:none;opacity:1}}
.reader-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card)}
.reader-head h3{font-family:var(--fd);font-weight:400;font-size:19px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-head .rm2{font-size:11.5px;color:var(--dim2);margin-top:1px}
.reader-body{overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px;flex:1}
.read-text{
  white-space:pre-wrap;line-height:2.1;font-size:18px;font-family:var(--fd);
  background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--line);
}
.read-img{width:100%;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.read-img.zoom{cursor:zoom-out;border-radius:0}
.read-pdf{width:100%;height:74vh;border:1px solid var(--line);border-radius:12px;background:#fff}

#toast{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--card);border:1px solid var(--teal);color:var(--teal);
  padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .22s;z-index:60;box-shadow:var(--shadow-lg);
  max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.error{border-color:var(--red);color:var(--red)}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:18px;bottom:22px;z-index:30;width:56px;height:56px;border-radius:18px;
  background:var(--gold);color:#fff;border:none;font-size:26px;cursor:pointer;
  box-shadow:0 6px 22px rgba(176,119,15,.45);display:flex;align-items:center;justify-content:center;
  transition:transform .13s;
}
[data-theme="dark"] .fab{color:#241604}
.fab:active{transform:scale(.94)}

.loading{text-align:center;padding:70px 20px;color:var(--dim)}
.pulse{animation:pulse 1.4s ease infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

footer{text-align:center;margin-top:48px;color:var(--dim2);font-size:12px;font-weight:300}
footer .m{font-family:var(--fd);color:var(--gold);letter-spacing:.24em;font-size:12px;margin-bottom:5px}

@media (max-width:480px){
  .tab{font-size:11.5px;padding:9px 2px}
  .lacts{flex-direction:row}
  .lhead{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

let theme = localStorage.getItem("bhajan-theme") || "light";
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme==="light" ? "#f7f3ea" : "#0f0c1d";
}
window.toggleTheme = ()=>{ theme = theme==="dark" ? "light" : "dark"; localStorage.setItem("bhajan-theme", theme); applyTheme(); };
applyTheme();

window.toggleLang = ()=>{ lang = lang==="hi" ? "en" : "hi"; localStorage.setItem("bhajan-lang", lang); applyStatics(); render(); };
function applyStatics(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  $("langbtn").textContent = lang==="hi" ? "EN" : "हिं";
  renderId();
}

function getVideoId(url){
  if(!url) return null;
  try{
    const u = new URL(url.trim());
    if(u.hostname.includes("youtu.be")) return u.pathname.slice(1).split("/")[0]||null;
    if(u.pathname.startsWith("/live/")) return u.pathname.split("/")[2]||null;
    if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2]||null;
    return u.searchParams.get("v");
  }catch{ return null; }
}
function parseTs(str){
  if(!str) return 0;
  const s = String(str).trim();
  if(/^\d+$/.test(s)) return parseInt(s,10);
  const p = s.split(":").map(x=>parseInt(x,10));
  if(p.some(isNaN)) return 0;
  if(p.length===3) return p[0]*3600+p[1]*60+p[2];
  if(p.length===2) return p[0]*60+p[1];
  return 0;
}
function fmtTime(sec){
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h>0 ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;
}
const yt = (vid,sec)=>`https://www.youtube.com/watch?v=${vid}${sec?`&t=${sec}s`:""}`;

function parseBulk(text){
  return text.split("\n").map(l=>l.trim()).filter(Boolean).map((line,i)=>{
    const m = line.match(/(\d{1,2}:\d{1,2}(?::\d{1,2})?)/);
    let time="", name=line;
    if(m){ time=m[1]; name=(line.slice(0,m.index)+" "+line.slice(m.index+m[1].length)).trim(); }
    name = name.replace(/^[\s\-–—|•:.)\]〉>]+/,"").replace(/[\s\-–—|•:(\[〈<]+$/,"").trim();
    return name ? {key:"r"+i+Date.now(), name, time} : null;
  }).filter(Boolean);
}

/* ================= sampled sounds ================= */
const NOTE_SEMI = {"C":0,"C#":1,"D":2,"D#":3,"E":4,"F":5,"F#":6,"G":7,"G#":8,"A":9,"A#":10,"B":11};
let audioCtx = null, shrutiNodes = [], shrutiNote = null;
const SND = {};           // decoded AudioBuffers
let sndLoading = null;
const SOUND_FILES = {
  dha:"sounds/t_dha.mp3", dhin:"sounds/t_dhin.mp3", ge:"sounds/t_ge.mp3",
  na:"sounds/t_na.mp3", ta:"sounds/t_ta.mp3", tin:"sounds/t_tin.mp3", ke:"sounds/t_ke.mp3",
};
function actx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); return audioCtx; }
async function loadSounds(){
  if(sndLoading) return sndLoading;
  sndLoading = (async ()=>{
    actx();
    const jobs = Object.entries(SOUND_FILES).map(async ([k, url])=>{
      try{
        const buf = await (await fetch(url)).arrayBuffer();
        SND[k] = await audioCtx.decodeAudioData(buf);
      }catch(e){ console.error("sound load failed:", k, e); }
    });
    await Promise.all(jobs);
  })();
  return sndLoading;
}
function noteFreq(note, octave){ return 261.6256 * Math.pow(2,(NOTE_SEMI[note]||0)/12) * Math.pow(2, octave-4); }
window.toggleShruti = (note, ev)=>{
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  if(shrutiNote === note){ stopShruti(); return; }
  stopShruti();
  try{
    actx();
    const master = audioCtx.createGain(); master.gain.value = 0;
    const lp = audioCtx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value = 1600;
    master.connect(lp); lp.connect(audioCtx.destination);
    // smooth continuous Sa+Pa drone (the original)
    const voices = [
      {f:noteFreq(note,3), g:.5}, {f:noteFreq(note,3)*1.5, g:.28},
      {f:noteFreq(note,4), g:.3}, {f:noteFreq(note,4)*1.003, g:.12},
    ];
    for(const v of voices){
      const o = audioCtx.createOscillator(); o.type = "sawtooth";
      const g = audioCtx.createGain(); g.gain.value = v.g;
      o.frequency.value = v.f; o.connect(g); g.connect(master); o.start();
      shrutiNodes.push(o);
    }
    master.gain.linearRampToValueAtTime(.16, audioCtx.currentTime + .6);
    shrutiNodes.push(master);
    shrutiNote = note;
    const info = SCALES.find(s=>s[0]===note);
    $("shrutitxt").textContent = `${t("playingShruti")}: ${note} · ${info?info[1]:""} — ${t("stopShruti")}`;
    $("shrutibar").style.display = "flex";
    document.querySelectorAll(".sc").forEach(el=>{ el.classList.toggle("playing", el.dataset.note===note); });
  }catch(e){ console.error(e); }
};
window.stopShruti = ()=>{
  shrutiNodes.forEach(n=>{ try{ n.stop ? n.stop() : n.disconnect(); }catch{} });
  shrutiNodes = []; shrutiNote = null;
  $("shrutibar").style.display = "none";
  document.querySelectorAll(".sc.playing").forEach(el=>el.classList.remove("playing"));
};

/* ================= file handling ================= */
function compressImage(file, maxW, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

window.onFilePick = async (e)=>{
  const files = [...(e.target.files||[])];

    if(formFiles.length + existingFiles.length >= 4){ toast(t("fileMax"), true); break; }
    if(f.type === "application/pdf"){
      if(f.size > 650*1024){ toast(t("fileTooBig"), true); continue; }
      const data = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
      formFiles.push({type:"pdf", data, name:f.name});
    } else if(f.type.startsWith("image/")){
      let data = await compressImage(f, 1100, 0.72);
      if(data.length > 480000) data = await compressImage(f, 850, 0.55);
      formFiles.push({type:"image", data, name:f.name});
    }
  }
  renderFileThumbs();
};

/* ================= session dedupe ================= */
async function ensureSession(url, title, date){
  const vid = getVideoId(url);
  if(!vid) return {error:true};
  const existing = sessions.find(s=>s.videoId===vid);
  if(existing) return {id:existing.id, reused:true};
  const s = await addDoc(sessionsCol, {
    title: (title||"").trim() || "Live session",
    videoId: vid, date: date || "", createdAt: serverTimestamp()
  });
  return {id:s.id};
}

let teleRaf = null, teleOn = false, teleSpeed = parseFloat(localStorage.getItem("bhajan-tele")||"1");
window.teleToggle = ()=>{

function teleStart(){
  const rb = document.querySelector(".overlay .reader-body");
  if(!rb) return;
  teleOn = true;
  const btn = document.getElementById("telebtn"); if(btn) btn.textContent = "⏸";
  function step(){
    if(!teleOn || !document.body.contains(rb)){ teleStop(); return; }
    rb.scrollTop += 0.45 * teleSpeed;
    if(rb.scrollTop + rb.clientHeight >= rb.scrollHeight - 2){ teleStop(); return; }
    teleRaf = requestAnimationFrame(step);
  }
  teleRaf = requestAnimationFrame(step);
}
window.teleStop = ()=>{
  teleOn = false;
  if(teleRaf) cancelAnimationFrame(teleRaf);
  const btn = document.getElementById("telebtn"); if(btn) btn.textContent = "▶";
};

      if(r.reused) toast(t("reused"));

    const willHaveFiles = (existingFiles.length + formFiles.length) > 0;
    const rec = {
      name,
      singer: $("f-singer").value.trim(),
      scale: $("f-scale").value,
      seconds: parseTs($("f-time").value),
      sessionId: sessionId || "",
      notes: $("f-notes").value.trim(),
      lyricsLink: $("f-llink").value.trim(),

window.onRestoreFile = async (e)=>{
  const f = e.target.files && e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    if(!data.bhajans) return toast("Not a valid backup file.", true);
    if(!confirm(`Restore ${data.bhajans.length} bhajans? Existing names are skipped.`)) return;
    const existing = new Set(bhajans.map(b=>b.name.trim().toLowerCase()));
    const existVid = new Set(sessions.map(s=>s.videoId));
    let batch = writeBatch(db), n=0, added=0;
    for(const s of (data.sessions||[])){
      if(s.videoId && existVid.has(s.videoId)) continue;
      const {id, ...rest} = s; rest.createdAt = serverTimestamp();
      batch.set(doc(sessionsCol), rest); n++;
      if(n>=200){ await batch.commit(); batch=writeBatch(db); n=0; }
    }
    for(const b of data.bhajans){
      if(existing.has((b.name||"").trim().toLowerCase())) continue;
      const {id, ...rest} = b; rest.createdAt = serverTimestamp();
      batch.set(doc(bhajansCol), rest); n++; added++;
      if(n>=200){ await batch.commit(); batch=writeBatch(db); n=0; }
    }
    if(n>0) await batch.commit();
    toast(`📥 Restored ${added} bhajans ✓`);
  }catch(err){ console.error(err); toast("Restore failed.", true); }
};

function topSingers(n=3){

  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,n);
}
/* ---- fuzzy search: forgives Hinglish spelling differences & typos ---- */
function normTxt(s){
  s = String(s||"").toLowerCase();
  s = s.replace(/[^a-z0-9\u0900-\u097F ]+/g, " ");
  // common transliteration equivalences
  s = s.replace(/aa/g,"a").replace(/ee/g,"i").replace(/oo/g,"u")
       .replace(/w/g,"v").replace(/ph/g,"f").replace(/z/g,"j")
       .replace(/chh/g,"ch").replace(/q/g,"k").replace(/x/g,"ks");
  s = s.replace(/h/g,"");            // shyam/sham/syam → sam; hai/he → ai/e
  s = s.replace(/y/g,"i");
  s = s.replace(/(.)\1+/g,"$1");     // collapse doubles
  return s.replace(/\s+/g," ").trim();
}
function lev(a, b){
  if(a===b) return 0;
  const m=a.length, n=b.length;
  if(Math.abs(m-n) > 2) return 3;
  let prev = Array.from({length:n+1}, (_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
function searchScore(hay, q){
  const H = normTxt(hay), Q = normTxt(q);
  if(!Q) return 1;
  if(H.includes(Q)) return H.startsWith(Q) ? 5 : 4;          // exact phrase
  const hw = H.split(" "), qw = Q.split(" ");
  // every word typed is a prefix of some word in the name
  if(qw.every(tk => hw.some(w => w.startsWith(tk)))) return 3;
  // every word is a substring
  if(qw.every(tk => hw.some(w => w.includes(tk)))) return 2;
  // spelling-tolerant (typos / Hinglish variants)
  const ok = qw.every(tk =>
    hw.some(w => {
      const tol = tk.length>=6 ? 2 : tk.length>=4 ? 1 : 0;
      return tol>0 && lev(w, tk) <= tol;
    })
  );
  return ok ? 1 : 0;
}

function filtered(){
  const q = search.trim();
  const S = sessById();
  let list = bhajans.filter(b=>{
    if(favOnly && !favs.has(b.id)) return false;
    if(scaleF && b.scale!==scaleF) return false;
    if(singerF && (b.singer||"").trim()!==singerF) return false;
    return true;
  });
  if(!q) return list;
  const scored = [];
  for(const b of list){
    const sess = S[b.sessionId];
    const s = Math.max(
      searchScore(b.name, q),
      searchScore(b.singer||"", q) - 1,
      searchScore((b.notes||"") + " " + (sess?sess.title:""), q) - 2
    );
    if(s > 0) scored.push([s, b]);
  }
  scored.sort((a,b)=> b[0]-a[0] || a[1].name.localeCompare(b[1].name));
  return scored.map(x=>x[1]);
}

        <div><label>${t("bulkScale")}</label><select id="bk-scale"><option value="">${t("scaleLater")}</option>${SCALES.map(s=>`<option value="${s[0]}">${s[0]} · ${s[1]}</option>`).join("")}</select></div>
      </div>
      <datalist id="singers">${allSingers().map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
      <div>
        <label>${t("pasteList")}</label>
        <textarea id="bk-text" class="mono" placeholder="14:20 …&#10;32:45 …&#10;1:05:10 …"></textarea>
        <button class="btn btn-teal" style="margin-top:10px" onclick="doParse()">${t("parse")}</button>
      </div>
      <div id="bulkzone"></div>
    </div>`;
  }

  if(tab==="sets"){
    const sets = getSets();
    const cur = openSetId ? sets.find(s=>s.id===openSetId) : null;
    if(!cur){
      body += `<button class="btn btn-gold" style="margin-bottom:14px" onclick="newSetlist()">${t("newSetlist")}</button>`;
      body += sets.length===0
        ? `<div class="empty"><span class="om">🎼</span>${t("emptySets")}</div>`
        : sets.map(s=>`
          <div class="setcard" onclick="openSet('${s.id}')">
            <div><h3>🎼 ${esc(s.name)}</h3><div class="sm">${s.items.length} ${t("itemsWord")} · ${new Date(s.created).toLocaleDateString()}</div></div>
            <div style="display:flex;gap:7px">
              ${s.items.length?`<button class="btn btn-gold" onclick="event.stopPropagation();performSet('${s.id}')">${t("perform")}</button>`:""}
              ${s.items.length?`<button class="ab" onclick="shareSetlist('${s.id}', event)" title="WhatsApp">📤</button>`:""}
              <button class="ab danger" onclick="delSet('${s.id}', event)">${ICONS.trash}</button>
            </div>
          </div>`).join("");
    }else{
      const items = cur.items.map(id=>bhajans.find(b=>b.id===id)).filter(Boolean);
      body += `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="openSet(null)">← ${t("tabSets")}</button>
        <div style="display:flex;gap:8px">
          <button class="btn btn-teal" onclick="openPicker('${cur.id}')">${t("addToSet")}</button>
          ${items.length?`<button class="btn btn-ghost" onclick="shareSetlist('${cur.id}')" title="Share on WhatsApp">📤 WhatsApp</button>`:""}
          ${items.length?`<button class="btn btn-gold" onclick="performSet('${cur.id}')">${t("perform")}</button>`:""}
        </div>
      </div>
      <div class="statline"><span style="font-family:var(--fd);font-size:16px;color:var(--text)">🎼 ${esc(cur.name)}</span><span class="sep">·</span><span>${items.length} ${t("itemsWord")}</span></div>
      <div class="hint" style="margin-bottom:10px">${t("shrutiHint")}</div>`;
      body += items.length===0
        ? `<div class="empty"><span class="om">🎼</span>${t("emptySet")}</div>`
        : `<div class="listbox">` + items.map((b,i)=>`
          <div class="sitem">
            <span class="num">${i+1}.</span>
            <span class="nm">${esc(b.name)}</span>
            ${b.scale?scMini(b.scale):""}
            ${hasAnyLyrics(b)?`<button class="ab doc" onclick="openLyrics('${b.id}')">${ICONS.doc}</button>`:""}
            <div class="mv">
              <button onclick="setMove('${cur.id}',${i},-1)" title="${t("moveUp")}">▲</button>
              <button onclick="setMove('${cur.id}',${i},1)" title="${t("moveDown")}">▼</button>
            </div>
            <button class="ab danger" onclick="setRemove('${cur.id}',${i})">✕</button>
          </div>`).join("") + `</div>`;
    }
  }

  $("app").innerHTML = body;
  $("fab").style.display = (tab==="bhajans"||tab==="lives") ? "flex" : "none";
  if(tab!=="bhajans"){ const r=document.getElementById("azrail"); if(r) r.remove(); }
  if(tab==="bhajans") renderListOnly();
  if(tab==="add" && (editingId || addMode==="one")){ renderFileThumbs(); b_sessionPreselect(); }
  if(tab==="add" && !editingId && addMode==="bulk") renderBulkPreview();
}
window.setAddMode = (m)=>{ addMode=m; render(); };

/* ================= tabla engine ================= */
const TAALS = {
  "Keherwa · 8": {n:8, khaali:5, seq:["dha","ge","na","tin","na","ke","dhin","na"]},
  "Dadra · 6":   {n:6, khaali:4, seq:["dha","dhin","na","dha","tin","na"]},
  "Bhajani · 8": {n:8, khaali:5, seq:["dhin","na","dhin","dhin","na","tin","na","dhin"]},
  "Teentaal · 16":{n:16, khaali:9, seq:["dha","dhin","dhin","dha","dha","dhin","dhin","dha","dha","tin","tin","ta","ta","dhin","dhin","dha"]},
};
let tablaOn = false, tablaTaal = "Keherwa · 8", tablaBpm = parseInt(localStorage.getItem("bhajan-bpm")||"92");
let tMaster = null, tNext = 0, tBeat = 0, tTimer = null;

function tOut(){ if(!tMaster){ tMaster = actx().createGain(); tMaster.gain.value = .95; tMaster.connect(audioCtx.destination); } return tMaster; }
function playBol(name, time, gain){
  const buf = SND[name]; if(!buf) return;
  const s = audioCtx.createBufferSource(); s.buffer = buf;
  const g = audioCtx.createGain(); g.gain.value = gain;
  s.connect(g); g.connect(tOut()); s.start(time);
}
const BOLS = {
  dha:(t)=>playBol("dha",t,1),
  dhin:(t)=>playBol("dhin",t,.9),
  ge:(t)=>playBol("ge",t,.95),
  na:(t)=>playBol("na",t,.85),
  ta:(t)=>playBol("ta",t,.85),
  tin:(t)=>playBol("tin",t,.7),
  ke:(t)=>playBol("ke",t,.5),
};
function tablaTick(){
  const T = TAALS[tablaTaal];
  while(tNext < audioCtx.currentTime + .12){
    const beat = tBeat % T.n;
    (BOLS[T.seq[beat]]||BOLS.na)(tNext);
    const delay = Math.max(0,(tNext - audioCtx.currentTime)*1000);
    const bshow = beat;
    setTimeout(()=>highlightBeat(bshow), delay);
    tNext += 60 / tablaBpm;
    tBeat++;
  }
}
function highlightBeat(b){
  document.querySelectorAll(".mt").forEach((el,i)=>el.classList.toggle("on", i===b));
  const bar = $("tablabartxt");
  if(bar) bar.textContent = `🥁 ${tablaTaal} · ${tablaBpm} BPM · ${b+1}`;
}
window.tablaToggle = async ()=>{
  if(tablaOn){ tablaStop(); return; }
  actx();
  if(!SND.dha){ toast("🥁 Loading sounds…"); await loadSounds(); }
  if(!SND.dha) return toast("Sound files missing — upload the sounds folder.", true);
  tablaOn = true;
  tBeat = 0; tNext = audioCtx.currentTime + .08;
  tTimer = setInterval(tablaTick, 25);
  $("tablabar").style.display = "flex";
  const btn = $("tb-play"); if(btn) btn.textContent = "⏹ Stop";
};
window.tablaStop = ()=>{
  tablaOn = false; clearInterval(tTimer);
  $("tablabar").style.display = "none";
  document.querySelectorAll(".mt.on").forEach(el=>el.classList.remove("on"));
  const btn = $("tb-play"); if(btn) btn.textContent = "▶ Play";
};
window.tablaSetTaal = (v)=>{ tablaTaal = v; tBeat = 0; drawMatras(); };
window.tablaSetBpm = (v)=>{
  tablaBpm = Math.max(40, Math.min(220, parseInt(v)||92));
  localStorage.setItem("bhajan-bpm", tablaBpm);
  const n = $("tb-bpmnum"), s = $("tb-bpm");
  if(n) n.textContent = tablaBpm;
  if(s) s.value = tablaBpm;
};
function drawMatras(){
  const el = $("tb-matras"); if(!el) return;
  const T = TAALS[tablaTaal];
  el.innerHTML = T.seq.map((bol,i)=>`
    <div class="mt ${i===0?"sam":""} ${i===T.khaali-1?"kh":""}">
      <b>${i+1}</b><span>${bol}</span>
    </div>`).join("");
}

/* ================= tanpura keyboard ================= */
window.openTanpura = ()=>{
  const div = document.createElement("div");
  div.className = "overlay";
  div.onclick = (e)=>{ if(e.target===div) div.remove(); };
  const keys = SCALES.map(s=>`
    <button class="tanp-key ${s[2]?"k-black":"k-white"} ${shrutiNote===s[0]?"playing":""}" data-note="${s[0]}"
      onclick="toggleShruti('${s[0]}', event); this.closest('.overlay').querySelectorAll('.tanp-key').forEach(k=>k.classList.toggle('playing', k.dataset.note===window.__sn()));">
      <b>${s[0]}</b><span>${s[1]}</span>
    </button>`).join("");
  div.innerHTML = `
    <div class="reader" style="max-width:560px;height:auto;max-height:90vh">
      <div class="reader-head">
        <div><h3>🎵 Riyaz — Tanpura + Tabla</h3><div class="rm2">${t("shrutiHint")}</div></div>
        <button class="btn btn-ghost" onclick="this.closest('.overlay').remove()">✕</button>
      </div>
      <div class="reader-body">
        <div class="tanp-grid">${keys}</div>

        <div class="tabla-panel">
          <div class="tp-head">🥁 Tabla</div>
          <div class="tp-row">
            <select onchange="tablaSetTaal(this.value)" style="flex:1">
              ${Object.keys(TAALS).map(k=>`<option ${k===tablaTaal?"selected":""}>${k}</option>`).join("")}
            </select>
            <button class="btn btn-gold" id="tb-play" onclick="tablaToggle()">${tablaOn?"⏹ Stop":"▶ Play"}</button>
          </div>
          <div class="tp-row" style="align-items:center">
            <button class="ab" onclick="tablaSetBpm(tablaBpmGet()-4)">−</button>
            <input type="range" id="tb-bpm" min="40" max="220" value="${tablaBpm}" oninput="tablaSetBpm(this.value)" style="flex:1;padding:0">
            <button class="ab" onclick="tablaSetBpm(tablaBpmGet()+4)">＋</button>
            <span style="min-width:74px;text-align:right;font-weight:700;color:var(--gold-ink)"><span id="tb-bpmnum">${tablaBpm}</span> BPM</span>
          </div>
          <div class="tb-matras" id="tb-matras"></div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(div);
  drawMatras();
};
window.tablaBpmGet = ()=> tablaBpm;
window.__sn = ()=> shrutiNote;

/* ================= setlist picker ================= */
window.openPicker = (sid)=>{
  const sets = getSets(); const s = sets.find(x=>x.id===sid); if(!s) return;
  const div = document.createElement("div");
  div.className = "overlay";
  div.onclick = (e)=>{ if(e.target===div){ div.remove(); render(); } };
  const chosen = new Set(s.items);
  function rowsHtml(q){
    let list = bhajans;
    if(q) list = bhajans.map(b=>[searchScore(b.name+" "+(b.singer||""), q), b]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
    return list.slice(0,300).map(b=>`
      <div class="pk ${chosen.has(b.id)?"sel":""}" data-id="${b.id}">
        <span class="cb">${chosen.has(b.id)?"✓":""}</span>
        <div style="min-width:0"><div class="nm">${esc(b.name)}</div><div class="si">${b.singer?esc(b.singer):""}${b.scale?` · ${b.scale}`:""}</div></div>
      </div>`).join("");
  }
  div.innerHTML = `
    <div class="picker">
      <div class="picker-head">
        <input id="pk-q" placeholder="${t("search")}">
        <button class="btn btn-gold" id="pk-done">${t("pickDone")}</button>
      </div>
      <div class="picker-list" id="pk-list">${rowsHtml("")}</div>
    </div>`;
  document.body.appendChild(div);
  const listEl = div.querySelector("#pk-list");
  listEl.addEventListener("click", (e)=>{
    const row = e.target.closest(".pk"); if(!row) return;
    const id = row.dataset.id;
    if(chosen.has(id)){ chosen.delete(id); row.classList.remove("sel"); row.querySelector(".cb").textContent=""; }
    else{ chosen.add(id); row.classList.add("sel"); row.querySelector(".cb").textContent="✓"; }
  });
  let deb;
  div.querySelector("#pk-q").addEventListener("input", (e)=>{
    clearTimeout(deb);
    deb = setTimeout(()=>{ listEl.innerHTML = rowsHtml(e.target.value); }, 150);
  });
  div.querySelector("#pk-done").onclick = ()=>{
    const sets2 = getSets(); const s2 = sets2.find(x=>x.id===sid);
    if(s2){
      const kept = s2.items.filter(id=>chosen.has(id));
      const added = [...chosen].filter(id=>!s2.items.includes(id));
      s2.items = [...kept, ...added];
      saveSets(sets2);
    }
    div.remove(); render();
  };
};

/* ================= perform mode ================= */
window.shareSetlist = (sid, ev)=>{
  if(ev) ev.stopPropagation();
  const s = getSets().find(x=>x.id===sid); if(!s) return;
  const items = s.items.map(id=>bhajans.find(b=>b.id===id)).filter(Boolean);
  let txt = `🎼 *${s.name}*\n`;
  items.forEach((b,i)=>{
    const sc = b.scale ? ` — ${b.scale}·${(SCALES.find(x=>x[0]===b.scale)||[])[1]||""}` : "";
    txt += `${i+1}. ${b.name}${sc}\n`;
  });
  txt += `\n🪕 Shyam Bhajan Sangrah\n${location.origin + location.pathname}`;
  window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank", "noopener");
};

window.performSet = (sid)=>{
  const s = getSets().find(x=>x.id===sid); if(!s || !s.items.length) return;
  const items = s.items.map(id=>bhajans.find(b=>b.id===id)).filter(Boolean);
  if(!items.length) return;
  let i = 0;
  const div = document.createElement("div");
  div.className = "overlay";
  function draw(){
    const b = items[i];
    div.innerHTML = `
      <div class="perform">
        <div class="pf-head">
          <button class="btn btn-ghost" onclick="this.closest('.overlay').remove();stopShruti()">✕</button>
          <span style="font-family:var(--fd)">🎼 ${esc(s.name)}</span>
          <span class="pf-prog">${i+1} / ${items.length}</span>
        </div>
        <div class="pf-main">
          <h2>${esc(b.name)}</h2>
          ${b.singer?`<div style="color:var(--dim)">🎤 ${esc(b.singer)}</div>`:""}
          ${b.scale?`<div class="pf-scale">${scMini(b.scale)}</div><div class="hint">${t("shrutiHint")}</div>`:""}
          <div class="pf-acts">
            ${hasAnyLyrics(b)?`<button class="btn btn-teal" onclick="openLyrics('${b.id}')">${ICONS.doc} Lyrics</button>`:""}
            <a class="btn btn-ghost" href="https://www.youtube.com/results?search_query=${encodeURIComponent(b.name+" "+(b.singer||"")+" bhajan")}" target="_blank" rel="noreferrer">▶ YouTube</a>
          </div>
        </div>
        <div class="pf-nav">
          <button ${i===0?"disabled":""} id="pf-prev">←</button>
          <button class="main" id="pf-next">${i===items.length-1 ? "✓" : "→"}</button>
        </div>
      </div>`;
    div.querySelector("#pf-prev").onclick = ()=>{ if(i>0){ i--; stopShruti(); draw(); } };
    div.querySelector("#pf-next").onclick = ()=>{
      if(i<items.length-1){ i++; stopShruti(); draw(); }
      else{ div.remove(); stopShruti(); }
    };
  }
  draw();
  document.body.appendChild(div);
};
function b_sessionPreselect(){
  /* when editing, preselect the bhajan's live */
  if(tab!=="add"||!editingId) return false;
  const b = bhajans.find(x=>x.id===editingId);
  const sel = $("f-session");
  if(b && sel && b.sessionId) sel.value = b.sessionId;
  return true;
}
function renderBulkPreview(){
  const el = $("bulkzone"); if(!el) return;
  el.innerHTML = bulkRows.length ? `
    <div class="preview">
      <div class="preview-head">${t("previewHead")} ${bulkRows.length} ${t("found")} <span>${t("previewHint")}</span></div>
      <div class="preview-rows">
        ${bulkRows.map((r,i)=>`
        <div class="prow">
          <span class="num">${i+1}.</span>
          <input value="${esc(r.name)}" oninput="bulkEdit('${r.key}','name',this.value)">
          <input class="time" placeholder="h:mm:ss" value="${esc(r.time)}" oninput="bulkEdit('${r.key}','time',this.value)">
          <button class="x" onclick="bulkRemove('${r.key}')">✕</button>
        </div>`).join("")}
      </div>
    </div>
    <button class="btn btn-gold btn-big" style="margin-top:14px" onclick="importBulk()">⚡ ${t("addAll")} ${bulkRows.length} ${t("addAllSuffix")}</button>` : "";
}
function renderListOnly(){
  const el = $("bhajan-list");
  if(!el) return;
  let list = filtered();
  if(!list.length){
    el.innerHTML = `<div class="empty"><span class="om">🪔</span>${
      bhajans.length===0 ? t("emptyAll") : favOnly ? t("emptyFavs") : t("emptyFilter")
    }</div>`;
    const oldRail = document.getElementById("azrail"); if(oldRail) oldRail.remove();
    return;
  }
  let letters = [];
  let chunks = [];   // array of html strings, rendered progressively
  if(search.trim()){
    // ranked results: best matches first
    for(let i=0;i<list.length;i+=80) chunks.push(list.slice(i,i+80).map(bhajanRow).join(""));
  }else if(sortBy === "recent" || sortBy === "views"){
    list = [...list].sort(sortBy==="recent"
      ? (a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0)
      : (a,b)=>((b.views||0)-(a.views||0)));
    for(let i=0;i<list.length;i+=80) chunks.push(list.slice(i,i+80).map(bhajanRow).join(""));
  }else{
    const groups = {};
    for(const b of list){
      let ch = (b.name.trim()[0]||"#").toUpperCase();
      if(!/[A-Z]/.test(ch) && !/[\u0900-\u097F]/.test(ch)) ch = "#";
      (groups[ch] = groups[ch]||[]).push(b);
    }
    letters = Object.keys(groups).sort();
    let buf = "", count = 0;
    for(const L of letters){
      buf += `<div class="alpha" id="sec-${L==="#"?"num":L.charCodeAt(0)}">${L}</div>` + groups[L].map(bhajanRow).join("");
      count += groups[L].length;
      if(count >= 80){ chunks.push(buf); buf=""; count=0; }
    }
    if(buf) chunks.push(buf);
  }

  // progressive render: first chunk immediately, rest on idle (keeps phones snappy)
  el.innerHTML = `<div class="listbox" id="listbox-inner">${chunks[0]||""}</div>`;
  const inner = $("listbox-inner");
  _pending = chunks; _pendingIdx = 1; _inner = inner;
  function next(){
    if(_pendingIdx >= _pending.length || !document.body.contains(_inner)) return;
    _inner.insertAdjacentHTML("beforeend", _pending[_pendingIdx++]);
    (window.requestIdleCallback||setTimeout)(next, 1);
  }
  (window.requestIdleCallback||setTimeout)(next, 1);
  watchSections();

  // A-Z jump rail
  const oldRail = document.getElementById("azrail"); if(oldRail) oldRail.remove();
  if(sortBy==="az" && letters.length > 4){
    const rail = document.createElement("div");
    rail.className = "azrail"; rail.id = "azrail";
    rail.innerHTML = letters.map(L=>`<button onclick="jumpTo('sec-${L==="#"?"num":L.charCodeAt(0)}')">${L}</button>`).join("");
    document.body.appendChild(rail);
  }
}
