<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, writeBatch, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app = initializeApp(window.FIREBASE_CONFIG);
const db = getFirestore(app);
const bhajansCol = collection(db, "bhajans");
const $ = id => document.getElementById(id);
const log = m => { const l=$("log"); l.textContent += m+"\n"; l.scrollTop=l.scrollHeight; };

window.run = async ()=>{
  $("start").disabled = true;
  try{
    log("Loading existing bhajans…");
    const snap = await getDocs(bhajansCol);
    const existing = new Set(snap.docs.map(d=>(d.data().name||"").trim().toLowerCase()));
    log(`Found ${existing.size} existing.`);
    const D = window.DATA;
    let added=0, skip=0, i=0;
    let batch = writeBatch(db), inBatch=0;
    for(const m of D){
      i++;
      $("fill").style.width = Math.round(i/D.length*100)+"%";
      $("stat").textContent = `${i}/${D.length} — ${m.n.slice(0,50)}`;
      if(existing.has(m.n.trim().toLowerCase())){ skip++; continue; }
      batch.set(doc(bhajansCol), {
        name:m.n, singer:m.s||"", scale:"", seconds:0, sessionId:"",
        notes:"", lyricsLink:m.l||"", lyricsText:"", hasFiles:false,
        addedBy:"Import", createdAt: serverTimestamp()
      });
      added++; inBatch++;
      if(inBatch>=200){ await batch.commit(); log(`✓ ${added} written…`); batch=writeBatch(db); inBatch=0; }
    }
    if(inBatch>0) await batch.commit();
    $("stat").textContent = "DONE!";
    log(`\n🎉 FINISHED — added: ${added}, skipped (already existed): ${skip}`);
    log("Open your app — then DELETE import2.html from GitHub.");
  }catch(e){
    console.error(e); log("✗ ERROR: "+(e.message||e));
    $("start").disabled = false;
  }
};
</script>
