<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const app = initializeApp(window.FIREBASE_CONFIG);
const db = getFirestore(app);
const bhajansCol = collection(db, "bhajans");
const filesCol = collection(db, "lyricsFiles");

const $ = id => document.getElementById(id);
const log = m => { const l=$("log"); l.textContent += m+"\n"; l.scrollTop=l.scrollHeight; };
let zipData = null;

$("zip").onchange = async (e)=>{
  const f = e.target.files[0]; if(!f) return;
  $("stat").textContent = "Reading zip…";
  zipData = await JSZip.loadAsync(f);
  $("start").disabled = false;
  $("stat").textContent = "Zip loaded — press Start.";
};

function canvasToJpeg(canvas, q){ return canvas.toDataURL("image/jpeg", q); }
async function compressImageBlob(blob){
  const img = await createImageBitmap(blob);
  const maxW = 1100, scale = Math.min(1, maxW/img.width);
  const c = document.createElement("canvas");
  c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  let d = canvasToJpeg(c, .72);
  if(d.length > 480000) d = canvasToJpeg(c, .5);
  return d;
}
async function pdfToImages(arrayBuf){
  const pdf = await pdfjsLib.getDocument({data: arrayBuf}).promise;
  const pages = Math.min(pdf.numPages, 6);
  const out = [];
  for(let p=1; p<=pages; p++){
    const page = await pdf.getPage(p);
    let vp = page.getViewport({scale: 1});
    const scale = Math.min(2, 1000/vp.width);
    vp = page.getViewport({scale});
    const c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height;
    await page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
    let d = canvasToJpeg(c, .68);
    if(d.length > 480000) d = canvasToJpeg(c, .5);
    out.push(d);
  }
  return out;
}

window.run = async ()=>{
  $("start").disabled = true;
  log("Loading existing bhajans (to skip already-imported)…");
  const snap = await getDocs(bhajansCol);
  const existing = new Set(snap.docs.map(d=>(d.data().name||"").trim().toLowerCase()));
  log(`Found ${existing.size} bhajans already in the app.`);

  const M = window.MANIFEST;
  let done=0, added=0, skip=0, fail=0;
  for(const m of M){
    done++;
    $("fill").style.width = Math.round(done/M.length*100)+"%";
    $("stat").textContent = `${done}/${M.length} — ${m.n.slice(0,50)}`;
    try{
      if(existing.has(m.n.trim().toLowerCase())){ skip++; continue; }
      const zf = zipData.file(m.f);
      if(!zf){ log("⚠ missing in zip: "+m.f); fail++; continue; }
      let images = [];
      if(m.t === "pdf"){
        const buf = await zf.async("arraybuffer");
        images = await pdfToImages(buf);
      }else{
        const blob = await zf.async("blob");
        images = [await compressImageBlob(blob)];
      }
      const bd = await addDoc(bhajansCol, {
        name: m.n, singer: m.s || "", scale: "", seconds: 0, sessionId: "",
        notes: m.g || "", lyricsLink: "", lyricsText: "", hasFiles: images.length>0,
        addedBy: "Import", createdAt: serverTimestamp()
      });
      for(let i=0;i<images.length;i++){
        await addDoc(filesCol, {bhajanId: bd.id, type:"image", data: images[i], name:"", order:i, createdAt: serverTimestamp()});
      }
      added++;
      if(added % 10 === 0) log(`✓ ${added} imported so far…`);
    }catch(err){
      console.error(err); fail++;
      log("✗ failed: "+m.n.slice(0,40)+" — "+(err.message||err));
    }
  }
  $("stat").textContent = "DONE!";
  log(`\n🎉 FINISHED — added: ${added}, skipped (already existed): ${skip}, failed: ${fail}`);
  log("Now open your app — everything is there. You can DELETE import.html from GitHub.");
};
</script>
